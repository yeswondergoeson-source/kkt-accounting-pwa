用・損失の発\n 生が、(2)______________に起因していること、その費用・損失の(3)______________の可\n 能性が高く、その金額を(4)______________ことができることが挙げられる。", "answer": "(1)特定の費用または\n損失\n(2)当期またはそれ以前\n の事象\n(3)発生\n(4)合理的に見積もる", "topic": "引当金\n設定の\n要件", "chapter": 10}, {"no": 299, "page": 108, "type": "正答選\n択", "question": "適正な期間損益の算定という目的からみて、引当金が妥当なものとして認められるために満たさなけれ\n ばならない要件として、\n （Ａ）将来の特定の費用または損失に関するものであること\n （Ｂ）その費用・損失の発生が、当期またはそれ以後の事象に起因していること\n （Ｃ）その費用・損失の発生の可能性が高く、その金額を合理的に見積もることができることが挙げら\n れる。\n （Ｄ）全て誤り", "answer": "A,C\n・引当金の設定要件：\n①将来の特定の費用ま\n たは損失\n②その費用・損失の発\n 生が当期またはそれ以\n 前の事象に起因\n③発生の可能性が高い\n④金額を合理的に見積\n もることができる", "topic": "引当金\n設定の\n要件", "chapter": 10}, {"no": 300, "page": 109, "type": "誤答選\n択", "question": "（Ａ）引当金が妥当なものとして認められるために満たさなければならない要件のひとつとして、その費\n 用・損失の発生が将来の特定の事象に起因していることがある。\n（Ｂ）負債たる引当金には、退職給付引当金や製品保証引当金のような条件付債務と修繕引当金\n に代表されるような債務以外の経済的負担が含まれる。\n（Ｃ）会計理論上は正当な引当金とは認められないが、引当金と混同されやすい項目の典型例とし\n て租税特別措置法で規定された海外投資等損失準備金がある。\n（Ｄ）保険業法などの特別の法令上の準備金は、負債性引当金と区別するために、特別法上の準\n 備金（又は引当金）という区分を設けて記載しなければならない。", "answer": "A\n・引当金の設定要件：\n①将来の特定の費用ま\n たは損失\n②その費用・損失の発\n 生が当期またはそれ以\n 前の事象に起因\n③発生の可能性が高い\n④金額を合理的に見積\n もることができる", "topic": "引当金\n設定の\n要件", "chapter": 10}, {"no": 301, "page": 109, "type": "穴埋め", "question": "引当金はその性質により、(1)______________から控除する引当金と、負債たる引当金に大別さ\n れる。貸倒引当金は売掛金等からの控除によって債権の回収可能価額を評価していると考えられると\n ころから、(2)______________とよばれることがある。他方、負債たる引当金は貸借対照表の負\n 債の部に計上される項目であり、こえには退職給付引当金や製品保証引当金のような\n (3)______________と修繕引当金に代表されるような債務以外の(4)______________が\n 含まれる。これらは負債の部に計上されることから(5)______________とよばれることがある。", "answer": "(1)資産\n(2)評価性引当金\n(3)条件付債務\n(4)経済的負担\n(5)負債性引当金", "topic": "引当金\nの種類\nと区分\n表示", "chapter": 10}, {"no": 302, "page": 109, "type": "正答選\n択", "question": "負債性引当金の代表例としては、\nア．退職給付引当金\nイ．貸倒引当金\n ウ．修繕引当金がある。\n エ．すべて誤り", "answer": "ア,ウ\n・貸倒引当金は評価性\n 引当金である", "topic": "引当金\nの種類\nと区分\n表示", "chapter": 10}, {"no": 303, "page": 110, "type": "誤答選\n択", "question": "（Ａ）有形固定資産に関して行われる支出には、当該固定資産め原価に算入されて資産となる資本\n 的支出と、固定資産の原価とせず支出年度の費用として取扱われる収益的支出がある。8 リース取\n 引には、ファイナンス・リース取引とオペレーティング・リース取引があり、（a）解約不能の条件、および\n （b）フルベイアウトの条件を満たすものはファイナンス・リース取引に分類される。\n （c）繰延資産は、対応原則に基づき、当期の支出額を将来の収益に対応させて適切な期間利益\n を算定する目的で計上される資産項目である。この点に関する限り、有形固定資産や前払費用なども\n 同じであるが、繰延資産は換金能力を有さず、会計学上の対応原則によって初めて資産計上が正当\n 化される項目である点で相違する。繰延資産は会計的資産とも呼ばれる。\n（B）企業会計原則の注解18 が明示する要件(a)将来の特定の費用または損失である、(b)その発\n 生が当期以前の事象に起因する、(c)その発生の可能性が高い、(d)その金額を合理的に見積もるこ\n とができるを満たして設定される引当金は、その性質により、純資産から控除する引当金と負債たる引\n 当金に大別される。", "answer": "B\n・純資産→資産", "topic": "引当金\nの種類\nと区分\n表示", "chapter": 10}, {"no": 304, "page": 110, "type": "穴埋め", "question": "会計理論上は正当な引当金とは認められないが、引当金と混同されやすい項目の典型例として(1)\n ______________性の準備金がある。その典型例は国外での資源開発事業への投資を促進する\n ために租税特別措置法で規定された(2) ______________準備金である。一般的に利益留保\n 性の準備金と考えられている準備金の中で、負債の部への計上が強制されているものは、水力発電を\n 行う会社が渇水期の収益減少に備えて豊水期に計上を要求される(3) ______________、証券\n 会社などが顧客との間で発生するトラブルに対処するために設定を要する(4) ______________、\n および保険会社が保険金支払に備えて設定しなければならない(5)______________である。これ\n ら特別法上の準備金は負債性引当金と区別するために、流動負債、固定負債の次に\n (6)______________の準備金（又は引当金）という区分を設けて記載しなければならない。", "answer": "(1)利益留保\n(2)海外投資等損失\n(3)渇水準備引当金\n(4)金融商品取引責任\n準備金\n(5)責任準備金\n(6)特別法上", "topic": "利益留\n保性の\n準備金", "chapter": 10}, {"no": 305, "page": 111, "type": "正答選\n択", "question": "一般的に利益留保性の準備金と考えられている準備金の中で、負債の部への計上が強制されているも\n のは、\n （Ａ）証券会社などが顧客との間で発生するトラブルに対処するために設定する「金融商品取引責\n 任準備金」\n （Ｂ）国外での資源開発事業への投資を促進するために、租税特別措置法で規定された「海外投\n 資等損失準備金」\n （Ｃ）保険会社が保険金支払に備えて設定する「責任準備金」である。\n （Ｄ）全て誤り", "answer": "A,C\n・金融商品取引責任準\n 備金、責任準備金は\n 特別法上の準備金と\n して負債の部への計上\n が強制される", "topic": "利益留\n保性の\n準備金", "chapter": 10}, {"no": 306, "page": 111, "type": "穴埋め", "question": "株式会社のように法人の形態をとる企業には、その課税所得に対して(1)______________、\n (2)______________および(3)______________という3 種類の税金が課される。損益計算\n 書で税引前当期純利益の次に(4)______________や(5)______________の科目名で費\n 用として計上する。", "answer": "(1)法人税\n(2)住民税\n(3)事業税\n(4)法人税、住民税及\n び事業税\n(5)法人税等", "topic": "税金の\n申告と\n納付", "chapter": 10}, {"no": 307, "page": 111, "type": "正答選\n択", "question": "株式会社のように法人の形態をとる企業には、その課税所得に対して課される税金には、\n ア．法人税\n イ．住民税\n ウ．事業所税がある。\n エ．すべて誤り", "answer": "ア,イ\n・事業所税→事業税", "topic": "税金の\n申告と\n納付", "chapter": 10}, {"no": 308, "page": 112, "type": "誤答選\n択", "question": "（Ａ）わが国で、課税所得額に基づいて企業に課される税金には、法人税・事業税の2 つがある。損\n 益計算書では、法人税・事業税の額は税引前当期純利益の次に記載して控除し、これに法人税等\n 調整額を加減した残額が当期純利益となる。\n（Ｂ）経常利益は、企業の当期の業績の良否を判断するための重要な尺度であることから、当期業\n 績主義による利益といわれる。\n（Ｃ）損益計算書本体の簡潔性を保ちつつ、重要事項に関する情報を詳細に伝達する手法として、\n 注記が活用されている。たとえば重要な会計方針、重要な後発事象、および勘定科目の内容や内訳\n の説明などがそれである。\n（Ｄ）日本の財務諸表において、当期の業績として損益計算書の最後に導出されるのは当期純利益\n である。しかしアメリカの会計基準や国際会計基準に準拠した財務諸表では「包括利益」とよばれる利\n 益額が財務諸表で測定・表示されている。この包括利益は資産負債アプローチとの親和性が高い利\n 益概念である。", "answer": "A\n・企業に課される税金に\n は法人税・事業税に\n 加えて住民税がある", "topic": "税金の\n申告と\n納付", "chapter": 10}, {"no": 309, "page": 112, "type": "穴埋め", "question": "・発生主義会計のもとでの税金費用と税務上の負債は、課税の源泉となる取引や事象が発生した期\n 間に、税引前利益に対応づけて計上する必要がある。この目的のために、納税義務額を期間配分す\n る会計手続を(1)______________という。\n・当期に生じた不一致が将来にわたって永久に解消されないタイプの差異を(2)______________と\n いう。他方、当期に生じた不一致が将来の会計期間において解消すると予想されるタイプの差異を\n (3)______________という。期間差異と資産・負債の評価差額をあわせて、\n (4)______________という。\n・税効果会計の目的を、収益・費用アプローチに立脚し、税引前利益に対応した的確な金額での税金\n 費用の計上だけに限定するのであれば、期間差異を税効果会計の適用にすれば十分である。この方\n 法を(5)______________という。他方、資産・負債アプローチに立脚して、財務会計と税務会計\n の差異に起因する税金関係の資産と負債の網羅的な計上をも目的に含めるなら、税効果会計の適\n 用範囲は一時差異にまで拡大される。これを(6)______________という。", "answer": "(1)税効果会計\n(2)永久差異\n(3)期間差異\n(4)一時差異\n(5)繰延法\n(6)資産負債法", "topic": "税効果\n会計の\n必要性", "chapter": 10}, {"no": 310, "page": 113, "type": "穴埋め", "question": "・将来(1)______________一時差異は解消時に課税所得を増額する効果をもつタイプの差異で\n あり発生した当期において、将来の税金の増加分を当期の税金費用に追加計上するとともに\n (2)______________という名称で負債にも追加計上しなければならない。将来\n (3)______________一時差異は解消時に課税所得を減額する効果を持つタイプの差異であり、\n 当期に費用計上した法人税等から減額調整するとともに(4)______________という名称で資産\n を認識する必要がある。\n・税効果会計の仕訳で生じる(5)______________は、権利義務確定主義に基づいて費用計上さ\n れた法人税等の額を、発生主義の金額へ調整するために税金費用を追加計上するものである。\n・税法の改正により将来の法定実効税率が変化する場合、繰延税金の額は一時差異の\n (6)______________年度の税率によって計算する。税引前利益と税金費用の対応を重視する\n 繰延法では、差異の(7)______________年度の税率の適用が論理的に整合するが、現行の会\n 計基準は(8)______________に立脚するので、法定実効税率の変化に伴う繰延税金の増減額\n は、税率変更が確定した年度で認識される。\n・法律上の納税主体が同一なら、繰延税金資産と繰延税金負債は(9)______________して残\n 高を表示するが、納税主体が異なる場合は、相殺せずに両方を表示する。", "answer": "(1)加算\n(2)繰延税金負債\n(3)減算\n(4)繰延税金資産\n(5)法人税等調整額\n(6)解消\n(7)発生\n(8)資産負債法\n(9)相殺", "topic": "繰延税\n金資産\nと繰延\n税金負\n債", "chapter": 10}, {"no": 311, "page": 113, "type": "誤答選\n択", "question": "（Ａ）負債性引当金には、退職給付引当金などのような「条件付債務」と、修繕引当金などのような\n 「債務以外の経済的負担」が含まれる。\n（Ｂ）「税効果会計に係る会計基準」では、「繰延法」ではなく「資産負債法」の適用を規定している。\n（Ｃ）税法の改正により将来の法定実効税率が変化する場合、繰延税金の額は一時差異の発生年\n 度の税率によって計算する。\n（Ｄ）「偶発債務が現実の債務となることが、ある程度まで予想されるが、その可能性が高いとはいえな\n い場合」や、「偶発債務に伴う損失額の合理的見積りができない場合」には、引当金の計上が認めら\n れないため偶発債務の内容を貸借対照表に注記する。", "answer": "C\n・現行の会計基準は資\n 産負債法に立脚する\n ため解消年度の税率\n によって計算する", "topic": "繰延税\n金資産\nと繰延\n税金負\n債", "chapter": 10}, {"no": 312, "page": 114, "type": "正答選\n択", "question": "固定負債に計上されうるものには、\nア．繰延税金負債\nイ．電子記録債務\n ウ．前受収益がある。\n エ．すべて誤り", "answer": "ア\n・その他は流動負債", "topic": "繰延税\n金資産\nと繰延\n税金負\n債", "chapter": 10}, {"no": 313, "page": 114, "type": "正答選\n択", "question": "将来減算一時差異に該当する例としては、\n ア．貸倒引当金繰入額のうち税法の限度額を超える部分\n イ．剰余金の処分で設定した海外投資等損失準備金\n ウ．当期純利益の計算に含めない時価評価差益がある。\n エ．すべて誤り", "answer": "ア\n・その他は一時差異には\n 該当しない", "topic": "繰延税\n金資産\nと繰延\n税金負\n債", "chapter": 10}, {"no": 314, "page": 114, "type": "誤答選\n択", "question": "（Ａ）繰延税金の金額計算法には、適用する税率の違いにより、繰延法と資産負債法がある。\n（Ｂ）税法の限度額を超える退職給付引当金への繰入れなどを行った場合に生じる差異は将来減\n 算一時差異に該当する。\n（Ｃ）将来減算一時差異は繰延税金負債として計上される。\n（Ｄ）税効果会計のうち、期間差異は、当期に生じた損益計算書上の収益・費用額と、課税所得上\n の益金・損金額の不一致が将来の会計期間において解消すると予想されるタイプの差異である。", "answer": "C\n・繰延税金負債→繰延\n税金資産", "topic": "繰延税\n金資産\nと繰延\n税金負\n債", "chapter": 10}, {"no": 315, "page": 114, "type": "誤答選\n択", "question": "（Ａ）貸借対照表の純資産の部に直接に計上した評価損に関する税効果額については、評価差額\n の総額から控除して繰延税金負債を計上する。\n（Ｂ）税務上で是認される限度を超えて貸倒引当金の繰入を行ったことによって生じた差異は、実際\n に貸倒れが発生する将来の時点で解消されるため、税効果会計の適用対象となる。\n（Ｃ）将来加算一時差異は解消時に課税所得を増額する効果をもつ。\n（Ｄ）会計利益と課税所得の間の期間差異は、損益計算面だけでなく、資産・負債の金額について\n も不一致をもたらす。", "answer": "A\n・繰延税金負債→繰延\n税金資産", "topic": "繰延税\n金資産\nと繰延\n税金負\n債", "chapter": 10}, {"no": 316, "page": 115, "type": "誤答選\n択", "question": "（Ａ）税法は、業績の安定した企業と変動の激しい企業への課税を公平にする目的で、当期に生じた\n 課税所得のマイナス類を、将来7 年間の課税所得と相殺することを許容している。\n（Ｂ）法定実効税率は、（法人税率+住民税率+事業税率）÷（1+事業税率）にて計算され\n る。\n（Ｃ）税効果会計の仕訳で生じる「法人税等調整額」は、法人税等として納付すべき額とは区分し\n て、損益計算書の税引前当期純利益に加算または減算して表示する。\n（Ｄ）繰延税金資産と繰延税金負債の両方が出現した場合には、流動区分と固定区分のそれぞれ\n の範囲内で、それらは相殺して表示される。", "answer": "B\n・住民税率は法人税率\n に対する割合として算\n 式上反映する", "topic": "繰延税\n金資産\nと繰延\n税金負\n債", "chapter": 10}, {"no": 317, "page": 115, "type": "誤答選\n択", "question": "（Ａ）特別の法令の中には所定の準備金を負債の部に計上することを強制しているものがある。たとえ\n ば、保険金杜が保険金支払に備えて設定しなければならない「責任準備金」がその初である。これらの\n 準備金は、一般には利益留保性の準備金であると考えられる。\n（Ｂ）繰延税金の金額計算法には、適用する税率の違いにより、繰延法と資産負債法がある。繰延\n 法は将来期間における前払税金の回収額または追加支払額の計上を重視するから、繰延税金の額\n は一時差異の解消年度の税率によって計算する。\n（Ｃ）未払金は、固定資産や有価証券の購入など、企業の主たる営業活動以外の取引から生じた\n 未払いの金額である。\n（Ｄ）前受収益は、一定の契約に従い、継続して役務の提供を行う場合に、いまだ提供していない役\n 務に対して、前もって支払を受けた対価をいう。", "answer": "B\n・解消→発生", "topic": "繰延税\n金資産\nと繰延\n税金負\n債", "chapter": 10}, {"no": 318, "page": 115, "type": "穴埋め", "question": "企業が行う主たる営業活動に伴って負担する債務には、(1)、(2)、(3)______________がある。\n 仕入代金の支払を手形という紙媒体ではなく、電子記録された債務の発生によって行った場合は、こ\n れを(4)______________として区別する。", "answer": "(1)買掛金\n(2)支払手形\n(3)前受金\n(4)電子記録債務", "topic": "営業上\nの債務", "chapter": 10}, {"no": 319, "page": 116, "type": "正答選\n択", "question": "企業が行う主たる営業活動に伴って負担する債務には、\n ア．預り金\n イ．未払費用\n ウ．前受収益が含まれる。\n エ．すべて誤り", "answer": "エ\n・その他は営業外債務", "topic": "営業上\nの債務", "chapter": 10}, {"no": 320, "page": 116, "type": "穴埋め", "question": "・(1)______________には、借用証書を発行して行う金銭の借入のほか、資金調達の目的で振\n 出した金融手形や銀行の当座借越が含まれる。\n・固定資産や有価証券の購入など、企業の主たる営業活動以外の取引から生じた未払いの金額を\n (2)______________という。\n・一定の契約に従い、継続して役務の提供を受ける場合に、すでに提供を受けた役務に対して、いまだ\n その対価の支払が終わらないものを(3)______________という。\n・一定の契約に従い、継続して役務の提供を行う場合に、いまだ提供していない役務に対して、前もって\n 支払を受けた対価を(4)______________という。\n・(5)______________には従業員給与に対する源泉所得税や社会保険料の預かり額、従業員の\n 社内預金の預り額、取引先からの営業保証金の預かり額などが含まれる。", "answer": "(1)短期借入金\n(2)未払金\n(3)未払費用\n(4)前受収益\n(5)預り金", "topic": "営業債\n務以外\nの流動\n負債", "chapter": 10}, {"no": 321, "page": 116, "type": "穴埋め", "question": "販売した製品に関して保証を行っている企業が将来の無料修理の条件付債務を決算時に負債として\n 認識するとともに、同額をその期間の売上収益に対応する費用として計上するために設定する引当金\n を(1)______________という。このうち建設会社が建物等の工事に関して設定するものを、とくに\n (2)______________という。小売店のポイント制度のように、顧客に対して購買額の何％かを次\n 回の購買時に無料で利用が可能なポイントとして付与する企業は、その負担額を\n (3)______________として設定するのが一般的であったが「収益認識に関する会計基準」により\n 廃止された。", "answer": "(1)製品保証引当金\n(2)工事補償引当金\n(3)ポイント引当金", "topic": "短期の\n負債性\n引当金", "chapter": 10}, {"no": 322, "page": 117, "type": "穴埋め", "question": "・有価証券の一種である社債券を発行して資金調達を行なったことから生じる債務を(1)\n ______________という。会社法で発行が認められた社債には(2) ______________、\n (3)______________、(4)______________の3 種類がある。\n・普通社債を発行し、社債の発行価額と額面金額が異なる場合は(5)______________で算定し\n た金額をもってその社債の貸借対照表価額とする。その具体的な計算方法には実効利子率による複\n 利計算を前提にした(6)______________と、毎期均等額ずつ差額を配分する\n (7)______________がある。\n転換社債の発行企業は発行価額について、社債の対価部分と新株予約権の対価部分を区分しない\n (8)______________を採用し、普通社債と同様に(9)______________価額の全額を一括\n して負債に計上してもよいし、新株予約権付社債に準じて社債本体と新株予約権を\n (10)______________で処理してもよい。", "answer": "(1)社債\n(2)普通社債\n(3)転換社債\n(4)新株予約権付社債\n(5)償却原価法\n(6)利息法\n(7)定額法\n(8)一括法\n(9)発行\n(10)区分法", "topic": "社債", "chapter": 10}, {"no": 323, "page": 117, "type": "穴埋め", "question": "転換社債の(1)______________企業は(1)______________価額について、社債の対価部\n 分と新株予約権の対価部分を区分しない一括法を採用し、普通社債と同様に\n (1)______________価額の全額を一括して負債に計上してもよいし、新株予約権付社債に準じ\n て社債本体と新株予約権を区分法で処理してもよい。", "answer": "(1)発行", "topic": "社債", "chapter": 10}, {"no": 324, "page": 117, "type": "正答選\n択", "question": "会社法で発行が認められた社債に含まれているのは、\n（Ａ）転換社債\n（Ｂ）特定社債\n （Ｃ）新株予約権付社債である。\n （Ｄ）全て誤り", "answer": "A,C\n・特定社債は「資産の\n 流動化に関する法律」\n に規定する債券", "topic": "社債", "chapter": 10}, {"no": 325, "page": 117, "type": "正答選\n択", "question": "普通社債を発行し、社債の発行価額と額面金額が異なる場合、貸借対照表に計上する金額と額面\n 金額の差額の処理の計算方法には、\n ア．利息法\n イ．繰延法\n ウ．定率法がある。\n エ すべて誤り", "answer": "ア\n・差額の処理には利息\n 法と定額法がある", "topic": "社債", "chapter": 10}, {"no": 326, "page": 118, "type": "正答選\n択", "question": "会社法で発行が認められた社債には３種類あるが、その３種類とは、\nア．普通社債\n イ．転換社債\n ウ．新株予約権付社債である。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "社債", "chapter": 10}, {"no": 327, "page": 118, "type": "穴埋め", "question": "(1)______________は企業が長期資金を調達するための伝統的な手段であり分類には1 年基\n 準が適用される。", "answer": "(1)長期借入金", "topic": "長期借\n入金", "chapter": 10}, {"no": 328, "page": 119, "type": "穴埋め", "question": "・各期の退職給付の発生額は、(1)______________での評価額を算定する。当期発生額の割引\n 現在価値を(2)______________費用といい、過年度に計上された債務について生じる費用を\n (3)______________という。拠出された掛け金について基金が有価証券などで運用して収益を獲\n 得し。それを基金に組み入れて退職給付の財源とする退職給付費用の軽減分を\n (4)______________という。勤務費用+利息費用-期待運用収益相当額として算定される費用\n を(5)______________という。各年度末の貸借対照表に企業が計上すべき退職給付引当金の\n 金額は「発生済の退職給付債務-(6)______________額」となる。\n・退職給付制度の新設や支給水準の引上げが行われた場合に生じる退職給付引当金残高の不足を\n (7)______________と呼ぶ。年金費用の計算に用いる割引利子率や期待運用収益率などは予\n 想値であるから、実績値との間で事後的に差異が生じるが、これに起因して生じる退職給付引当金の\n 過不足額を(8)______________という。\n・発生時に一括計上するのでなく、将来期間にも按分する会計処理を(9)______________とい\n う。退職給付制度に関する個別財務諸表での会計処理に際して遅延認識が行えるものには、\n (10)______________と(11)______________がある。\n\n・「退職給付に関する会計基準」は連結財務諸表に限り、次の会計処理を追加的に行うことを規定す\n る。\n年金資産額が退職給付債務に満たない不足額を負債として追加計上するため、退職給付引当金を\n 含めた合計額を(12)______________という項目名で連結貸借対照表に計上する。\n将来の年度にも分割して負担させるべき未実現の損失である(13)______________は連結貸借\n 対照表の純資産の部で(14)______________の項目として計上される。", "answer": "(1)現価方式\n(2)勤務\n(3)利息\n(4)期待運用収益\n(5)退職給付費用\n(6)年金資産\n(7)過去勤務費用\n(8)数理計算上の差異\n(9)遅延認識\n(10)過去勤務費用\n(11)数理計算上の差\n異\n(12)退職給付に係る\n負債\n(13)退職給付に係る\n調整額\n(14)その他の包括利益\n累計額", "topic": "退職給\n付引当\n金", "chapter": 10}, {"no": 329, "page": 120, "type": "誤答選\n択", "question": "（Ａ）過去勤務費用および数理計算上の差異が無い場合、確定給付制度に係る各年度の退職給\n 付費用は「勤務費用＋利息費用－期待運用収益相当額」として算定され、各年度末の貸借対照\n 表に企業が計上すべき退職給付引当金の金額は「発生済の退職給付債務－年金資産額」となる。\n（Ｂ）退職給付制度の新設や支給水準の引上げが行われた場合には、従業員の過年度の勤労に関\n 連して、退職給付引当金の残高に大幅な不足が生じる。この額を過去勤務費用という。\n（Ｃ）年金費用の計算に用いる割引利子率や期待運用収益率などは予想値であるから、実績値との\n 間で事後的に差異が生じるが、これに起因して生じる退職給付引当金の過不足額を数理計算上の\n 差異という。\n（Ｄ）過去勤務費用や数理計算上の差異が発生した場合、個別財務諸表での計算においては、そ\n の全額を発生年度で一括して調整することとしている。", "answer": "D\n・差異は遅延認識が可\n能", "topic": "退職給\n付引当\n金", "chapter": 10}, {"no": 330, "page": 120, "type": "正答選\n択", "question": "退職給付制度に関する個別財務諸表での会計処理に際して遅延認識が行えるものには、\nア．過去勤務費用\n イ．勤務費用\n ウ．数理計算上の差異がある。\n エ．すべて誤り", "answer": "ア,ウ\n・勤務費用は退職給付\nの当期発生額の割引\n 現在価値であり遅延\n認識不可", "topic": "退職給\n付引当\n金", "chapter": 10}, {"no": 331, "page": 120, "type": "誤答選\n択", "question": "（Ａ）数理計算上の差異については、将来期間にも按分する遅延認識の会計処理が認められてい\n る。\n（Ｂ）退職給付に係る調整額は連結貸借対照表の純資産の部で「その他の包括利益累計額」の項\n 目として計上される。\n（Ｃ）退職給付制度の新設や支給水準の引上げが行われた場合に生じる退職給付引当金残高の\n 不足を過去勤務費用と呼ぶ。\n（Ｄ）個別財務諸表では、借方での退職給付費用の認識に対応する貸方の負債科目名として退職\n 給付に係る負債を用いることになっている。", "answer": "D\n・個別→連結", "topic": "退職給\n付引当\n金", "chapter": 10}, {"no": 332, "page": 121, "type": "穴埋め", "question": "・有形固定資産の取得や使用によって生じ、その資産の除去が法令や契約で要求される場合の義務を\n (1)______________という。資産除去債務を伴う固定資産を取得・建設・開発した企業は、その\n 時点で予想される将来の除去のための支出額を見積って、その(2)______________を算定し、こ\n れを資産除去債務として負債に計上する。この計算に適用する割引率は、貨幣の時間価値を反映し\n た無リスクの税引(3)______________の利率である。認識された資産除去債務の金額は、同時\n にその資産の(4)______________に加算して計上する。これは資産の除去時に不可避的に生じ\n る支出額が、取得に関する(5)______________と同様の性格をもつと見なした会計処理である。\n 資産の取得原価は、資産除去債務を含めた金額で減価償却する。決算日には割引現在価値で測\n 定された資産除去債務が期末までの時の経過により(6)______________相当額だけ増加してい\n るから、これを資産除去債務の調整額として負債に追加計上し、同額をその期の費用として処理す\n る。この調整額は減価償却費と同じ区分に含めて計上する。資産が実際に除去される時点での資産\n 除去債務の残高と、実際の除去に要した支出額との間に生じた差額は、(7)______________に\n 含めて認識された資産除去費用と同じ区分に計上する。", "answer": "(1)資産除去債務\n(2)割引現在価値\n(3)前\n(4)帳簿価額\n(5)付随費用\n(6)利息\n(7)減価償却費", "topic": "資産除\n去債務", "chapter": 10}, {"no": 333, "page": 121, "type": "誤答選\n択", "question": "（Ａ）資産除去債務を伴う固定資産を取得・建設・開発した企業は、その時点で予想される将来の\n 除去のための支出額を見積って、その割引現在価値を算定し、これを資産除去債務として負債に計\n 上する。この計算に適用する割引率は、貨幣の時間価値を反映した無リスクの税引前の利率である。\n（Ｂ）認識された資産除去債務の金額は、資産の除去時に不可避的に生じる支出額が、取得に関\n する付随費用と同様の性格をもつと見なした会計処理として、同時にその資産の時価に加算して計上\n する。\n（Ｃ）資産の取得原価は、資産除去債務を含めた金額で減価償却する。決算日には割引現在価\n 値で測定された資産除去債務が期末までの時の経過により利息相当額だけ増加しているから、これを\n 資産除去債務の調整額として負債に追加計上し、同額をその期の費用として処理する。この調整額\n は減価償却費と同じ区分に含めて計上する。\n（Ｄ）資産が実際に除去される時点での資産除去債務の残高と、実際の除去に要した支出額との間\n に生じた差額は、減価償却費に含めて認識された資産除去費用と同じ区分に計上する。", "answer": "B\n・時価→帳簿価額", "topic": "資産除\n去債務", "chapter": 10}, {"no": 334, "page": 122, "type": "穴埋め", "question": "・いまのところ現実の債務にはなっていないが、将来において一定の事象が生じた場合に当該企業の負\n 担となる可能性のあるような債務を(1)______________という。手形の割引や裏書譲渡を行なっ\n た者は、もし手形上の主たる債務者が期日に手形金額を決済できないとき、主たる債務者に代わって\n 手形金額の支払いに応じなければならない義務を負う。これが偶発債務としての\n (2)______________である。「偶発債務が現実の債務となることが、ある程度まで予想されるが、\n その可能性が高いとはいえない場合」や、「偶発債務に伴う損失額の合理的見積りができない場合」に\n は、(3)______________の計上が認められないため偶発債務の内容を貸借対照表に\n (4)______________する。", "answer": "(1)偶発債務\n(2)手形遡及義務\n(3)引当金\n(4)注記", "topic": "偶発債\n務の意\n義と取\n扱", "chapter": 11}, {"no": 335, "page": 122, "type": "穴埋め", "question": "・資産と負債の差額は(1)______________として貸借対照表に記載される。株式会社の純資産\n は出資者たる株主に帰属する(2)______________と「その他の要素」に大別される。その他の要\n 素には資産・負債の(3)______________や、いまだ株主になっていない者が有する\n (4)______________や(5)______________が含まれる。", "answer": "(1)純資産\n(2)株主資本\n(3)時価評価差額\n(4)株式引受権\n(5)新株予約権", "topic": "株主資\n本と純\n資産の\n関係", "chapter": 11}, {"no": 336, "page": 122, "type": "誤答選\n択", "question": "（Ａ）貸借対照表の純資産は、出資者たる株主に帰属する「株主資本」と、その他の要素としての\n 「評価・換算差額等」および「社債」から構成される。\n（Ｂ）株主資本はさらに、株主からの拠出によって形成された払込資本と、獲得した利益を企業内に\n 留保して再投資することによって形成された留保利益に大別される。\n（Ｃ）払込資本はすべて資本金とするのが原則であるが、会社法に基づいて資本金としなかった部分\n は、資本準備金として分類される。資本準備金に含められる項目は、会社法や会社計算規則によっ\n て限定的に規定されているため、払込資本の性質をもつこれ以外の項目は「その他資本剰余金」として\n 分類される。\n（Ｄ）留保利益には、企業が過去に現金配当を行ったつど会社法の規定に従って設定した利益準備\n 金と、法律の規制を受けることなく企業が自らの判断で任意に設定した任意積立金がある。留保利益\n の残りの部分は繰越利益剰余金となり、任意積立金とあわせて「その他利益剰余金」として取扱われ\n る。", "answer": "A\n・社債は負債の部に計\n 上する", "topic": "株主資\n本と純\n資産の\n関係", "chapter": 11}, {"no": 337, "page": 123, "type": "穴埋め", "question": "・株主資本はさらに、株主からの拠出によって形成された(1)______________資本と、獲得した利\n 益を企業内に留保して再投資することによって形成された(2)______________に大別される。払\n 込資本はすべて(3)______________とするのが原則であるが、会社法に基づいて資本金としなか\n った部分は、(4)______________として分類される。資本準備金に含められる項目は、会社法や\n 会社計算規則によって限定的に規定されているため、払込資本の性質をもつこれ以外の項目は\n (5)______________として分類される。留保利益には企業が過去に現金配当を行ったつど会社\n 法の規定に従って設定した(6)______________と、法律の規制を受けることなく企業が自らの判\n 断で任意に設定した(7)______________がある。留保利益の残りの部分は繰越利益剰余金と\n なり、任意積立金とあわせて(8)______________として取扱われる。", "answer": "(1)払込\n(2)留保利益\n(3)資本金\n(4)資本準備金\n(5)その他資本剰余金\n(6)利益準備金\n(7)任意積立金\n(8)その他利益剰余金", "topic": "資本の\n源泉別\n分類", "chapter": 11}, {"no": 338, "page": 123, "type": "正答選\n択", "question": "貸借対照表または連結貸借対照表における株主資本には、\nア．自己株式\nイ．任意積立金\n ウ．利益準備金が含まれる。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "資本の\n源泉別\n分類", "chapter": 11}, {"no": 339, "page": 123, "type": "正答選\n択", "question": "株主資本には、\nア．減資差益\nイ．任意積立金\n ウ．繰越利益剰余金が含まれる。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "資本の\n源泉別\n分類", "chapter": 11}, {"no": 340, "page": 124, "type": "穴埋め", "question": "・株式会社の株主資本のうち、資本金以外の部分は資本取引から生じた(1)______________と\n 損益取引から生じた(2)______________に分類される。\n\n・企業の自己資本を直接的に変化させることを目的として行われる取引を(3)______________取\n 引という。会社の設立や増資に際しての、株主からの拠出金の(4)______________取引は、明ら\n かに資本取引である。したがってそのような払込資本のうち資本金に組み入れられなかった部分は\n (5)______________に該当する。このほか減資や(6)______________の処分も資本取引で\n あり、そこから資本金減少差益および(7)______________という資本剰余金が生じる。これに対し\n 企業が利益の獲得をめざして行う取引を(8)______________取引という。株主資本のうちの\n (9)______________は損益取引から生じたものであり、利益剰余金に該当する。", "answer": "(1)資本剰余金\n(2)利益剰余金\n(3)資本\n(4)払込\n(5)資本剰余金\n(6)自己株式\n(7)自己株式処分差益\n(8)損益\n(9)留保利益", "topic": "剰余金\n区別の\n原則", "chapter": 11}, {"no": 341, "page": 124, "type": "誤答選\n択", "question": "（Ａ）会社の設立や増資に際しての、株主からの拠出金の払込取引は、資本取引である。この払込\n 資本のうち資本金に組み入れられなかった部分は資本剰余金に該当する。\n（Ｂ）減資は資本取引の一種であり、資本金減少差益は資本剰余金に該当する。\n（Ｃ）自己株式の処分は損益取引であり、自己株式処分差益は利益剰余金に該当する。\n（Ｄ）株主資本のうちの留保利益は損益取引から生じたものであり、利益剰余金に該当する。", "answer": "C\n・利益剰余金→資本剰\n余金", "topic": "剰余金\n区別の\n原則", "chapter": 11}, {"no": 342, "page": 124, "type": "穴埋め", "question": "・会社が発行できる株式の総数を(1)______________という。\n・株式の払込金額は、その全額を(2)______________に組入れるのが原則であるが、\n (3)______________分の1 までは資本金としないことができる。資本金に組入れなかった部分は\n (4)______________とよばれ、資本準備金の1 項目として積立てなければならない。\n・会社は、普通株式のほかに、配当や残余財産の分配に関する(5)______________株式や\n (6)______________株式等を発行することができる。複数の種類の株式を発行した場合には、貸\n 借対照表の本体には、(7)______________に組入れた合計額を一括して記載すればよく、株式\n の種類別に資本金を区分表示する必要はない。", "answer": "(1)発行可能株式総数\n(2)資本金\n(3)2\n(4)株式払込剰余金\n(5)優先\n(6)劣後\n(7)資本金", "topic": "会社の\n設立", "chapter": 11}, {"no": 343, "page": 125, "type": "誤答選\n択", "question": "（Ａ）株式の払込金額は、その全額を資本金に組入れるのが原則であるが、2 分の1 までは資本金\n としないことができる。資本金に組入れなかった部分は株式払込剰余金とよばれ、資本準備金の1 項\n 目として積立てなければならない。\n（Ｂ）会社は、普通株式のほかに、配当や残余財産の分配に関する優先株式や劣後株式等を発行\n することができる。複数の種類の株式を発行した場合には、貸借対照表の本体に、株式の種類別に資\n 本金を区分表示する必要がある。\n（Ｃ）新しい株式の発行に先立ち、会社はまず募集株式の引受人から受入れた払込金額を、ひとま\n ず新株式申込証拠金として記録する。募集株式の引受人が株主になるのは払込期日である。したが\n って会社はこの目に新株式申込証拠金から資本金への振替を行う。\n（Ｄ）会社の剰余金のうち、資本準備金と利益準備金が分配不可能な部分であるのに対し、その他\n 資本剰余金とその他利益剰余金は所定の限度内で分配が可能な剰余金である。", "answer": "B\n・合計額を一括して記\n載", "topic": "会社の\n設立", "chapter": 11}, {"no": 344, "page": 125, "type": "穴埋め", "question": "・株式会社の資本金を増加させる取引を(1)______________という。増資には会社の株主資本の\n 増加を伴う(2)______________と、会社の株主資本は変化せず、その内訳構成が変化するだけ\n の(3)______________がある。\n・新しい株式の発行に先立ち、会社はまず募集株式の引受人から受入れた払込金額を、ひとまず\n (4)______________として記録する。募集株式の引受人が株主になるのは払込期日である。した\n がって会社はこの目に新株式申込証拠金から(5)______________への振替を行う。\n・株式会社への権利行使により、その会社の株式の交付を受けることができる権利を\n (6)______________という。会社の役員や従業員などがその会社の株式を予め定められた価額で\n 取得することを選択できる権利を(7)______________という。会社が取締役への報酬として自社\n の株式を条件付で無償交付する取引のうち、事後交付型とよばれるタイプにおいて、条件の達成後に\n 株式の交付を受けることができる権利を(8)______________という。\n・資本金の増加に伴い、会社はそれに見合う新株式を発行して株主に無償で交付することができる。新\n 株式が完全に無償で交付される場合、および一部が有償とされる場合ともに、1 株あたりの純資産額\n が減少することになるから、この株式交付は会社法上の(9)______________または\n (10)          に該当する", "answer": "(1)増資\n(2)実質的増資\n(3)形式的増資\n(4)新株式申込証拠金\n(5)資本金\n(6)新株予約権\n(7)ストック・オプション\n(8)株式引受権\n(9)株式分割\n(10)株式無償割当て", "topic": "増資", "chapter": 11}, {"no": 345, "page": 126, "type": "穴埋め", "question": "(1)______________とは、会社が取締役への報酬として自社の株式を条件付で無償交付する取\n 引のうち、事後交付型とよばれるタイプにおいて、条件の達成後に株式の交付を受けることができる権\n 利をいう。", "answer": "(1)株式引受権", "topic": "増資", "chapter": 11}, {"no": 346, "page": 126, "type": "正答選\n択", "question": "株主資本の増加を伴う増資（実質的増資）の形態には、\nア．新株予約権の権利行使\n イ．株式交換による他企業の子会社化\n ウ．準備金の資本金組入がある。\n エ．すべて誤り", "answer": "ア,イ\n・イは会社の株主資本\n が変化せずその内訳構\n 成が変化するだけの形\n式的増資", "topic": "増資", "chapter": 11}, {"no": 347, "page": 126, "type": "穴埋め", "question": "(1)______________は資本金の額を減少させる取引である。減資もまた増資の場合と同様に会\n 社の純資産の減少を伴うか否かにより、(2)______________と(3)______________に区分\n される。減資で減少する資本金が株主に返還される会社の資産額や計算上で相殺される累積損失\n の額を上回る場合その差額を(4)______________という。", "answer": "(1)減資\n(2)実質的減資\n(3)形式的減資\n(4)資本金減少差益", "topic": "減資", "chapter": 11}, {"no": 348, "page": 126, "type": "穴埋め", "question": "(1)______________または金庫株という。会社は、株主総会の決議を経て、\n (2)______________の限度内で行うのであれば、目的や数量を問わず自己株式を取得し保有で\n きる。取得した自己株式は、第三者への売却のほか、転換社債・新株予約権付社債やストック・オプシ\n ョンなどの(3)______________の行使者への交付、合併や株式交換での交付などで利用される。\n 自己株式の本質については、資産説と資本減少説があるが、会社計算規則および自己株式に関する\n 会社基準は(4)______________に立脚している。取得した自己株式は支出額によって計上し、\n 決算に際しても(5)______________で評価する。自己株式の売却や交付の際に生じた自己株\n 式処分差益は(6)______________の区分を設けて掲載する。", "answer": "(1)自己株式\n(2)分配可能額\n(3)新株予約権\n(4)資本減少説\n(5)取得原価\n(6)その他資本剰余金", "topic": "自己株\n式", "chapter": 11}, {"no": 349, "page": 127, "type": "誤答選\n択", "question": "（Ａ）会社は、株主総会の決議を経て、分配可能額の限度内で行うのであれば、目的や数量を問わ\n ず自己株式を取得し保有できる。\n（Ｂ）取得した自己株式は、第三者への売却のほか、転換社債・新株予約権付社債やストック・オプ\n ションなどの新株予約権の行使者への交付、合併や株式交換での交付などで利用される。これらの処\n 分は、募集株式の発行手続に準じて行わなければならない。\n（Ｃ）自己株式の本質については、資産説と資本減少説があるが、会社計算規則および自己株式に\n 関する会社基準は資本減少説に立脚している。\n（Ｄ）取得した自己株式は支出額によって計上し、決算に際しても取得原価で評価する。自己株式\n の売却や交付の際に生じた自己株式処分差益は資本準備金に計上される。", "answer": "D\n・資本準備金→資本剰\n余金", "topic": "自己株\n式", "chapter": 11}, {"no": 350, "page": 128, "type": "穴埋め", "question": "・ある企業と他の企業が1 つの報告単位となる会計実体へ統合されることを(1)______________と\n いう。会社法の規定に従って2 つ以上の会社が合体して、法的にも1 つの会社になることを\n (2)______________という。合併はその経済的実態により(3)______________と\n (4)______________の2 つのタイプに分類することができる。ここに取得とは、当事企業の一方が\n 他方に対する(5)______________を獲得するタイプの企業結合をいう。持分の継続が断たれる\n 「取得」タイプの企業結合では、被取得企業の株主がいったん投資を清算し、改めて資産・負債を時\n 価で測定した再投資額によって、取得企業に現物出資したと考えられる。この経済的実態を反映する\n 会計処理方法を(6)______________という。他方、結合当事企業の持分が継続していると考え\n られる「持分の結合」に相当する場合は、結合当事企業の貸借対照表の各項目を帳簿価額で引継ぐ\n (7)______________によって会計処理するのが論理的に妥当である。持分プーリング法の特徴と\n して消滅会社の資産・負債の全てを(8)______________会社が帳簿価額により引継ぐ、したがっ\n て(9)______________は生じない、消滅会社の株主資本の内訳について利益剰余金を含め、そ\n のまま存続会社が引継ぐことが挙げられる。\n・国際的な会計基準は、通常の企業結合はすべて(10)______________で会計処理するよう規\n 定している。日本の「企業結合に関する会計基準」も若干の例外を除いて企業結合は\n (10)______________で会計処理すべきこととしている。例外とされるのは\n (11)______________の形成と(12)______________の取引である。\n・パーチェス法を適用した場合、被取得企業の資産と負債は(13)______________で評価され、\n 取得企業に引継がれる。その取得原価としては、引継がれた純資産の時価と、支払対価たる財貨の\n 時価のうち、より高い信頼性をもって(14)______________可能な方が採用される。引継いだ資\n 産と負債に配分された純額よりも、取得原価の方が大きい場合、その超過分は被取得企業の超過収\n 益力に対して支払われた対価であると判断し、(15)______________として会計処理する。逆に\n 取得原価の方が小さい場合、その差額を(16)______________という。合併によって増加する資\n 本金と資本準備金の額は、(17)______________会社が合併契約の定めに従って決定する。取\n 得原価から資本金や資本準備金となる額を控除して、さらに残額が生じれば、\n (18)           として処理する", "answer": "(1)企業結合\n(2)合併\n(3)取得\n(4)持分の結合\n(5)支配\n(6)パーチェス法\n(7)持分プーリング法\n(8)存続\n(9)のれん\n(10)パーチェス法\n(11)共同支配企業\n(12)共通支配下\n(13)時価\n(14)測定\n(15)のれん\n(16)負ののれん\n(17)存続\n(18)その他資本剰余\n金", "topic": "合併", "chapter": 11}, {"no": 351, "page": 129, "type": "正答選\n択", "question": "合併の会計処理方法の一つである持分プーリング法の特徴として、\n （Ａ）消滅会社の資産と負債の引継ぎ：すべて存続会社が引継ぐ\n （Ｂ）引継ぐ資産と負債の評価：時価評価して引継ぎ、対価との差をのれんとする\n （Ｃ）消滅会社の株主資本の内訳：引継がず、資本金組入額以外は資本剰余金となるが挙げら\n れる。\n （Ｄ）全て誤り", "answer": "A\n・帳簿価額により引継ぐ\n ためのれんは生じない。\n また株主資本の内訳\n についてもそのまま引継\n ぐ", "topic": "合併", "chapter": 11}, {"no": 352, "page": 129, "type": "誤答選\n択", "question": "（Ａ）合併はその経済的実態により「取得」と「持分の結合」の2 つのタイプに分類することができる。こ\n こに取得とは、当事企業の一方が他方に対する支配を獲得するタイプの企業結合をいう。\n（Ｂ）パーチェス法を適用した場合、被取得企業の資産と負債は時価で評価され、取得企業に引継\n がれる。その取得原価としては、引継がれた純資産の時価と、支払対価たる財貨の時価のうち、いずれ\n か低い方が採用される。\n（Ｃ）パーチェス法を適用した場合、合併により引継いだ資産と負債に配分された純額よりも、取得原\n 価の方が大きい場合、その超過分は被取得企業の超過収益力に対して支払われた対価であると判\n 断し、のれんとして会計処理する。\n（Ｄ）パーチェス法を適用した場合、合併によって増加する資本金と資本準備金の額は、存続会社が\n 合併契約の定めに従って決定する。取得原価から資本金や資本準備金となる額を控除して、さらに残\n 額が生じれば、「その他資本剰余金」として処理する。", "answer": "B\n・より高い信頼性をもっ\n て測定可能な方が採\n 用される", "topic": "合併", "chapter": 11}, {"no": 353, "page": 129, "type": "誤答選\n択", "question": "（Ａ）合併はその経済的実態により、「取得」と「持分の結合」の２タイプに分類することができる。\n（Ｂ）持分の継続が断たれる「取得」タイプの企業結合では、被取得企業の株主がいったん投資を清\n 算し、改めて資産・負債を時価で測定した再投資額によって、取得企業に現物出資したと考えられる。\n この経済的実態を反映する会計処理方法をパーチェス法という。\n（Ｃ）結合当事企業の持分が継続していると考えられる「持分の結合」に相当する場合は、結合当事\n 企業の貸借対照表の各項目を帳簿価額で引継ぐ持分プーリング法によって会計処理するのが論理的\n に妥当である。\n（Ｄ）国際的な会計基準は、通常の企業結合はすべて持分プーリング法で会計処理するよう規定し\n ている", "answer": "D\n・持分プーリング法→パ\n ーチェス法", "topic": "合併", "chapter": 11}, {"no": 354, "page": 130, "type": "穴埋め", "question": "合併では2 つの会社が1 つに合体することになるが、両方の会社が法人格を保持したまま合併と同様\n の経済効果を生じる取引として(1)______________や(2)______________の制度がある。\n 株式交換と株式移転のいずれにおいても、親会社が保有する子会社株式の金額が親会社の資産総\n 額の半分を超えると親会社は独占禁止法9 条の(3)______________となる。", "answer": "(1)株式交換\n(2)株式移転\n(3)持株会社", "topic": "株式交\n換と株\n式移転", "chapter": 11}, {"no": 355, "page": 130, "type": "穴埋め", "question": "会社法の規定に従って会社の事業の一部を分離することを会社の(1)______________という。分\n 離元企業が受取る対価が分離先企業の株式だけであり、かつ分離先企業が子会社や関連会社に該\n 当する場合、分離元企業に交付される分離先企業の株式は、分離された資産・負債の帳簿価額に\n よる純資産額で評価される。この会計処理を(2)______________という。分離元企業が現金を\n 受取るなど、移転した事業と明らかに異なる資産を対価として受取る場合は分離先企業の株式を受\n 取った場合でも投資はいったん清算されたことになり分離元企業は対価の株式などを公正な時価で計\n 上し、移転した事業の帳簿価額に基づく純資産との差額を事業の(3)______________として記\n 録する。他方、分離先企業は引継いだ資産と負債を時価で計上する。この方法は\n (4)______________とよばれ合併の場合のパーチェス法に対応する。分離元企業が取得企業と\n なるケースを(5)______________という。", "answer": "(1)分割\n(2)簿価引継法\n(3)移転損益\n(4)売買処理法\n(5)逆取得", "topic": "会社の\n分割", "chapter": 11}, {"no": 356, "page": 131, "type": "穴埋め", "question": "会社の分割において、分離元企業が受取る対価が分離先企業の株式だけであり、かつ分離先企業が\n 子会社や関連会社に該当する場合、分離元企業に交付される分離先企業の株式は、分離された資\n 産・負債の帳簿価額による純資産額で評価される。この会計処理を（  ）という。\n（Ａ）売買処理法\n （Ｂ）持分プーリング法\n（Ｃ）簿価引継法\n（Ｄ）価額分離法\n（Ｅ）実地調査法\n（Ｆ）誘導法\n（Ｇ）純資産法\n（Ｈ）継続記録法\n（Ｉ）帳簿記録法\n（Ｊ）棚卸法", "answer": "C", "topic": "会社の\n分割", "chapter": 11}, {"no": 357, "page": 131, "type": "誤答選\n択", "question": "（Ａ）会社法に従って会社を分割し、分離元企業が受取る対価が分離先企業の株式だけでありかつ\n 分離先企業が子会社や関連会社に該当する場合、この株式は分離された資産・負債の帳簿価額に\n よる純資産額で評価され、この会計処理を簿価引継法という。\n（Ｂ）会社法に従って会社を分割し、対価として分離先企業の株式を受取った場合でも、それが分離\n 元企業の子会社株式や関連会社株式に該当しなければ、分離元企業はこの株式を公正な時価で\n 計上し、移転した事業の帳簿価額に基づく純資産との差額を損益計算書に移転損益として計上す\n る。\n（Ｃ）会社法に従って会社を分割し、対価として分離先企業の株式を受取った場合でも、それが分離\n 元企業の子会社株式や関連会社株式に該当しなければ、分離先企業は引継いだ資産と負債を時\n 価で計上する。\n（Ｄ）会社法に従って会社を分割し、分離先企業から分離元企業へ対価として新株発行された分離\n 先企業の株式が、組織再編後の分離先企業の発行済株式の60％であった場合、分割前に分離先\n 企業と分離元企業に資本関係がなかったとすると分離元企業は被取得企業となる", "answer": "D\n・分離元企業が取得企\n 業となる逆取得のケー\n スである", "topic": "会社の\n分割", "chapter": 11}, {"no": 358, "page": 132, "type": "穴埋め", "question": "株式会社では出資者たる株主は有限責任しか負わないから、債権者の権利を保全するには、維持す\n べき元本たる資本部分と分配が可能な利益部分を峻別して会社資産の過大な流出を防止しなけれ\n ばならない。このため1 期間に獲得された利益は(1)______________勘定へ振替えられて資本\n 金と区別される。", "answer": "(1)繰越利益剰余金", "topic": "留保利\n益と剰\n余金の\n関係", "chapter": 11}, {"no": 359, "page": 132, "type": "穴埋め", "question": "・1 事業年度のちょうど中央の日を基準として、株主に金銭を分配することを(1)______________と\n いう。\n・会社法は、株主への配当による企業資産の社外流出が生じた場合に、社外流出額の\n (2)______________分の1 の額を資本準備金または利益準備金として積み立てるべきことを要\n 求している。資本準備金と利益準備金のいずれかを積立てるかは配当の財源によって決まり、その他資\n 本剰余金から配当した場合には(3)______________を積立て、その他利益剰余金から配当した\n 場合は(4)______________を積立てる。ただし、資本準備金と利益準備金の合計額が、資本金\n の(5)______________分の1 に達すれば積立の必要はない。\n・資本準備金と利益準備金は会社法で定められた準備金という意味で(6)______________とよば\n れることがある。これに対し企業が契約や経営上の必要性に基づいて設定した留保利益の項目を\n (7)______________という。\n・過去には(8)______________も配当金と同様に利益処分の議案に含めて株主総会の承認を経\n たのち留保利益の処分として会計処理されていたことがあるが現在では役員賞与引当金を設定し費\n 用計上することとされている。", "answer": "(1)中間配当\n(2)4\n(3)資本準備金\n(4)利益準備金\n(5)10\n(6)法定準備金\n(7)任意積立金\n(8)役員賞与", "topic": "剰余金\nの配当", "chapter": 11}, {"no": 360, "page": 132, "type": "穴埋め", "question": "会社法は、株主への配当による企業資産の社外流出が生じた場合に、資本準備金または利益準備\n 金として社外流出額の(1)______________分の1 の額を積み立てるべきことを要求している。た\n だし、資本準備金と利益準備金の合計額が、資本金の(2)______________分の1 に達すれば\n その必要はない。", "answer": "(1)10\n(2)4", "topic": "剰余金\nの配当", "chapter": 11}, {"no": 361, "page": 132, "type": "穴埋め", "question": "のれん等調整額の金額はのれん/(1)______________＋(2)______________として計算され\n る。", "answer": "(1)2\n(2)繰延資産", "topic": "会社法\nの配当\n制限", "chapter": 11}, {"no": 362, "page": 133, "type": "誤答選\n択", "question": "（Ａ）繰延資産は、対応原則に基づき、当期の支出額を将来の収益に対応させて適切な期間利益\n を算定する目的で計上される資産項目である。\n（Ｂ）企業会計基準委員会の実務対応報告第19 号「繰延資産の会計処理に関する当面の取扱\n い」において繰延資産として取り扱っているものは、新株発行費を含む株式交付費、社債発行費等、\n 創立費、開業費、開発費の5 項目だけである。\n（Ｃ）繰延資産として処理する項目については、繰延資産として処理する以外に、支出時の費用とし\n て処理する方法も認められている。\n（Ｄ）のれん等調整額を計算する際にも繰延資産が考慮され、[のれん＋繰延資産÷2]と計算され\n る。", "answer": "D\n・のれん等調整額はのれ\n ん/2+繰延資産", "topic": "会社法\nの配当\n制限", "chapter": 12}, {"no": 363, "page": 133, "type": "穴埋め", "question": "評価・換算差額等という項目名は個別貸借対照表に限定され、連結財務諸表では包括利益の算定\n と表示が求められているから、この項目は(1)______________として表記する。", "answer": "(1)その他の包括利益\n累計額", "topic": "純資産\nの区分\n表示", "chapter": 12}, {"no": 364, "page": 133, "type": "穴埋め", "question": "会社法と金融商品取引法の両方の要請を満たす1 つの書類を作成し、株主総会前に開示する取組\n に対する支援が関係省庁の協力のもとで続けられている。内閣官房・金融庁・法務省・経済産業省が\n 連名で2018 年12 月に公表した「事業報告等と有価証券報告書の一体的開示のための取組の支\n 援について」と題する文書には、このような(1)______________の参考とするための記載例が示さ\n れている。", "answer": "(1)一体的開示", "topic": "財務諸\n表の種\n類", "chapter": 12}, {"no": 365, "page": 134, "type": "穴埋め", "question": "会社法がすべての株式会社に作成と報告を義務づけている書類は、(1) ______________、(2)\n ______________、(3) ______________、(4) ______________、\n (5)______________、(6)______________の6 つである。会社法はこのうち貸借対照表、\n 損益計算書、株主資本変動計算書、注記表を(7)______________とよんでいる。これらの書類\n は(8)______________と名づけられた法務省令に準拠して作成され監査される。取締役は決算\n 日後迅速に計算書類を作成して、(9)______________と(10)______________に提出しな\n ければならない。定時株主総会は総会出席や配当受領の権利を有する株主を特定するために設けら\n れた基準日から(11)______________以内に開催する。会計監査人が計算書類を適正と認める\n 旨の意見を表明し、かつ監査役会（または監査委員会、監査等委員会）が会計監査人の監査報\n 告を否定しない限り、計算書類は(12)______________で確定する。したがってこれらの書類は株\n 主総会で(13) ______________すれば足り、承認を要しない。会社法のもとでは、計算書類のほ\n かに事業報告（貸借対照表や損益計算書では十分に表現できなかった会社の経済活動の全体像\n を文章や数字を用いて記載したもの）の作成と報告も求められており、(14) ______________\n （委員会設置会社の場合は監査委員会）によって監査される。監査役会（または監査委員会、監\n 査等委員会）が取締役（または執行役）の職務執行に関して不正や違法行為を発見した場合に\n は、事業報告に関する(15)______________において、その事実が指摘される。", "answer": "(1)貸借対照表\n(2)損益計算書\n(3)株主資本等変動計\n算書\n(4)注記表\n(5)事業報告\n(6)附属明細書\n(7)計算書類\n(8)会社計算規則\n(9)会計監査人\n(10)監査役会\n(11)3 ヶ月\n(12)取締役会\n(13)報告\n(14)監査役会\n(15)監査報告書", "topic": "会社法\nの計算\n書類", "chapter": 12}, {"no": 366, "page": 134, "type": "誤答選\n択", "question": "（Ａ）会社法がすべての株式会社に作成と報告を義務づけている書類のうち、計算書類に含まれるも\n のは、貸借対照表、損益計算書、株主資本等変動計算書、注記表、附属明細書である。\n（Ｂ）繰越損失を処理する場合、任意積立金、その他資本剰余金、利益準備金および資本準備金\n の順に取崩して、取崩益を充当するのが望ましい。\n（Ｃ）株主資本等変動計算書において、評価・換算差額等と株式引受権および新株予約権は、当\n 期首残高、当期変動額、当期末残高に区分して、当期変動額は純額で表記するのが原則である。\n（Ｄ）貸借対照表の流動項目と固定項目の分類に際しては、１年基準と営業循環基準を併用して\n 行うが、まず営業循環基準が適用される。", "answer": "A\n・事業報告も作成と報\n 告が義務付けられてい\n る", "topic": "会社法\nの計算\n書類", "chapter": 12}, {"no": 367, "page": 135, "type": "誤答選\n択", "question": "（Ａ）会社法における大会社たる公開会社は、総会出席や配当受領の権利を有する株主を特定す\n るために設けられた基準日から、３ヵ月（すなわち13 週）以内に定時株主総会を開催する。\n（Ｂ）会社法における大会社たる公開会社は、会計監査人が計算書類を適正と認める旨の意見を\n 表明し、かつ監査役会（または監査委員会、監査等委員会）が会計監査人の監査報告を否定せ\n ず、監査報告書で問題点が指摘されなかった場合、計算書類が確定されるためには株主総会での承\n 認が必要である。\n（Ｃ）会社法における大会社たる公開会社は、計算書類のほかに事業報告の作成と報告も求められ\n ており、これは貸借対照表や損益計算書の計数を解釈する前提となる企業の実態に関する情報とし\n ての意義をもつ。事業報告に記載すべき事項は会社法施行規則で定められている。\n（Ｄ）会社法における大会社たる公開会社は、監査役会（または監査委員会、監査等委員会）が\n 取締役（または執行役）の職務執行に関して不正や違法行為を発見した場合には、事業報告に関\n する監査報告書において、その事実が指摘される。", "answer": "B\n・株主総会→取締役会", "topic": "会社法\nの計算\n書類", "chapter": 12}, {"no": 368, "page": 135, "type": "正答選\n択", "question": "会社法が全ての株式会社に作成と報告を義務づけている書類のうち、計算書類とよばれるものに\nア．株主資本等変動計算書\nイ．損益計算書\n ウ．個別注記表がある。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・その他に計算書類とよ\n ばれるものに貸借対照\n 表がある", "topic": "会社法\nの計算\n書類", "chapter": 12}, {"no": 369, "page": 135, "type": "誤答選\n択", "question": "（Ａ）会社法では、連結財務諸表の１つとして連結キャッシュ・フロー計算書を公表することをすべての\n 企業に義務づけている。\n（Ｂ）わが国のキャッシュ・フロー計算書が対象とする資金の範囲には現金が含まれており、現金には手\n 許現金だけでなく、当座預金・普通預金・通知預金などの要求払預金も含まれる。\n（Ｃ）わが国のキャッシュ・フロー計算書が対象とする資金の範囲に含まれる現金同等物とは、容易に\n 換金することができ、かつ価値の変動について僅少なリスクしか負わない短期投資をいう。\n（Ｄ）キャッシュ・フロー計算書によって企業の資金の変動をよりいっそう適切に表示するには、企業が営\n む活動の種類に応じて、キャッシュ・フローを区分するのが有効である。この目的のために企業活動は、\n①営業活動②投資活動③財務活動の３つに区分される", "answer": "A\n・会社法→金融商品取\n引法", "topic": "会社法\nの計算\n書類", "chapter": 12}, {"no": 370, "page": 136, "type": "正答選\n択", "question": "会社法上の計算書類とは、貸借対照表の他には、\nア．損益計算書\n イ．事業報告\n ウ．附属明細書の３つである。\n エ．すべて誤り", "answer": "ア\n・計算書類には貸借対\n 照表、損益計算書、\n株主資本変動計算\n 書、注記表がある", "topic": "会社法\nの計算\n書類", "chapter": 12}, {"no": 371, "page": 136, "type": "誤答選\n択", "question": "（Ａ）会社法のもとでは、計算書類のほかに事業報告（貸借対照表や損益計算書では十分に表現\n できなかった会社の経済活動の全体像を文章や数字を用いて記載したもの）の作成と報告も求めら\n れており、監査役会（委員会設置会社の場合は監査委員会）によって監査される。\n（Ｂ）金融商品取引法は、その適用を受ける上場会社等に対して、年次の決算日から3 か月以内\n に有価証券報告書を作成し提出することを義務づけている。\n（Ｃ）会社法に基づく財務諸表の体系は、金融商品取引法の計算書類と比べて幾つかの特徴を有\n するが、その1 つは、金融商品取引法では必要とされないキャッシュ・フロー計算書が含められていること\n である。\n（Ｄ）金融商品取引法のもとでは、この法律の適用を受けるすべての企業に対して、3 か月ごとの期間\n を対象とした四半期財務諸表、および子会社等も含めた連結財務諸表の作成と公開があわせて義務\n づけられている。", "answer": "C\n・会社法と金融商品取\n 引法が逆", "topic": "会社法\nの計算\n書類", "chapter": 12}, {"no": 372, "page": 136, "type": "正答選\n択", "question": "会社法がすべての株式会杜に作成と報告を義務づけている書類のうち、会社法が計算書類とよんてい\n るものには、\nア．株主資本等変動計算書\n イ．注記表\n ウ．附属明細書が含まれる。\n エ．すべて誤り", "answer": "ア,イ\n・計算書類には貸借対\n 照表、損益計算書、\n株主資本変動計算\n 書、注記表がある", "topic": "会社法\nの計算\n書類", "chapter": 12}, {"no": 373, "page": 137, "type": "穴埋め", "question": "金融商品取引法は、その適用を受ける上場会社等に対して、年次の決算日から\n (1)______________以内に(2)______________を作成し提出することを義務づけている。\n 提出された報告書は金融庁が運営する(3)という電子開示システムを通じて誰でもインターネット上で\n 閲覧することができる。金融商品取引法に基づく財務諸表は、貸借対照表、損益計算書、株主資本\n 等変動計算書、(4) ______________、および(5)______________の５つである。これらの\n 書類の内容や様式は(6) ______________と略称される内閣府令で定められている。金融商品\n 取引法のもとでは、この法律の適用を受けるすべての企業に対して、3 か月ごとの期間を対象とした(7)\n ______________、および子会社等も含めた(8)______________の作成と公開があわせて義\n 務づけられている。\n財務諸表規則では連結財務諸表を作成する会社のうち会計監査人設置会社を\n (9)______________と名づけ、金融商品取引法のもとでの個別財務諸表を簡素化する方法を\n 設けている。このような金融商品取引法の財務報告制度とは別に証券取引所は独自に\n (10)______________の制度を設けている。これは上場会社が(11)______________とよば\n れる書類を作成して証券取引所へ提出するとともに取引所の記者クラブで新聞記者を前に記者会見\n を行う制度である。", "answer": "(1)3 ヶ月\n(2)有価証券報告書\n(3)EDINET\n(4)キャッシュ・フロー計\n算書\n(5)附属明細表\n(6)財務諸表規則\n(7)四半期財務諸表\n(8)連結財務諸表\n(9)特例財務諸表提出\n会社\n(10)決算発表\n(11)決算短信", "topic": "金融商\n品取引\n法の財\n務諸表", "chapter": 12}, {"no": 374, "page": 137, "type": "穴埋め", "question": "金融商品取引法に基づく財務諸表は、貸借対照表、損益計算書、株主資本等変動計算書、\n (1)______________、および(2)______________の５つで構成される。", "answer": "(1)附属明細表\n(2)キャッシュ・フロー計\n算書", "topic": "金融商\n品取引\n法の財\n務諸表", "chapter": 12}, {"no": 375, "page": 137, "type": "正答選\n択", "question": "金融商品取引法が定める有価証券報告書に記載される財務諸表には、\nア．株主資本等変動計算書\n イ．キャッシュ・フロー計算書\n ウ．附属明細表が含まれる。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・そのほかに貸借対照\n 表、損益計算書がある", "topic": "金融商\n品取引\n法の財\n務諸表", "chapter": 12}, {"no": 376, "page": 138, "type": "", "question": "・損益計算書は投資の成果たる(1)______________を明らかにするとともに、包括利益計算書と\n いっしょになって、自己資本の期中変動を説明するものである。したがってこれらの情報がうまく伝達され\n るように、その作成に際しては(2)______________の原則が遵守されなければならない。経営成\n 績を十分に表示するために、損益計算書は(3)______________主義で作成されなければならな\n い。ただし、企業にとって重要性の乏しい活動については(4)______________主義が用いられる。\n 収益のうち最も重要なものは、当期の主たる営業活動の成果としての(5)______________であ\n る。金融活動から生じた受取利息や受取配当金は主たる営業活動以外からの収益という意味で\n (6)______________として分類される。その他臨時的な活動や事象から生じたものは\n (7)______________である。他方、費用のうち、当期に販売した商品・製品について、その仕入・\n 生産活動に要した原価は(8)______________になり、販売・回収活動と経営管理活動で生じた\n 項目は(9)______________として分類する。さらに当期の金融活動から生じた支払利息などは\n (10)______________として、またその他の臨時的な活動や事象から生じたものは\n (11)______________として取扱われる。\n\n・収益・費用の項目を区分表示したものを(12)______________式損益計算書とよび区分せず一\n 括表示したものは(13)______________式損益計算書とよばれる。区分式を採用する場合の最\n 初の(14)______________計算の区分では、企業の主たる営業活動からの売上高とそれに対応\n する売上原価を示し、その差額として(15)______________を表示する。次いでそこから販売費お\n よび一般管理費を差引いて(16)______________を表示する。次に(17)______________\n の区分には営業活動に付随する当期の金融活動から生じた営業外収益と営業外費用を表示し、営\n 業利益にこれらを加減して(18)______________を算出する。これに対し臨時的・偶発的に生じ\n た損益項目は特別利益または特別損益として(19)______________の区分に記載し、経常利\n 益に加減することによって(20)______________を算出する。純損益計算の区分ではさらに法人\n 税・住民税および事業税を控除して、(21)______________を表示する。\n\n・財務諸表の様式には報告式と勘定式がある。(22)______________の損益計算書は最初に売\n 上高を記載しそれに順次項目を加減しながら上から下へ表示していく様式をいい", "answer": "(1)経営成績\n(2)明瞭性\n(3)総額\n(4)純額\n(5)売上高\n(6)営業外収益\n(7)特別利益\n(8)売上原価\n(9)販売費および一般\n管理費\n(10)営業外費用\n(11)特別損失\n(12)区分\n(13)無区分\n(14)営業損益\n(15)売上総利益\n(16)営業利益\n(17)経常損益計算\n(18)経常利益\n(19)純損益計算\n(20)税引前当期純利\n益\n(21)当期純利益\n(22)報告式\n(23)勘定式\n(24)重要性\n(25)注記", "topic": "損益計\n算書の\n表示原\n則", "chapter": 12}, {"no": 377, "page": 139, "type": "誤答選\n択", "question": "（Ａ）損益計算書は投資の成果たる経営成績を明らかにするとともに、包括利益計算書といっしょにな\n って、自己資本の期中変動を説明するものである。したがってこれらの情報がうまく伝達されるように、そ\n の作成に際しては明瞭性の原則が遵守されなければならない。\n（Ｂ）経営成績を十分に表示するために、損益計算書は純額主義で作成されなければならない。ただ\n し、企業にとって重要性の乏しい活動については総額主義が用いられる。\n（Ｃ）経常利益は、「売上総利益－販売費および一般管理費＋営業外収益－営業外費用」で算\n 出される。\n（Ｄ）財務諸表の様式には報告式と勘定式がある。報告式の損益計算書は最初に売上高を記載\n し、それに順次項目を加減しながら、上から下へ表示していく様式をいい、勘定式は紙面を左右に二分\n し、複式簿記の原理に従い貸方に収益項目を、借方に費用項目を記載する様式である。", "answer": "B\n・総額→純額", "topic": "損益計\n算書の\n表示原\n則", "chapter": 12}, {"no": 378, "page": 139, "type": "誤答選\n択", "question": "（Ａ）企業の経営成績を十分に表示するために、損益計算書は純額主義ではなく総額主義で作成\n されなければならない。ただし、企業にとって重要性の乏しい活動については純額主義が用いられる。\n（Ｂ）企業活動は、主たる営業活動とそれに付随する金融活動に大別される。当期の主たる営業活\n 動に関する費用は売上原価または販売費および一般管理費として分類し、主たる営業活動に付随す\n る金融活動から生じた支払利息などは営業外費用として取り扱われる。\n（Ｃ）区分式を採用した損益計算書における純損益計算の区分では、営業利益に営業外収益およ\n び営業外費用を加減することによって経常利益が計算される。\n（Ｄ）包括利益とは、特定期間における純資産の変動額のうち、企業所有者である株主との直接的\n な取引によらない部分であると定義される", "answer": "C\n・純損益→経常損益", "topic": "損益計\n算書の\n表示原\n則", "chapter": 12}, {"no": 379, "page": 140, "type": "誤答選\n択", "question": "（Ａ）損益計算書のうち、収益・費用の項目が区分表示されているものは区分式損益計算書とよば\n れ、収益・費用の項目を区分せずに一括表示したものは無区分式損益計算書とよばれる。\n（Ｂ）区分式損益計算書の営業損益計算の区分では、企業の主たる営業活動からの売上高とそれ\n に対応する売上原価を示し、その差額として営業利益を表示する。\n（Ｃ）区分式損益計算書の経常損益計算の区分では、営業活動に付随する当期の金融活動から\n 生じた営業外収益と営業外費用を表示し、営業利益にこれらを加減して経常利益を算出する。\n（Ｄ）区分式損益計算書の純損益計算の区分では、臨時的・偶発的に生じた損益項目を特別利\n 益または特別損失として記載し、経常利益に加減することによって税引前当期純利益を算出し、さらに\n 法人税・住民税および事業税を控除して、当期純利益を表示する。", "answer": "B\n・営業利益→売上総利\n益", "topic": "損益計\n算書の\n表示原\n則", "chapter": 12}, {"no": 380, "page": 140, "type": "正答選\n択", "question": "経常利益の算出には、\nア．営業利益\nイ．営業外収益\n ウ．特別利益は含まれない。\n エ．すべて誤り", "answer": "ウ\n・経常利益は営業利益\n に営業外収益、営業\n 外費用を加減して算\n 出する", "topic": "損益計\n算書の\n表示原\n則", "chapter": 12}, {"no": 381, "page": 140, "type": "穴埋め", "question": "包括利益とは、特定期間における(1)______________の変動額のうち、企業所有者である株主と\n の直接的な取引によらない部分であると定義される。このとき純資産と包括利益の間に\n (2)______________関係が成立する。包括利益は事業の利益と(3)______________から\n 構成される。実現したその他の包括利益の組替調整を(4)______________という。包括利益を\n 表示する場合の計算書には損益計算とは別の書面として(5)______________を作成する方式と\n 当期純利益の算定に続けてその他の包括利益の内訳項目を加減した(6)______________を作\n 成する方式がある。", "answer": "(1)純資産\n(2)クリーン・サープラス\n(3)その他の包括利益\n(4)リサイクリング\n(5)包括利益計算書\n(6)損益及び包括利益\n計算書", "topic": "包括利\n益の測\n定と表\n示", "chapter": 12}, {"no": 382, "page": 141, "type": "穴埋め", "question": "企業会計原則では、貸借対照表において、資産・負債・純資産は(1)______________によって記\n 載することを原則とし、資産の項目と負債または純資産の項目とを(2)______________することに\n よって、その全部または一部を貸借対照表から除去してはならないとされている。ただし、売掛金と\n (3)______________を相殺して、本体では相殺後の売掛金残高を表示し、貸倒引当金の額を\n (4)______________することが認められている。また資産は流動資産・固定資産および\n (5)______________資産に区分し、負債は流動負債と固定負債に区分して表示する。このよう\n な区分表示を行うための分類は、(6)______________基準と(7)______________年基準\n の両方を併用して行う。資産と負債が流動項目と固定項目に分類されると、次にこれらは貸借対照表\n 上に原則として(8)______________配列法に従って記載される。一方で固定的な項目から順に\n 配列する方法を(9) ______________配列法という。貸借対照表の様式には報告式と勘定式が\n あり、財務諸表規則11 条では報告式による貸借対照表の作成が要求されている。貸借対照表の表\n 示には重要性の原則が適用され、項目の性質や金額から判断して重要性が高い項目は、適切な項\n 目名を用いて別個に記載しなければならない。財務諸表等規則では、その金額が資産総額の(10)\n ______________％を超える項目は金額的に重要であると考え、個別の科目をもって記載するよう\n 規定している。", "answer": "(1)総額\n(2)相殺\n(3)貸倒引当金\n(4)注記\n(5)繰延\n(6)営業循環\n(7)1\n(8)流動性\n(9)固定性\n(10)5", "topic": "貸借対\n照表", "chapter": 12}, {"no": 383, "page": 142, "type": "誤答選\n択", "question": "（Ａ）企業会計原則では、貸借対照表において、資産・負債・純資産は総額によって記載することを\n 原則とし、資産の項目と負債または純資産の項目とを相殺することによって、その全部または一部を貸\n 借対照表から除去してはならないとされている。ただし、売掛金と貸倒引当金を相殺して、本体では相\n 殺後の売掛金残高を表示し、貸倒引当金の額を注記することが認められている。\n（Ｂ）企業会計原則では、貸借対照表において、資産は流動資産・固定資産および繰延資産に区\n 分し、負債は流動負債と固定負債に区分して表示する。このような区分表示を行うための分類は、営\n 業循環基準と１年基準の両方を併用して行われる。\n（Ｃ）貸借対照表の様式には報告式と勘定式があり、金融商品取引法のもとでは「財務諸表等の用\n 語、様式及び作成方法に関する規則」において、各項目を上から下へ資産・負債・純資産の順序で\n 配列して記載する報告式による貸借対照表の作成が要求されている。\n（Ｄ）貸借対照表の表示には重要性の原則が適用され、項目の性質や金額から判断して重要性が\n 高い項目は、適切な項目名を用いて別個に記載しなければならない。「財務諸表等の用語、様式及\n び作成方法に関する規則」では、例えば流動資産の未収収益などは、その金額が資産の総額の\n 10％を超える場合は金額的に重要であると考え、当該資産を示す名称による科目にて掲記するよう\n 規定している。", "answer": "D\n・10→5", "topic": "貸借対\n照表", "chapter": 12}, {"no": 384, "page": 142, "type": "正答選\n択", "question": "貸借対照表において固定資産はその形態的な特徴に従い、\nア．有形固定資産\nイ．無形固定資産\n ウ．繰延資産に区分表示される。\n エ．すべて誤り", "answer": "ア,イ\n・繰延資産→投資その\n 他の資産", "topic": "貸借対\n照表", "chapter": 12}, {"no": 385, "page": 143, "type": "誤答選\n択", "question": "（Ａ）財務諸表の様式には報告式と勘定式がある。そのうち勘定式は、複式簿記の原理にしたがい貸\n 方に収益項目を、借方に費用項目を記載する様式である。\n（Ｂ）貸借対照表の表示に際しては、明瞭性の原則にしたがい、資産・負債・純資産を総額によって\n 記載することを原則とし、資産の項目と負債または純資産の項目とを相殺することによって、その全部ま\n たは一部を貸借対照表から除去してはならない。ただし、減価償却累計額については注記を条件とし\n て固定資産の取得原価と相殺してもよい。\n（Ｃ）資産と負債はそれぞれ流動項目と固定項目に分類されるが、分類するときには1 年基準を原\n 則とし、営業循環基準を加味して行う。\n（Ｄ）中間財務諸表に関する会計原則として企業会計審議会が設定した中間財務諸表作成基準\n は、（a）一般原則、（b）作成基準、（c）表示方法、（d）注記事項の4 つの部分から構成さ\n れる。このうち一般原則としては、有用性の原則と継続性の原則が示されている。", "answer": "C\n・先に営業循環基準を\n適用", "topic": "貸借対\n照表", "chapter": 12}, {"no": 386, "page": 143, "type": "穴埋め", "question": "株式会社の純資産については、その期末残高を貸借対照表に区分  "chapter": 12}, {"no": 398, "page": 146, "type": "誤答選\n択", "question": "（Ａ）会社法が規定する会計書類の取扱いは、株式会杜の種類および会社が選択した統治制度に\n よって異なる。\n（Ｂ）会社法上の会計報告書は計算書類とよばれており、その作成と報告に際しては、会社法の関\n 連条文のほか、そのもとで制定された「会社法施行規則」、「会社計算規則」および．「電子公告規\n 則」という3 つの法務省令にも準拠しなければならない。\n（Ｃ）有価証券報告書は年次決算日から3 か月以内に提出しなければならず、四半期報告書は各\n 四半期末から60 日以内に提出しなければならない。\n（Ｄ）法人税の税額は、各事業年度ごとに算定される課税所得の額に、所定の税率を乗じて決定す\n る。", "answer": "C\n・60→45", "topic": "四半期\n財務諸\n表の公\n表制度", "chapter": 12}, {"no": 399, "page": 147, "type": "誤答選\n択", "question": "（Ａ）消費税の会計処理のうち、税抜方式では仕入時に支払った消費税を仮払消費税とし、販売時\n に受取った消費税を仮受消費税としたうえで、両者の差額を未払消費税として貸借対照表に計上す\n る。支払った消費税額の方が多ければ、未収消費税を計上する。\n（Ｂ）消費税の会計処理のうち、税込方式では消費税を含めて収益と費用を計上し、最終的に企業\n が納付すべき消費税額は支払消費税として損益計算書に計上する。\n（Ｃ）実務上、取引時点では税込方式で仕訳し、あとで一括して税抜方式に修正する処理方法が\n 認められている。\n（Ｄ）消費税について企業が選択した会計処理方法は、重要な会計方針として注記しなければなら\n ない。", "answer": "B\n・支払消費税→租税公\n課", "topic": "-", "chapter": 12}];

// Every numbered blank is independently tappable. Repeated references share their answer but not their visibility.
function inlineFill(question,answer){
 const answers={};
 const labels=[...answer.matchAll(/[（(]\s*([0-9０-９]+)\s*[）)]/g)];
 const normal=n=>String(n).replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296));
 for(let i=0;i<labels.length;i++){
  const from=labels[i].index+labels[i][0].length,to=i+1<labels.length?labels[i+1].index:answer.length;
  answers[normal(labels[i][1])]=answer.slice(from,to).trim().replace(/\s*\n\s*/g,'').replace(/[,、]\s*$/,'');
 }
 const escape=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 // Fullwidth parentheses, line breaks, underscore blanks and whitespace-only blanks.
 const blank=/([（(]\s*([0-9０-９]+)\s*[）)])((?:[ \t\r\n]*[_＿]{2,})|(?:[ \t]{2,}(?=\S)))/g;
 let count=0,last=0,html='';
 for(const m of question.matchAll(blank)){
  const value=answers[normal(m[2])];
  if(!value)continue;
  const raw=m[3],placeholder=/[_＿]/.test(raw)?raw:'________';
  html+=escape(question.slice(last,m.index))+escape(m[1])+'<button type="button" class="tap-blank" aria-label="空欄 '+normal(m[2])+' の答えを表示" aria-pressed="false" data-answer="'+escape(value)+'" data-blank="'+escape(placeholder)+'">'+escape(placeholder)+'</button>';
  last=m.index+m[0].length;count++;
 }
 html+=escape(question.slice(last));return {html,ok:count>0};
}
function toggleBlank(button,show){
 const reveal=show===undefined?!button.classList.contains('revealed'):show;
 button.classList.toggle('revealed',reveal);
 button.textContent=reveal?button.dataset.answer:button.dataset.blank;
 button.setAttribute('aria-pressed',String(reveal));
 button.setAttribute('aria-label',reveal?'答え '+button.dataset.answer+' を隠す':'空欄の答えを表示');
}
