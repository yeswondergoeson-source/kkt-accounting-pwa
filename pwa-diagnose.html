<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KKT PWA 診断</title><style>body{font-family:system-ui;padding:18px;line-height:1.6;background:#f6f8fc;color:#17233b}pre{white-space:pre-wrap;word-break:break-word;background:white;padding:14px;border-radius:12px}button{padding:14px;border:0;background:#164cc2;color:white;border-radius:10px;font-size:16px}</style><h2>KKT会計 インストール診断</h2><p>公開サイトの設定とアイコン、オフライン機能を確認します。結果をスクリーンショットで送ってください。</p><button id="go">診断する</button><pre id="out">待機中</pre><script>
const out=document.querySelector('#out');const lines=[];function log(s){lines.push(s);out.textContent=lines.join('\n')}async function check(){lines.length=0;log('診断開始');log('URL: '+location.href);log('HTTPS: '+(location.protocol==='https:'));log('ServiceWorker対応: '+('serviceWorker'in navigator));log('Standalone: '+matchMedia('(display-mode: standalone)').matches);for(const file of ['index.html','manifest.webmanifest','sw.js','icon-192.png','icon-512.png']){try{const r=await fetch('./'+file+'?diagnose='+Date.now(),{cache:'no-store'});log(file+': HTTP '+r.status+' / '+(r.headers.get('content-type')||'MIME不明'));if(file.endsWith('.png')&&r.ok){const blob=await r.blob();const bmp=await createImageBitmap(blob);log('  画像サイズ: '+bmp.width+'×'+bmp.height)}if(file==='manifest.webmanifest'&&r.ok){try{const m=await r.json();log('  名前: '+(m.name||m.short_name));log('  display: '+m.display);log('  start_url: '+m.start_url);log('  icons: '+m.icons.map(x=>x.src).join(', '))}catch(e){log('  JSON解析失敗: '+e.message)}}}catch(e){log(file+': 読み込み失敗 '+e.message)}}try{const reg=await navigator.serviceWorker.getRegistration('./');log('SW登録: '+(reg?(reg.active?'有効':'登録済み・未起動'):'なし'));if(reg)log('SW scope: '+reg.scope)}catch(e){log('SW確認失敗: '+e.message)}log('診断完了')}document.querySelector('#go').onclick=check;check();
</script></html>
