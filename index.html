業以外の取引から生じたものである。また(4)______________は、不動産の賃貸や金銭の\n 貸付のように、一定の契約に従い継続してサービスの提供を行う場合に、すでに提供したサービスに対し\n ていまだその対価の支払を受けていない額をいう。\n・売掛金は営業循環過程の中の項目であるから、原則として(5)______________資産である。た\n だし破産債権、更生債権のように正常な営業循環から離れてしまったものについては\n (6)______________基準を適用し、決算日後1 年以内に回収できない金額は\n (7)______________として固定資産に分類する。", "answer": "(1)売掛金\n(2)売上債権\n(3)未収金\n(4)未収収益\n(5)流動\n(6)1 年\n(7)投資その他の資産", "topic": "売掛金", "chapter": 6}, {"no": 195, "page": 71, "type": "正答選\n択", "question": "売上債権には、\n ア．売掛金\nイ．短期貸付金\n ウ．受取手形がある。\n エ．すべて誤り", "answer": "ア,ウ\n・売上債権は営業上の\n 未収入金のみである", "topic": "売掛金", "chapter": 6}, {"no": 196, "page": 71, "type": "正答選\n択", "question": "販売時点で計上した収益と売掛金は、\n ア．値引\n イ．返品\n ウ．割戻といった理由により、その一部が事後的に減額されることがある。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "売掛金", "chapter": 6}, {"no": 197, "page": 71, "type": "誤答選\n択", "question": "（Ａ）販売時点で計上した収益と売掛金は、種々の理由により、その一部が事後的に減額されること\n がある。そのうち、売上値引は、製品の品質不良や欠陥などの理由により、単位当たりの売価を切り下\n げることから生じた掛代金の減額分である。\n（Ｂ）売掛金とは、得意先との間の通常の取引に基づいて発生した営業上の未収入金であり、役務\n の提供による営業収益で未収のものもこれに含まれる。\n（Ｃ）売掛金は営業循環過程の中の項目であるから、原則として流動資産である。ただし破産債権、\n 更生債権のように正常な営業循環から離れてしまったものについては全て「投資その他の資産」として固\n 定資産に分類する。\n（Ｄ）売掛金に類似する項目として、未収金と未収収益がある。そのうち未収金は、土地や有価証券\n の売却のような、主たる営業以外の取引から生じたものである。", "answer": "C\n・1 年基準を適用し、決\n算日後1 年以内に回\n 収できない金額は投資\n その他の資産とする", "topic": "売掛金", "chapter": 6}, {"no": 198, "page": 72, "type": "誤答選\n択", "question": "（Ａ）商品等の販売の対価として企業が獲得する貨幣性資産には、現金のほか売掛金と受取手形\n があるが、売掛金と受取手形はあわせて売上債権とよばれる。\n（Ｂ）売掛金は、得意先との間の通常の取引に基づいて発生した営業上の未収入金であり、役務の\n 提供による営業収益で未収のものはこれに含まれない。\n（Ｃ）未収金は土地や有価証券の売却のような、主たる営業以外の取引から生じたものである。\n（Ｄ）未収収益は、不動産の賃貸や金銭の貸付のように、一定の契約に従い継続して役務の提供を\n 行う場合に、すでに提供した役務に対していまだその対価の支払を受けていない額をいう。", "answer": "B\n・役務提供による未収も\n 含まれる", "topic": "売掛金", "chapter": 6}, {"no": 199, "page": 72, "type": "正答選\n択", "question": "売上債権には、\n ア．売換金\n イ．未収金\n ウ．未収収益が含まれる。\n エ．すべて誤り", "answer": "ア\n・売上債権は営業上の\n 未収入金のみである", "topic": "売掛金", "chapter": 6}, {"no": 200, "page": 72, "type": "穴埋め", "question": "受取手形や電子記録債権には、満期日を待って現金化する以外に、(1)______________および\n (2)______________という２通りの利用方法がある。(3)______________は、満期日前に\n 銀行や貸金業者に手形や債権を持込み、満期日までの金利に相当する割引料を負担して早期に現\n 金化することをいう。また(4)______________は、仕入先などに対して代金支払のために、手形や\n 債権を引渡すことをいう。割引や譲渡の後に、支払義務者が支払不能になれば、割引や譲渡を行った\n 者は、債権者からの請求により支払いに応じなければならない義務を負う。この条件付の遡及義務は\n (5)______________の一種であり、金融資産の消滅に伴って新たに発生した金融負債の性質を\n もつ。", "answer": "(1)割引\n(2)譲渡\n(3)割引\n(4)譲渡\n(5)偶発債務", "topic": "受取手\n形と電\n子記録\n債権", "chapter": 6}, {"no": 201, "page": 72, "type": "穴埋め", "question": "受取手形や電子記録債権には、満期日を待って現金化する以外に、(1)______________および\n 譲渡という２通りの利用方法がある。(1)______________は、満期日前に銀行や貸金業者に手\n 形や債権を持込み、満期日までの金利に相当する(1)______________料を負担して早期に現\n 金化することをいう。", "answer": "(1)割引", "topic": "受取手\n形と電\n子記録\n債権", "chapter": 6}, {"no": 202, "page": 73, "type": "穴埋め", "question": "・決算時には、貸倒れ見積高を算定して、当期の販売費の1 項目として損益計算書に計上するととも\n に、その額を(1)______________として設定しなければならない。期末に設定された貸倒引当金\n は、翌期に貸倒れが実際に生じた時点で(2)______________等と相殺されて減少し、翌期末の\n 決算時点で再び必要額が繰入れられることになる。\n・ただし不要となった貸倒引当金の(3)______________による戻入額は、新規の繰入額と相殺さ\n れる。相殺後の繰入額は、対象となった債権の割合などで按分し、営業上の取引から生じた債権に対\n する部分は営業費用のうちの(4)______________とし、営業外の取引から生じた債権に対する\n 部分は(5)______________とする。\n・逆に取崩額の方が大きければ、営業債権の場合その差額を当期の販売費から\n (6)______________し、営業外債権の場合、当期の(7)______________に計上する。また\n 過年度に債権額を直接減額した後に残額を上回る回収があった場合の差額は\n (8)______________に計上とする。したがって(9)______________として特別利益に計上す\n る処理は行わない。", "answer": "(1)貸倒引当金\n(2)売掛金\n(3)取崩\n(4)販売費\n(5)営業外費用\n(6)控除\n(7)営業外収益\n(8)営業外収益\n(9)償却債権取立益", "topic": "貸倒引\n当金", "chapter": 6}, {"no": 203, "page": 73, "type": "穴埋め", "question": "期末に設定された貸倒引当金は、翌期に貸倒れが実際に生じた時点で売掛金等と相殺されて減少す\n るが、過年度に債権額を直接減額した後に残額を上回る回収があった場合の差額は\n (1)______________に計上する。", "answer": "(1)営業外収益", "topic": "貸倒引\n当金", "chapter": 6}, {"no": 204, "page": 73, "type": "正答選\n択", "question": "不要になった貸倒引当金の取崩しによる戻入額は新規の繰入額と相殺されるが、新規の繰入額の方\n が大きい場合、相殺後の繰入額は、対象となった債権の割合などで按分して、\n ア．販売費（および一般管理費）\nイ．営業外費用\n ウ．特別損失に分かれる。\n エ．すべて誤り", "answer": "ア,イ\n・営業上の取引から生じ\n たものは販売日、営業\n 外の取引から生じたも\n のは営業外費用とする", "topic": "貸倒引\n当金", "chapter": 6}, {"no": 205, "page": 74, "type": "誤答選\n択", "question": "（Ａ）期末に設定された貸倒引当金は、翌朝に貸倒れが実際に生じた時点で売掛金等と相殺されて\n 減少し、翌期末の決算時点で再び必要額が繰入れられることになる。\n（Ｂ）不要となった貸倒引当金の取崩による戻入額は、新規の繰入額と相殺される。相殺後の繰入\n 額は、対象となった債権の割合などで按分し、営業上の取引から生じた債権に対する部分は販売費と\n し、営業外の取引から生じた債権に対する部分は営業外費用とする。\n（Ｃ）不要となった貸倒引当金の取崩による戻入額が新規の繰入額よりも大きければ、その差額を営\n 業利益に計上する。\n（Ｄ）過年度において、すでに貸倒れとして処理した売掛金等が回収された場合は、その金額を償却\n 債権取立益として特別利益に計上する。", "answer": "C\n・営業債権の場合、販\n 売費から控除し営業\n 外債権の場合当期の\n営業外損益に計上", "topic": "貸倒引\n当金", "chapter": 7}, {"no": 206, "page": 74, "type": "穴埋め", "question": "・売上収益を得るために払出すことを予定して保有している資産で、短期のうちに数量的に減少する項\n 目を(1)______________という。具体的には次の4 項目のいずれかに該当するものである。\n通常の営業過程において販売するために保有する資産。この代表は商品と製品である。会計では、完\n 成品を他企業から購入した場合は(2)______________とよび、自社生産の場合は(3)\n ______________と名づけて区別している。\n販売を目的として現に製造中の資産。この代表は仕掛品と半製品である。両者は未完成品である点で\n 共通するが、未完成のまま販売できる市場があるものは(4) ______________、市場がないものは\n (5)______________として区別する。\n販売目的の財やサービスを生産するために、短期間に消費する予定の資産。この代表は\n (6)______________である。\n販売活動と一般管理活動において短期間に消費する予定の資産。たとえば荷造用品や事務用消耗\n 品がこれに該当する。これらの資産は、工場用消耗品や消耗工具器具備品などとあわせて、\n (7)______________とよばれることがある。\n\n・棚卸資産は、貸借対照表の(8)______________の部において、①商品および製品（半製品を\n 含む）②仕掛品③原材料および貯蔵品の３つのグループに区分して記載される。", "answer": "(1)棚卸資産\n(2)商品\n(3)製品\n(4)半製品\n(5)仕掛品\n(6)原材料\n(7)貯蔵品\n(8)流動資産", "topic": "棚卸資\n産の範\n囲と区\n分", "chapter": 7}, {"no": 207, "page": 75, "type": "誤答選\n択", "question": "（Ａ）通常の営業過程において販売するために保有する財貨や用役は棚卸資産に該当し、そのうち、\n 完成品を他企業から購入した場合は商品とよんでいる。\n（Ｂ）販売を目的として現に製造中の財貨や用役は棚卸資産に該当し、そのうち、未完成のまま販売\n できる市場があるものは仕掛品とよんでいる。\n（Ｃ）販売目的の財貨や用役を生産するために、短期間に消費する予定の財貨は棚卸資産に該当\n し、たとえば原材料がこれに該当する。\n（Ｄ）販売活動と一般管理活動において短期間に消費する予定の財貨は棚卸資産に該当し、たとえ\n ば貯蔵品がこれに該当する。", "answer": "B\n・仕掛品→半製品", "topic": "棚卸資\n産の範\n囲と区\n分", "chapter": 7}, {"no": 208, "page": 75, "type": "正答選\n択", "question": "棚卸資産とは、売上収益を得るために払出すことを予定して保有している財貨で、短期のうちに数量的\n に減少する項目をいい、棚卸資産には、\n ア．製品\n イ．半製品\n ウ．仕掛品が含まれる。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "棚卸資\n産の範\n囲と区\n分", "chapter": 7}, {"no": 209, "page": 75, "type": "穴埋め", "question": "・購入した棚卸資産の取得現価は購入代価に(1)______________を加算して決定する。付随費\n 用は副費ともよばれ、これには企業外部で発生する(2)______________と企業内部で発生する\n (3)______________がある。このうち購入代価に加算して取得原価に含める副費の範囲は、売\n 上収益との対応関係や金額的な重要性を考慮して決定する。\n・また(4)______________や(5)______________を受けた場合には、その金額を購入代価か\n ら控除する。しかし(6)______________は金利の性質を有するため、棚卸資産の購入代価から\n 控除せず、営業外収益として取扱う。", "answer": "(1)付随費用\n(2)外部副費\n(3)内部副費\n(4)仕入値引\n(5)仕入割戻\n(6)仕入割引", "topic": "購入の\n場合", "chapter": 7}, {"no": 210, "page": 75, "type": "正答選\n択", "question": "購入した棚卸資産の取得原価を決定する際、購入代価から控除または加算されうるものには、\nア．外部副費\n イ．仕入割引\n ウ．仕入割戻がある。\n エ すべて誤り", "answer": "ア,ウ\n・仕入割引は金利の性\n 質を有するため営業外\n 収益とする", "topic": "購入の\n場合", "chapter": 7}, {"no": 211, "page": 76, "type": "誤答選\n択", "question": "（Ａ）財務諸表の作成にあたり、製品等の取得原価として採用することが認められているのは、実際原\n 価計算または標準原価計算によって算定された製品単位当たりの原価数値であり、直接原価計算に\n よって算定された製品単位当たりの原価数値は財務諸表の作成にあたっては適切な取得原価とは認\n められない。\n（Ｂ）棚卸資産の購入代価を計算する際、仕入割引や仕入割戻を受けた場合にはその金額を購入\n 代価から控除する。\n（Ｃ）棚卸資産は、貸借対照表の流動資産の部において、①商品および製品（半製品を含む）②\n 仕掛品③原材料および貯蔵品の３つのグループに区分して記載される。\n（Ｄ）通常の販売目的で保有する棚卸資産について、期末の正味売却価額が取得原価より下落し\n ている場合は、その正味売却価額をもって貸借対照表への計上額としなければならない。", "answer": "B\n・仕入割引は金利の性\n 質を有するため営業外\n 収益とする", "topic": "購入の\n場合", "chapter": 7}, {"no": 212, "page": 76, "type": "正答選\n択", "question": "棚卸資産の購入代価から控除せず、営業外収益として取扱うものには、\n ア．仕入値引：晶質不良等による単価の切下げ分\n イ．仕入割戻：多額の購入をしたことによる代金の減額分\n ウ．仕入割引：仕入代金の早期支払に伴う支払免除額がある。\n エ．すべて誤り", "answer": "ウ\n・仕入値引や仕入割戻\n は購入代価から控除\n する", "topic": "購入の\n場合", "chapter": 7}, {"no": 213, "page": 77, "type": "穴埋め", "question": "・自社で生産した製品等の取得現価は、適正な原価計算の基準に準拠して算定された製造原価によ\n る。そのような基準の代表は企業会計審議会の(1)______________である。原価計算には、\n (2)______________原価計算、(3)______________原価計算、(4)______________\n 原価計算という３つの代表的形態がある。\n 実際原価計算は、財貨やサービスの実際(5) ______________と、実際の(6)\n ______________（予定価格を含む）を用いて製品の原価を計算する方法をいう。\n 標準原価計算は、財貨やサービスの消費量を科学的・統計的調査に基づいて\n (7)______________の尺度となるように設定し、これに(8)______________価格または\n (9)______________価格を用いて、製品の原価を計算する方法である。\n さらに直接原価計算は、製造に要する諸費用を、販売量に比例して発生する変動費と、販売量が変\n 化しても発生額が変化しない固定費に分類し、(10)______________だけを集計して製品の原\n 価を計算する方法をいう。\n 財務諸表の作成にあたり、製品等の取得原価として採用することが認められているのは、\n (11)______________原価計算または(12)______________原価計算によって算定された\n 原価であり、(13)______________原価計算によって計算された原価は採用できる適切な取得\n 原価とは認められない。\n・製造業を営む企業の経営成績は生産コストの動向から重要な影響を受けるので、財務諸表規則は\n 金融商品取引法の開示制度の適用企業に対し、(14)______________を作成し損益計算書に\n 添付して公表するよう求めてきた。", "answer": "(1)原価計算基準\n(2)実際\n(3)標準\n(4)直接\n(5)消費量\n(6)取得価格\n(7)能率\n(8)予定\n(9)正常\n(10)変動費\n(11)実際\n(12)標準\n(13)直接\n(14)製造原価明細書", "topic": "自社生\n産の場\n合", "chapter": 7}, {"no": 214, "page": 78, "type": "誤答選\n択", "question": "（Ａ）実際原価計算は、財貨や用役の実際消費量と、実際の取得価格（予定価格を含む）を用\n いて製品の原価を計算する方法をいう。\n（Ｂ）標準原価計算は、財貨や用役の消費量を科学的・統計的調査に基づいて能率の尺度となる\n ように設定し、これに予定価格または正常価格を用いて、製品の原価を計算する方法である。\n（Ｃ）直接原価計算は、製造に要する諸費用を、販売量に比例して発生する変動費と、販売量が変\n 化しても発生額が変化しない固定費に分類し、変動費だけを用いて製品の原価を計算する方法をい\n う。\n（Ｄ）財務諸表の作成にあたり、製品等の取得原価として採用することが認められているのは、実際原\n 価計算または標準原価計算によって算定された原価であり、直接原価計算によって計算された原価は\n 採用できる適切な取得原価とは認められない。", "answer": "C\n・販売量→生産量", "topic": "自社生\n産の場\n合", "chapter": 7}, {"no": 215, "page": 78, "type": "正答選\n択", "question": "自社で生産した製品等の取得原価は、適正な原価計算の基準に準拠して算定された製造原価による\n が、そのような基準の代表は企業会計審議会の原価計算基準であり、原価計算には、\nア．実際原価計算\nイ．標準原価計算\n ウ．間接原価計算という３つの代表的形態がある。\n エ．すべて誤り", "answer": "ア,イ\n・間接→直接", "topic": "自社生\n産の場\n合", "chapter": 7}, {"no": 216, "page": 78, "type": "穴埋め", "question": "期中に棚卸資産を受入れるつど、その数量を記録しておき、期末に実地棚卸を行なって実際の有高数\n 量を把握して、これを期首数量と期中受入数量の合計から控除することにより、払出数量を算定する\n 方法を(1)______________という。資産の種類ごとに在庫帳を作成し、受入れと払出しのつどその\n 数量を記録して、帳簿上の残高数量を常に算定しておく方法を(2)______________という。", "answer": "(1)棚卸計算法\n(2)継続記録法", "topic": "払出数\n量の把\n握", "chapter": 7}, {"no": 217, "page": 78, "type": "穴埋め", "question": "売上原価を算定する基礎となる払出数量の把握方法のうち、資産の種類ごとに在庫帳を作成し、受\n 入れと払出しのつどその数量を記録して、帳簿上の残高数量を常に算定しておく方法を\n (1)______________という。", "answer": "(1)継続記録法", "topic": "払出数\n量の把\n握", "chapter": 7}, {"no": 218, "page": 79, "type": "穴埋め", "question": "・売上原価という費用項目は、売上収益との対応関係を特定の財やサービスを媒介として直接的に識\n 別できる点で、特徴を有する。そのような収益と費用の対応関係を(1)______________という。\n・販売のつど売上原価を計上する場合、これに最も適合した仕訳は次の手順で行われる。\n 期中に商品を仕入れるつど、取得原価を(2)______________に資産計上する。\n 期中に商品を販売するつど、売上高を計上すると同時に、払出した商品の取得原価を\n (3)______________へ振替える。\n この結果、販売のつど収益と費用が並行して計上されると同時に商品勘定の残高は常に在庫金額に\n 一致するから、決算整理仕訳を要しない。\n 他方、期末に一期間の売上原価を一括して計上する方式を採用する場合の仕訳方法は次のとおりで\n ある。\n 期中に商品を仕入れるつど、取得原価を(4)______________に計上する。\n 期中に商品を販売するつど、売上高を計上するが対応する売上原価は計上しない。\n 期末の決算整理において、期首の在庫金額を仕入勘定に振替えるとともに、期末の在庫金額を仕入\n 勘定から控除して(5)______________に計上する。", "answer": "(1)個別的対応\n(2)商品勘定\n(3)売上原価勘定\n(4)仕入勘定\n(5)繰越商品勘定", "topic": "売上原\n価の計\n上", "chapter": 7}, {"no": 219, "page": 80, "type": "穴埋め", "question": "・棚卸資産の数量に乗じるべき単価は棚卸資産の原価総額を売上原価になる部分と次期への繰越部\n 分に配分するのに用いられることから(1) ______________とよばれる。企業が選択可能な評価方\n 法の範囲は(2) ______________、(3) ______________、(4) ______________（移\n 動平均法と総平均法がある）、および(5)______________に限定されている。\n・(6)______________は貸借対照表に計上される棚卸資産の金額が、遠い過去の仕入分の取\n 得原価から構成されるため、時価から乖離する傾向が強い。また期首在庫への食込みが生じると、遠\n い過去の取得原価が売上原価に算入されて、利益額が大きく変動するという問題が生じる。したがって\n この方法の採用は認められず国際会計基準でも許容されていない。\n・(7)______________を採用した場合には、売上高と同時に売上原価を計上する仕訳方式を実\n 行することはできない。\n・(8)______________は、「棚卸資産の評価に関する会計基準」において期末在庫の大部分が最\n 終の受入単価で取得されている場合や、期末棚卸資産に重要性が乏しい場合においてのみ、採用が\n 認容されている。", "answer": "(1)原価配分方法\n(2)個別法\n(3)先入先出法\n(4)平均原価法\n(5)売価還元法\n(6)後入先出法\n(7)総平均法\n(8)最終仕入原価法", "topic": "取得原\n価を基\n礎とする\n方法", "chapter": 7}, {"no": 220, "page": 80, "type": "誤答選\n択", "question": "（Ａ）棚卸資産に該当するものの具体例として、通常の営業過程において販売するために他企業から\n 購入した完成品や自社生産した製品、販売を目的として製造中の半製品や仕掛品のほかに、証券\n 会社や銀行が販売目的で保有する有価証券や、不動産業者が販売目的で保有する土地や建物が\n ある。\n（Ｂ）製造業を営む企業の経営成績は、生産コストの動向から重要な影響を受けるので、金融商品\n 取引法の開示制度の適用企業に対して、製造原価明細書を作成し損益計算書に添付して公表す\n るよう求めているが、セグメント情報を開示する企業は、製造原価明細書の添付は不要である。\n（Ｃ）実際の取得原価を用いて棚卸資産の払出単価を算定する場合、総平均法と移動平均法は、\n いずれの評価方法を採用した場合でも、売上高と売上原価を同時に計上することが可能である。\n（Ｄ）最終仕入原価法は、「棚卸資産の評価に関する会計基準」において選択が可能な評価方法に\n 定められていないが、期末在庫の大部分が最終の受入単価で取得されている場合や、期末棚卸資産\n に重要性が乏しい場合においてのみ、採用が認容されている。", "answer": "C\n・総平均法では同時に\n 計上できない", "topic": "取得原\n価を基\n礎とする\n方法", "chapter": 7}, {"no": 221, "page": 81, "type": "正答選\n択", "question": "2010 年4 月以後開始した年度から適用されている企業会計基準第9 号「棚卸資産の評価に関す\n る会計基準」によれば、企業が選択可能な評価方法の範囲は、先入先出法の他には、\n ア．個別法\nイ．後入先出法\n ウ．売価還元法に限定される。\n エ．すべて誤り", "answer": "ア,ウ\n・選択可能な評価方法\n には個別法、先入先\n 出法、平均原価法、\n売価還元法に限定", "topic": "取得原\n価を基\n礎とする\n方法", "chapter": 7}, {"no": 222, "page": 81, "type": "正答選\n択", "question": "2008 年9 月に改正された企業会計基準「棚卸資産の評価に関する会計基準」によれば、2010 年\n 4 月以後開始する年度からは企業が選択できる棚卸資産の評価方法の範囲は、個別法の他には、\nア．後入先出法\nイ．平均原価法\n ウ．売価還元法に限定される。\n エ．すべて誤り", "answer": "イ,ウ\n・選択可能な評価方法\n には個別法、先入先\n 出法、平均原価法、\n売価還元法に限定", "topic": "取得原\n価を基\n礎とする\n方法", "chapter": 7}, {"no": 223, "page": 81, "type": "穴埋め", "question": "・予定価格等を用いると、事後的に判明する実際価格との間で(1)______________が生じる。原\n 価差額が僅少な場合には(2)______________に賦課することができる。しかし比較的多額の原\n 価差異が生じた場合にはこれを売上原価と(3)______________に按分して配賦する必要があ\n る。", "answer": "(1)原価差額\n(2)売上原価\n(3)期末棚卸資産", "topic": "予定価\n格等を\n用いる\n方法", "chapter": 7}, {"no": 224, "page": 81, "type": "誤答選\n択", "question": "（Ａ）先入先出法は、最も古く取得されたものから順次払出しが行われ、期末棚卸品は最も新しく取\n 得されたものからなると見なして、払出単価を計算する方法である。物価上昇時に適用すれば、保有\n 期間中の価格上昇分が利益に含まれることになる。\n（Ｂ）売価還元法は、値入率等の類似性に基づく棚卸資産のグループごとの期末の売価合計額に、\n 原価率を乗じて求めた金額を期末棚卸資産の価額とする方法である。\n（Ｃ）平均原価法として総平均法を採用した場合、予定価格や標準原価を適用して算定された製\n 造原価もまた、適正な取得原価として認められる。\n（Ｄ）予定価格や標準価格を設定し、棚卸資産の払出単価として利用する場合、原価差額は売上\n 原価と期末棚卸資産に按分して配賦する必要があり、原価差額の全額を売上原価に賦課することは\n できない", "answer": "D\n・原価差額の全額を売\n 上原価に賦課すること\n も可能", "topic": "予定価\n格等を\n用いる\n方法", "chapter": 7}, {"no": 225, "page": 82, "type": "穴埋め", "question": "異なる品目の資産を値入率の類似性に従ってグループに区分し、一グループに属する期末商品の売価\n 合計額に原価率を適用して、期末棚卸品の金額を算定する方法を(1)______________という。\n 売価還元平均原価法における原価率の計算式の分母から、値下額と値下取消額を除いて計算され\n る原価率を用いた場合は、(2)______________とよばれ、低価基準の範囲に含められる。", "answer": "(1)売価還元法\n(2)売価還元低価法", "topic": "売価還\n元法", "chapter": 7}, {"no": 226, "page": 82, "type": "誤答選\n択", "question": "（Ａ）財務諸表の作成にあたり、製品等の取得原価として採用することが認められているのは、実際原\n 価計算または標準原価計算によって算定された製品単位当たりの原価数値であり、直接原価計算に\n よって算定された製品単位当たりの原価数値は財務諸表の作成にあたって採用できる適切な取得原\n 価とは認められない。\n（Ｂ）棚卸資産の購入代価を計算する際、仕入値引や仕入割戻を受けた場合には、その金額を購\n 入代価から控除する。\n（Ｃ）後入先出法は、最も新しく取得されたものから払出しが行われ、期末棚卸品は最も古く取得さ\n れたものからなると見なして、払出単価を計算する方法である。なお、「棚卸資産の評価に関する会計\n 基準」では後入先出法の採用は認められていない。\n（Ｄ）売価還元法における期末棚卸品の金額の算定に用いられる原価率について、売価還元平均\n 原価法における原価率の計算式の分母から、値上額と値上取消額を除いて計算される原価率を用い\n た場合は、売価還元低価法とよばれ、低価基準の範囲に含められる。", "answer": "D\n・値上額と値上取消額\n→値下額と値下取消\n額", "topic": "売価還\n元法", "chapter": 7}, {"no": 227, "page": 82, "type": "穴埋め", "question": "実地棚卸で判明した実際の在庫数量の不足分が発生している場合には、その金額を\n (1)______________として把握し、棚卸資産の帳簿価格から切捨てなければならない。", "answer": "(1)棚卸減耗費", "topic": "棚卸減\n耗費", "chapter": 7}, {"no": 228, "page": 83, "type": "穴埋め", "question": "・期末に実在する在庫の帳簿価額よりもその時価が低下している時、その時価の下落は資産価値の減\n 少を意味するので、評価額を時価まで切り下げて(1)______________を計上しなければならな\n い。棚卸資産の時価の下落が生じる主要な原因には(2)______________な劣化、\n (3)______________な劣化、および市場の(4)______________の3 つがある。\n・棚卸資産の期末評価の方法として時価が下落しても取得原価で評価し続けるのが\n (5)______________であり、期末の時価と帳簿価額を比較して、いずれか低い方で評価するのが\n (6)______________である。企業会計基準第9 号「棚卸資産の評価に関する会計基準」では\n (7)______________の適用が強制されている。\n・棚卸資産の期末評価にあたり、帳簿価額と対比すべき時価は(8)______________である。棚卸\n 資産の簿価と時価の比較は、(9)______________品目ごとに行うのが原則であるが、複数の品\n 目をグループ化した方が適切であれば、継続適用を条件として(10)______________別に比較す\n ることができる。簿価切下げにより時価で評価した棚卸資産のその後の会計処理方法には、\n (11)______________方式と(12)______________方式がある。特別損失に計上した棚卸\n 評価損には、(13)______________方式を適用することはできない。", "answer": "(1)棚卸評価損\n(2)物理的\n(3)経済的\n(4)価格変動\n(5)原価法\n(6)低下法\n(7)低下法\n(8)正味売却価額\n(9)個別\n(10)グループ\n(11)洗い替え\n(12)切り放し\n(13)洗い替え", "topic": "販売目\n的で保\n有する\n在庫の\n棚卸評\n価損", "chapter": 7}, {"no": 229, "page": 83, "type": "誤答選\n択", "question": "（Ａ）棚卸資産の時価の下落が生じる主要な原因のひとつとして、物質的に欠陥がなくても、流行遅\n れや新製品の発売による旧式化などにより、資産が経済的に陳腐化して価値が低下する経済的な劣\n 化がある。\n（Ｂ）企業会計基準第9 号「棚卸資産の評価に関する会計基準」では、通常の販売目的で保有す\n る棚卸資産について、期末の正味売却価額が取得原価より上昇または下落している場合に関わら\n ず、正味売却価額をもって貸借対照表への計上額とすることとしている。\n（Ｃ）簿価切下げにより時価で評価した棚卸資産のその後の会計処理方法には、洗い替え方式と切\n 放し方式がある。特別損失に計上した棚卸評価損には、洗い替え方式を適用することはできない。\n（Ｄ）棚卸資産の簿価と時価の比較は、個別品目ごとに行うのが原則であるが、複数の品目をグルー\n プ化した方が適切であれば、継続適用を条件としてグループ別に比較することができる。", "answer": "B\n・正味売却価額が取得\n 原価より低下している\n 場合のみ", "topic": "販売目\n的で保\n有する\n在庫の\n棚卸評\n価損", "chapter": 7}, {"no": 230, "page": 84, "type": "誤答選\n択", "question": "（Ａ）購入した棚卸資産の取得原価は、購入代価に付随費用を加算して決定する。また仕入値引\n や仕入割戻を受けた場合には、その金額を購入代価から控除する。しかし仕入割引は金利の性質を\n 有するため、棚卸資産の購入代価から控除せず、営業外収益として取扱う。\n（Ｂ）自社で生産した製品等の取得原価は、適正な原価計算の基準に準拠して算定された製造原\n 価による。原価計算には、実際原価計算・標準原価計算・直接原価計算という３つの代表的形態が\n ある。\n（Ｃ）先入先出法は、最も古く取得されたものから順次払出しが行われ、期末棚卸品は最も新しく取\n 得されたものからなるとみなして、払出単価を計算する方法である。\n（Ｄ）簿価切下げにより時価で評価した棚卸資産のその後の会計処理方法には、洗い替え方式と切\n 放し方式がある。切放し方式では、期末に計上した評価損を翌期首に戻し入れて、いったん元の帳簿\n 価額に復元したうえで、翌期末の新たな時価との比較が行われる。", "answer": "D\n・洗い替え方式の説明", "topic": "販売目\n的で保\n有する\n在庫の\n棚卸評\n価損", "chapter": 7}, {"no": 231, "page": 84, "type": "正答選\n択", "question": "通常の販売目的で保有する棚卸資産は、\n ア．在庫品の保管や陳列中に品質低下による物理的な欠陥が生じた場合\n イ．新製品の発売による旧式化などにより、資産が経済的に陳腐化して価値が低下した場合\n ウ．市場の需給変化に起因して売価が取得原価よりも低下した場合の３つのいずれかが生じた場\n 合、棚卸評価損を計上しなければならない。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "販売目\n的で保\n有する\n在庫の\n棚卸評\n価損", "chapter": 7}, {"no": 232, "page": 84, "type": "穴埋め", "question": "一般企業が保有する暗号資産については、次の会計処理が求められている。暗号資産は買取の合意\n が成立した時点で(1)______________により資産計上し、転売の約束の時点で\n (2)______________との差額を損益として認識する。すなわち取引は、(3)______________\n 基準ではなく(4)______________基準で処理される。\n\nまた期末の評価も(5)______________で行い、評価差額は(6)______________として認識\n する。ただし活発な市場が存在しない場合は(7)______________をもって貸借対照表価額とし、\n 期末の(8)______________が取得原価を下回れば、その差額を(9)______________として\n 認識する", "answer": "(1)取得原価\n(2)時価\n(3)受渡日\n(4)約定日\n(5)時価\n(6)損益\n(7)取得原価\n(8)処分見込額\n(9)減損損失", "topic": "暗号資\n産", "chapter": 7}, {"no": 233, "page": 85, "type": "正答選\n択", "question": "企業会計基準委員会の実務対応報告第38 号「資金決済法における暗号資産の会計処理等に関\n する当面の取扱い」によれば、一般企業が保有する暗号資産に関する会計処理は、以下のとおりであ\n る。\n （Ａ）売買の合意が行われた時に売却損益の認識を行う。\n （Ｂ）活発な市場が存在する場合、期末の評価は時価で行い、評価差額を損益として認識する。\n （Ｃ）活発な市場が存在しない場合、取得原価をもって貸借対照表価額とする。期末における処分\n 見込価額が取得原価を下回っても、期末の貸借対照表価額は取得原価のままとする。\n （Ｄ）全て誤り", "answer": "A,B\n・処分見込価額が取得\n 原価を下回ればその差\n 額を減損損失として認\n 識する", "topic": "暗号資\n産", "chapter": 8}, {"no": 234, "page": 85, "type": "穴埋め", "question": "・固定資産は主として次の2 種類の項目からなる。1.企業が経済活動を遂行するために1 年を超える\n 長期にわたって利用する(1) ______________、および2.現金化されるまでの期間が決算日から\n 1 年を超える(2) ______________。(3)______________も長期利用の事業用資産である\n が、換金価値を有しないので固定資産には含めず、貸借対照表では区別して記載される。\n\n・企業が1 年を超えて利用するために保有している資産で、物理的な形態を持った項目を(4)\n ______________という。これには建物や機械装置のように、使用や時の経過により価値が減少す\n る(5) ______________、鉱山や山林のように採取によって数量的な減少が生じる\n (6)______________、土地や美術品のように通常は価値の減少が生じない\n (7)______________および建設中の固定資産を表す(8)______________が含まれる。", "answer": "(1)事業用資産\n(2)金融資産\n(3)繰延資産\n(4)有形固定資産\n(5)償却資産\n(6)減耗性資産\n(7)非償却資産\n(8)建設仮勘定", "topic": "有形固\n定資産", "chapter": 8}, {"no": 235, "page": 85, "type": "正答選\n択", "question": "有形固定資産には、償却資産の他に、\nア．減耗性資産\nイ．非償却資産\n ウ．建設仮勘定が含まれる。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "有形固\n定資産", "chapter": 8}, {"no": 236, "page": 86, "type": "穴埋め", "question": "物理的な形態をもたないが1 年を超える長期にわたって利用される資産項目を\n (1)______________という。無形固定資産には、特許権のような法律上の\n (2)______________、コンピュータの(3) ______________制作費、および収益性の高い他\n 企業の買収に伴って計上される(4)______________（営業権）が含まれる。", "answer": "(1)無形固定資産\n(2)権利\n(3)ソフトウェア\n(4)のれん", "topic": "無形固\n定資産", "chapter": 8}, {"no": 237, "page": 86, "type": "穴埋め", "question": "投資その他の資産には次のような項目が含まれる。\n株式・公社債のうち、売買目的の有価証券と(1)＿＿＿＿＿＿＿＿＿＿年内に満期の到来する債\n 券を除いた長期保有のもの\n預金・貸付金のうち、決算日から(2)＿＿＿＿＿＿＿＿＿＿年を超えて満期または返済期限が到来\n するもの\n破産債権・更生債権で、決算日から(3)＿＿＿＿＿＿＿＿＿＿年以内に回収されないもの\n一定の契約に従い継続してサービスの提供を受ける場合の代金の前払分で、決算日から1 年を超えて\n 取崩されるもの、すなわち(4)＿＿＿＿＿＿＿＿＿＿\n賃貸収益や時価変動による利益の獲得を目的として保有されている土地・建物などの不動産、すなわ\n ち(5)＿＿＿＿＿＿＿＿＿＿", "answer": "(1)1\n(2)1\n(3)1\n(4)長期前払費用\n(5)賃貸等不動産", "topic": "投資そ\nの他の\n資産", "chapter": 8}, {"no": 238, "page": 86, "type": "正答選\n択", "question": "固定資産の区分の１つである投資その他の資産には、\n（Ａ）賃貸等不動産\n （Ｂ）破産債権・更生債権で、決算日から１年以内に回収されないもの\n （Ｃ）長期前払費用の項目が含まれる。\n （Ｄ）全て誤り", "answer": "A,B,C\n・覚える", "topic": "投資そ\nの他の\n資産", "chapter": 8}, {"no": 239, "page": 86, "type": "正答選\n択", "question": "固定資産の区分の１つである投資その他の資産には、\n ア．預金・貸付金のうち、決算日から１年を超えて満期または返済期限が到来するもの\nイ．長期前払費用\n ウ．非償却資産の項目が含まれる。\n エ．すべて誤り", "answer": "ア,イ\n・土地など（非償却資\n産）は一般に有形固\n定資産区分に計上", "topic": "投資そ\nの他の\n資産", "chapter": 8}, {"no": 240, "page": 87, "type": "穴埋め", "question": "・購入した固定資産の取得原価は、購入代価に(1)＿＿＿＿＿＿＿＿＿＿を加算して決定する。そ\n の付随費用には、（a）引取運賃・買入手数料・関税など、企業外部で発生するものと、（b）据付\n 費・試運転費など、資産を(2)＿＿＿＿＿＿＿＿＿＿な状態にするまでに企業内部で発生するもの\n がある。付随費用は原則としてすべて取得原価に含められるが、(3)＿＿＿＿ よび\n （c）受入資産の時価の3 通りが考えられる。このうち、取得した資産はそれが有する用役潜在価値\n に基づいて評価するという基本的考え方と最も首尾一貫するのは、（c）の評価基準である。", "answer": "C\n・高い方→高い信頼性\n をもって測定が可能な\n方", "topic": "取得方\n法別の\n取得原\n価", "chapter": 8}, {"no": 243, "page": 89, "type": "穴埋め", "question": "国や地方自治体からの補助金のうち、固定資産の購入に充当するなど、資本助成の目的で交付を受\n けたものを(1)＿＿＿＿＿＿＿＿＿＿という。営業上の赤字を補填するための補助金と区別するた\n め、とくに(2)＿＿＿＿＿＿＿＿＿＿とよばれることもある。(3)＿＿＿＿＿＿＿＿＿＿は、電力やガ\n スなどの公益事業が、サービス供給の設備の新規建設に要する工事費用を消費者に負担してもらう形\n で受入れた金銭や資材の額である。これらの会計処理について、受入れた補助金等の額だけ、固定資\n 産の取得原価から減額する(4)＿＿＿＿＿＿＿＿＿＿方式または受入れた補助金等と同額の任\n 意積立金を、利益剰余金の処分において設定する(5)＿＿＿＿＿＿＿＿＿＿方式がある。積立金\n 方式は、受入額をいったん(6)＿＿＿＿＿＿＿＿＿＿としたうえで、徐々に取崩して利益に算入する\n ことを規定する国際会計基準の処理と同様の効果を持つ。", "answer": "(1)国庫補助金\n(2)建設助成金\n(3)工事負担金\n(4)圧縮記帳\n(5)積立金\n(6)繰延利益", "topic": "国庫補\n助金等\nで取得\nした資\n産", "chapter": 8}, {"no": 244, "page": 89, "type": "穴埋め", "question": "有形固定資産に関して行われる支出には、当該固定資産の原価に算入されて資産となる(1)＿＿＿\n ＿＿＿＿＿＿＿支出と固定資産の原価とせず、支出年度の費用として取扱われる(2)＿＿＿＿＿\n ＿＿＿＿＿支出がある。", "answer": "(1)資本的\n(2)収益的", "topic": "資本的\n支出と\n収益的\n支出", "chapter": 8}, {"no": 245, "page": 89, "type": "穴埋め", "question": "有形固定資産の価値は使用可能期間が経過した時点でわずかな評価額まで低下している。この使用\n 可能期間を(1)＿＿＿＿＿＿＿＿＿＿、評価額を(2)＿＿＿＿＿＿＿＿＿＿という。したがって有\n 形固定資産の取得原価は、その資産の利用を通じて達成された各年度の売上収益と対応づけるため\n に、各年度にわたって費用として配分されなければならない。これに伴い、資産の貸借対照表価額が同\n 額だけ減少する。この会計手続きを(3)＿＿＿＿＿＿＿＿＿＿という。減価償却から生じる資金増\n 加を、(4)＿＿＿＿＿＿＿＿＿＿という。", "answer": "(1)耐用年数\n(2)残存価額\n(3)減価償却\n(4)自己金融作用", "topic": "原価配\n分として\nの減価\n償却", "chapter": 8}, {"no": 246, "page": 89, "type": "穴埋め", "question": "減価償却費の計算を行うには、(1)＿＿＿＿＿＿＿＿＿＿、(2)＿＿＿＿＿＿＿＿＿＿、耐用年\n 数や利用度のような(3)＿＿＿＿＿＿＿＿＿＿、および(4)＿＿＿＿＿＿＿＿＿＿の４つが具体\n 的に特定されなければならない。税務当局は、課税の公平のために財務省令「減価償却資産の耐用\n 年数等に関する省令」において、税務計算で用いるべき(5)＿＿＿＿＿＿＿＿＿＿を資産の種類と\n 用途別に規定している。企業はこれと異なる個別的耐用年数を独自に決定してもよいが、それが法定\n 年数と異なれば(6)＿＿＿＿＿＿＿＿＿＿が必要となるため、多くの企業は税務上の法定耐用年\n 数を財務会計でも利用している", "answer": "(1)取得原価\n(2)残存価額\n(3)原価配分基準\n(4)減価償却方法\n(5)法定耐用年数\n(6)税効果会計", "topic": "減価償\n却費の\n計算要\n素", "chapter": 8}, {"no": 247, "page": 90, "type": "誤答選\n択", "question": "（Ａ）減価償却費の計算を行うには、①取得原価、②残存価額、③耐用年数や利用度のような原\n 価配分基準、および④減価償却方法の４つが具体的に特定されなければならない。\n（Ｂ）有形固定資産の減価償却について、当初見積った耐用年数や残存価額を変更すべきことが事\n 後的に判明した場合、当初の見積りが合理的に行われていた限り過年度の償却計算を修正すること\n なく変更の影響を変更後の会計期間の減価償却計算に吸収させるプロスペクティブ方式で会計処理\n を行わなければならない。\n（Ｃ）税務当局は、課税の公平のために財務省令「減価償却資産の耐用年数等に関する省令」にお\n いて、税務計算で用いるべき法定耐用年数を資産の種類と用途別に規定している。財務会計上にお\n いても、この税務計算上の法定耐用年数と異なれば税効果会計が必要となるため、「税効果会計に\n 係る会計基準」において、税務上の法定耐用年数に合わせることが求められている。\n（Ｄ）減価償却費の計算には、耐用年数を配分基準とする方法に定額法、定率法、級数法があり、\n 利用度を配分基準とする方法に生産高比例法がある。このうち企業が実際に採用した減価償却方法\n は、重要な会計方針の一つとして財務諸表に注記しなければならない。", "answer": "C\n・異なる個別的耐用年\n 数を独自に決定しても\n よい", "topic": "減価償\n却費の\n計算要\n素", "chapter": 8}, {"no": 248, "page": 91, "type": "穴埋め", "question": "・減価償却費の計算には、(1)＿＿＿＿＿＿＿＿＿＿を配分基準とする方法に定額法、定率法、級\n 数法があり、(2)＿＿＿＿＿＿＿＿＿＿を配分基準とする方法に生産高比例法がある。このうち企\n 業が実際に採用した減価償却方法は、重要な会計方針の一つとして財務諸表に(3)＿＿＿＿＿＿\n ＿＿＿＿しなければならない。\n・(4)＿＿＿＿＿＿＿＿＿＿では、資産の耐用年数にわたり、毎期一定の金額ずつの減価償却を行\n う方法である。ある時点において、それまで減価償却が行われた合計金額を(5)＿＿＿＿＿＿＿＿\n ＿＿といい、これを取得原価から控除した残額は、いまだ減価償却が行われていない部分という意味で\n (6)＿＿＿＿＿＿＿＿＿＿という。\n・(7)＿＿＿＿＿＿＿＿＿＿は加速償却法の一種である。\n・同種の資産が多数集まって１つの機能を果たす資産群を構成し、老朽品の部分的な取替を繰返すこ\n とにより、全体の機能が維持されるものがありそのような資産を(8)＿＿＿＿＿＿＿＿＿＿という。取\n 替資産の原価配分には(9)＿＿＿＿＿＿＿＿＿＿を採用することができる。また、取替法に類似し\n た方法として(10)＿＿＿＿＿＿＿＿＿＿がある。取替法はが棚卸資産の原価配分における(11)＿\n ＿＿＿＿＿＿＿＿＿に相当するのに対し、廃棄法は(12)＿＿＿＿＿＿＿＿＿＿に類似した原価\n 配分法であるといえる。", "answer": "(1)耐用年数\n(2)利用度\n(3)注記\n(4)定額法\n(5)減価償却累計額\n(6)未償却残高\n(7)定率法\n(8)取替資産\n(9)取替法\n(10)廃棄法\n(11)後入先出法\n(12)先入先出法", "topic": "減価償\n却費の\n計算方\n法", "chapter": 8}, {"no": 249, "page": 92, "type": "誤答選\n択", "question": "（Ａ）現物出資として受け入れた有形固定資産については、受入資産の公正な評価額と、出資者に\n 対価として交付した株式の公正な評価額のうち、より高い信頼性をもって測定が可能な方の金額を取\n 得原価とする。\n（Ｂ）同種・同用途の資産の交換であれば「連続意見書第三」に記載のとおり、自己所有の有形固\n 定資産と交換に有形固定資産を取得した場合には、譲渡資産の適正な簿価をもって取得原価とす\n る。\n（Ｃ）無形固定資産には、特許権のような法律上の権利、コンピュータのソフトウェア制作費、および収\n 益性の高い他企業の買収に伴って計上されるのれん（営業権）が含まれる。\n（Ｄ）有形固定資産のうち、鉄道会社のレールや枕木等のような同種の資産が多数集まって１つの機\n 能を果たす資産群を構成する、いわゆる「取替資産」では、資産の原価配分において取替法を採用す\n ることができる。この取替法は、棚卸資産の原価配分における先入先出法に相当する原価配分法で\n あるといえる。", "answer": "D\n・先入先出法→後入先\n出法", "topic": "減価償\n却費の\n計算方\n法", "chapter": 8}, {"no": 250, "page": 92, n 分する。いったん減損処理を実施した減価償却資産は、減損処理の実施後に\n (6)______________が回復しても、減損損失の戻し入れは行わない。", "answer": "(1)回収可能価額\n(2)減損損失\n(3)正味売却価額\n(4)使用価値\n(5)のれん\n(6)回収可能価額", "topic": "減損損\n失の計\n上", "chapter": 8}, {"no": 256, "page": 94, "type": "誤答選\n択", "question": "（Ａ）固定資産の収益性の低下により、投資額の完全な回収が見込めなくなった状態を減損といい、\n 固定資産からの回収可能価額の低下を反映させるように、帳簿価額を減額する減損処理を行わなけ\n ればならない。\n（Ｂ）減損の兆候がある場合は、当該資産から生み出される割引後の将来キャッシュ・フローの合計額\n を見積もり、その額が帳簿価額を下回る場合には減損損失を認識する。\n（Ｃ）減損損失の測定に使用される回収可能価額は、正味売却価額と使用価値のうち、いずれか大\n きい方である。\n（Ｄ）いったん減損処理を実施した減価償却資産は、減損処理の実施後に回収可能価額が回復し\n ても、減損損失の戻し入れは行わない。", "answer": "B\n・割引後→割引前", "topic": "減損損\n失の計\n上", "chapter": 8}, {"no": 257, "page": 94, "type": "誤答選\n択", "question": "（Ａ）固定資産の収益性の低下により、投資額の完全な回収が見込めなくなった状態を減損といい、\n そのような状態が生じた場合は、固定資産からの回収可能価額の低下を反映させるように、帳簿価額\n を減額する減損処理を行わなければならない。\n（Ｂ）減損損失の認識が必要な資産については、その帳簿価額を回収可能価額まで減額して、減額\n 分を減損損失として当期の特別損失に計上する。\n（Ｃ）複数の資産から構成されている資産グループについて認識された減損損失の金額は、構成資産\n の帳簿価額などの合理的な基準によって配分するが、資産グループにのれんが含まれているときは、減\n 損損失はのれんに優先的に配分する。\n（Ｄ）固定資産の回収可能価額は、売却による回収額としての正味売却価額と、継続使用による回\n 収額としての使用価値のいずれか低い方である。", "answer": "D\n・低い→高い", "topic": "減損損\n失の計\n上", "chapter": 8}, {"no": 258, "page": 94, "type": "穴埋め", "question": "固定資産の減損会計は、帳簿価額を減額するものであるが、土地については逆に、過去において帳簿\n 価額の増額が例外的に許容されたことがある。(1)______________に基づく事業用の土地の時\n 価評価がそれである。(2)______________は貸借対照表の純資産の部で、評価・換算差額等\n の1 項目として区分掲記しなければならない。", "answer": "(1)土地再評価法\n(2)土地再評価差額金", "topic": "土地の\n再評価", "chapter": 8}, {"no": 259, "page": 95, "type": "穴埋め", "question": "棚卸資産に分類されている以外のもので、賃貸収益や時価変動による利益の獲得を目的として保有さ\n れている不動産を(1)______________という。", "answer": "(1)賃貸等不動産", "topic": "賃貸等\n不動産\nの時価\n情報", "chapter": 8}, {"no": 260, "page": 95, "type": "穴埋め", "question": "ある特定の物件の所有者たる貸手と、その物件の借り手との間で締結された契約に基づいて行われる、\n 当該物件の貸借の取引を(1)______________という。リース取引のうちリース契約の中途解約が\n 契約上または事実上において不可能であり、かつリース物件から生じる経済的利益と使用コストが実質\n 的に借手に帰属することとなるようなリース取引を(2)______________取引という。前者は\n (3)______________の条件、後者は(4)______________の条件とよばれる。これらの条件\n をみたさないものは(5)______________取引に分類される。法的形式よりも経済的実質を重視\n する(6)______________の原則からすれば、ファイナンス・リース取引は所有権移転の有無にかか\n わらず、賃貸借取引としてではなく(7)______________取引として処理しなければならない。", "answer": "(1)リース取引\n(2)ファイナンス・リース\n(3)解約不能\n(4)フルペイアウト\n(5)オペレーティング・リー\n ス\n(6)実質優先\n(7)売買", "topic": "リース取\n引と実\n質優先\nの原則", "chapter": 8}, {"no": 261, "page": 95, "type": "穴埋め", "question": "借手が有形固定資産として計上したリース資産については、通常の購入や自家建設で取得したものと\n 同様に、決算ごとに(1)______________が行われる。またリース料の支払のつど、\n (2)______________の減少を記録する。ただし、支払リース料には、リース債務の元金返済部分\n と(3)______________の両方が含まれるから、これらを区別して仕訳を行う。利息相当額は\n (4)______________で計算するのが原則である。そのためには、リース料総額の割引現在価値を\n 負債計上額と等しくするような割引率として、(5)______________を算定しておかなければならな\n い。", "answer": "(1)減価償却\n(2)リース債務\n(3)利息相当額\n(4)利息法\n(5)実行利子率", "topic": "ファイナ\nンス・リ\nースの会\n計処理", "chapter": 8}, {"no": 262, "page": 96, "type": "誤答選\n択", "question": "（Ａ）リース取引にはファイナンス・リース取引とオペレーティング・リース取引がある。ファイナンス・リース取\n 引とは、リース契約の中途解約が契約上または事実上において不可能であり（解約不能の条件）、\n かつ、リース物件から生じる経済的利益と使用コストが実質的に借手に帰属することとなる（フルペイア\n ウトの条件）リース取引をいう。これらの条件を満たさないものはオペレーティング・リース取引に分類され\n る。\n（Ｂ）ファイナンス・リース取引は、法的形式よりも経済的実質を重視する実質優先の原則からすれ\n ば、通常、賃貸借取引としてではなく売買取引として処理される。なお、オペレーティング・リース取引に\n ついては、通常の賃貸借取引として会計処理を行うのが妥当である。\n（Ｃ）ファイナンス・リース取引における借手が有形固定資産として計上したリース資産については、通\n 常の購入や自家建設で取得したものと同様に、決算ごとに減価償却が行われる。またリース料の支払\n の都度、リース債務の減少を記録する。ただし、支払リース料には、リース債務の元金返済部分と利息\n 相当額の両方が含まれるから、これらを区別して仕訳を行う。利息相当額は定額法で計算するのが原\n 則である。\n（Ｄ）国際財務報告基準第１６号「リース」は、借手について「使用権モデル」とよばれる新しい考え\n 方に基づく会計処理を導入し、日本基準にも導入することが検討されている。現行の日本基準がファイ\n ナンス・リースの経済的実質を物件の取得と考えるのに対し、国際基準は資産を使用する権利の取得\n として解釈する。このため、国際基準における貸借対照表への資産計上額は、現行の日本基準のよう\n にリース物件の見積現金購入価額とリース料総額の割引現在価値を比較した低い方ではなく、もっぱ\n らリース料総額の割引現在価値によって測定される。", "answer": "C\n・定額法→利息法", "topic": "ファイナ\nンス・リ\nースの会\n計処理", "chapter": 8}, {"no": 263, "page": 96, "type": "穴埋め", "question": "国際財務報告基準第１６号「リース」は、借手について(1)______________とよばれる新しい考え\n 方に基づく会計処理を導入し、日本基準にも導入することが検討されている。現行の日本基準がファイ\n ナンス・リースの経済的実質を物件の取得と考えるのに対し、国際基準は資産を使用する権利の取得\n として解釈する。したがって借手はオペレーティング・リースも含めてリース期間の開始日にこの権利を\n (2)______________として計上する。", "answer": "(1)使用権モデル\n(2)使用権資産", "topic": "リース会\n計の新\nしい考え\n方", "chapter": 8}, {"no": 264, "page": 97, "type": "穴埋め", "question": "・事業用資産の中には、棚卸資産や有形固定資産のような物理的形態をもたないが、収益の獲得に\n 大きく貢献し、広く知的財産と総称されるような(1)______________がある。\n\n・貸借対照表に計上されることなく、投資者などが企業に関して主観的に価値を有すると判断するこのよ\n うな金額を総称して(2)______________という。", "answer": "(1)無形項目\n(2)主観のれん", "topic": "知的財\n産と研\n究開発", "chapter": 9}, {"no": 265, "page": 97, "type": "誤答選\n択", "question": "（Ａ）繰延資産は長期利用の事業用資産であるため、固定資産に含まれる。\n（Ｂ）購入した固定資産の取得原価は、購入代価に付随費用を加算して決定する。その付随費用\n には、引取運賃、買入季数料、関税など、企業外部で発生するものと、据付費、試運転費など資産\n を使用可能な状態にするまでに企業内部で発生するものがある。\n（Ｃ）特別償却の会計処理方法として、税法は、（a）通常の減価償却と同様の方式以外に、\n （b）引当金の形で特別償却準備金に繰入れる方式、および（c）利益剰余金の処分として特別\n 償却準備金を積立てる方式の3 通りを認めている。\n（Ｄ）法的形式よりも経済的実質を重視する会計における実質優先の原則からすれば、ファイナンス・\n リース取引は賃貸借取引としてではなく売買取引として処理しなければならない。", "answer": "A\n・換金価値を有しないの\n で固定資産には含め\n ない", "topic": "知的財\n産と研\n究開発", "chapter": 9}, {"no": 266, "page": 98, "type": "穴埋め", "question": "・物理的な形態をもたないが1 年を超える長期にわたって利用される資産項目を （1）\n ______________ という。各種の法律に基づく権利としての無形固定資産には次のような項目が\n 含まれる。\n （2）______________ や工業所有権と総称されるものとして （3）______________、\n （4）______________、（5）______________、（6）______________ がある。\n そのほかに （7）______________、（8）______________、（9）______________\n がある。\n\n・ソフトウェア製作費の会計処理として費用処理されるものには （10）______________ 目的の\n 制作費、販売目的における （11）______________ までの制作費、最初に製品化された製\n 品マスターの完成以後に発生する改良や強化のための費用のうち （12）______________ に\n 係るもの、ソフトウェアの （13）______________ に要した費用、自社利用目的における将来\n の （14）______________ や （15）______________ が不確実または不明な場合の\n 制作費や外注費がある。\n\n棚卸資産として計上されるものには （16）______________ の場合の制作費がある。無形固定\n 資産として計上されるものには、販売目的における最初に製品化された製品マスターの完成以後に発\n 生する改良や強化のための費用のうち （17）______________ に係るもの、自社利用目的に\n おける将来の収益獲得や費用削減が （18）______________ な場合の購入費や制作費が\n ある。", "answer": "(1)無形固定資産,\n(2)産業財産権,\n(3)特許権,\n(4)実用新案権,\n(5)意匠権,\n(6)商標権,\n(7)借地権,\n(8)鉱業権,\n(9)漁業権,\n(10)研究開発,\n(11)最初に製品化され\n た製品マスターの完成,\n(12)著しい改良,\n(13)機能の維持,\n(14)収益獲得,\n(15)費用削減,\n(16)受注制作,\n(17)通常の改良,\n(18)確実", "topic": "無形固\n定資産\nの種類", "chapter": 9}, {"no": 267, "page": 99, "type": "正答選\n択", "question": "ソフトウェア制作費は制作の目的と内容により、資産計上されるか、費用処理されるかの会計処理が異\n なる。以下に列挙したソフトウェア制作費のうち、無形固定資産として計上されるものは、\n （Ａ）市場販売目的の場合で、最初に製品化された製品マスターの完成までの制作費\n （Ｂ）市場販売目的の場合で、最初に製品化された製品マスターの完成以後に発生する、著しい改\n 良や強化のための費用\n （Ｃ）自社利用目的の場合で、将来の収益獲得や費用削減が確実な場合の購入費や制作費で\n ある。\n （Ｄ）全て誤り", "answer": "C\n・その他は費用処理", "topic": "無形固\n定資産\nの種類", "chapter": 9}, {"no": 268, "page": 99, "type": "正答選\n択", "question": "産業財産権には、\n ア．意匠権\n イ．鉱業権\n ウ．漁業権がある。\n エ．すべて誤り", "answer": "ア\n・産業財産権：特許\n 権、実用新案権、意\n 匠権、商標権", "topic": "無形固\n定資産\nの種類", "chapter": 9}, {"no": 269, "page": 99, "type": "正答選\n択", "question": "無形固定資産には\n ア．借地権\nイ．産業財産権\n ウ．営業権が含まれる。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "無形固\n定資産\nの種類", "chapter": 9}, {"no": 270, "page": 99, "type": "正答選\n択", "question": "販売目的のソフトウェアの制作に要した支出額のうち、棚卸資産や無形固定資産に計上すべきものに\n は、\n ア．受注制作の場合の制作費\n イ. 市場販売の場合の最初に製品化された製品マスターの完成までの制作費\n ウ．市場販売の場合のバグ取りなどのソフトウェアの機能の維持に要した費用が含まれる。\n エ.  すべて誤り", "answer": "ア\n・その他は費用処理され\n る", "topic": "無形固\n定資産\nの種類", "chapter": 9}, {"no": 271, "page": 100, "type": "正答選\n択", "question": "無形固定資産には、\n ア．創立費\n イ．破産債権・更生債権で、決算目から1 年以内に回収されないもの\n ウ．長期前払費用が含まれる。\n エ．すべて誤り", "answer": "エ\n・無形固定資産は物理\n 的な形態をもたないが\n 1 年を超える長期にわ\n たって利用される資産\n 項目である", "topic": "無形固\n定資産\nの種類", "chapter": 9}, {"no": 272, "page": 100, "type": "穴埋め", "question": "のれんの取得原価は買収や合併で交付した対価から継承した(1) ______________額を控除した\n 金額であるが、買収や合併で交付する対価を算出するために企業の自己資本の価値を評価する方法\n には、(2) ______________、(3)______________、(4)______________がある。資産\n 負債法は(5)______________アプローチともよばれる。(3)______________は\n (6)______________アプローチともよばれキャッシュ・フローを割引いた現在価値で評価する\n (7)______________法や自己資本と予想利益からの(8)______________モデルに基づいて\n 自己資本の価値を評価する方法はこのアプローチに属する。(4)______________は\n (9)______________アプローチともよばれる。", "answer": "(1)純資産\n(2)純資産法\n(3)収益還元法\n(4)株式時価法\n(5)コスト\n(6)インカム\n(7)DCF\n(8)残余利益\n(9)マーケット", "topic": "無形固\n定資産\nの取得\n原価", "chapter": 9}, {"no": 273, "page": 100, "type": "正答選\n択", "question": "のれんの取得原価は買収や合併で交付した対価から継承した純資産額を控除した金額であるが、買\n 収や合併で交付する対価を算出するために企業の自己資本の価値を評価する方法には、\nア．資産負債法\nイ．収益還元法\n ウ．株式時価法がある。\n エ．すべて誤り", "answer": "イ,ウ\n・資産負債法→純資産\n法", "topic": "無形固\n定資産\nの取得\n原価", "chapter": 9}, {"no": 274, "page": 100, "type": "穴埋め", "question": "「企業結合に関する会計基準」（32 項）は、のれんとして資産計上された金額を、\n (1)______________年以内のその効果が及ぶ期間にわたって、(2)______________その他\n の合理的な方法により規則的に償却するものとしている。", "answer": "(1)20\n(2)定額法", "topic": "無形固\n定資産\nの償却", "chapter": 9}, {"no": 275, "page": 101, "type": "穴埋め", "question": "すでに代価の支払いが完了するか支払義務が確定し、これに対応する役務の提供を受けたにもかかわら\n ず、その(1)______________が将来にわたって発現するものと期待されるため、その支出額を効果\n が及ぶ将来期間に費用として合理的に配分する目的で、経過的に貸借対照表に資産として計上され\n た項目を(2)______________という。\n(2)______________は(3)______________原則に基づき、当期の支出額を将来の収益に\n 対応させて適切な(4)______________を算定する目的で計上される資産項目である。\n(2)______________は(5)______________とか擬制資産とよばれることがある。", "answer": "(1)効果\n(2)繰延資産\n(3)対応\n(4)期間利益\n(5)会計的資産", "topic": "繰延資\n産の資\n産性", "chapter": 9}, {"no": 276, "page": 101, "type": "穴埋め", "question": "・実務対応報告第19 号「繰延資産の会計処理に関する当面の取扱い」において、繰延資産として限\n 定列挙されている項目には、新株発行費を含む(1) ______________、(2)\n ______________、(3) ______________、(4) ______________、\n (5)______________の5 項目だけである。企業は繰延資産について採用した処理方法を重要\n な会計方針の１つとして(6)______________しなければならない。", "answer": "(1)株式交付費\n(2)社債発行費等\n(3)創立費\n(4)開業費\n(5)開発費\n(6)注記", "topic": "繰延資\n産の範\n囲", "chapter": 9}, {"no": 277, "page": 101, "type": "正答選\n択", "question": "実務対応報告第19 号「繰延資産の会計処理に関する当面の取扱い」において、繰延資産として限\n 定列挙されている項目には、\n（Ａ）研究開発費\n（Ｂ）建設利息\n （Ｃ）公共的施設等の負担金が含まれる。\n （Ｄ）全て誤り", "answer": "D\n・限定列挙：株式交付\n 費、社債発行費、創\n 立費、開業費、開発\n費", "topic": "繰延資\n産の範\n囲", "chapter": 9}, {"no": 278, "page": 101, "type": "正答選\n択", "question": "企業会計基準委員会の実務対応報告第19 号「繰延資産の会計処理に関する当面の取扱い」にお\n いて繰延資産として取り扱っているものには、\nア．社債発行差金\nイ．試験研究費\n ウ．創立費がある。\n エ．すべて誤り", "answer": "ウ\n・限定列挙：株式交付\n 費、社債発行費、創\n 立費、開業費、開発\n費", "topic": "繰延資\n産の範\n囲", "chapter": 9}, {"no": 279, "page": 102, "type": "正答選\n択", "question": "企業会計基準委員会が公表した実務対応報告第19 号「繰延資産の会計処理に関する当面の取\n 扱い」で、繰延資産として限定列挙されているものには、\nア．研究開発費\nイ．株式交付費\n ウ．建設利息が含まれる。\n エ．すべて誤り", "answer": "イ\n・限定列挙：株式交付\n 費、社債発行費、創\n 立費、開業費、開発\n費", "topic": "繰延資\n産の範\n囲", "chapter": 9}, {"no": 280, "page": 102, "type": "穴埋め", "question": "株式による資金調達に関連して生じる費用であり、新株の発行と(1)______________の処分の両\n 方の場合の支出が含まれる費用として(2)______________がある。株式交付費には、株式募集\n のための広告費、目論見書の印刷費、資本金の変更登記の登録免許税などが含まれるが、会社設\n 立時に発行する株式に関する費用は(3)______________とされるので、株式交付費には該当し\n ない。株式交付費は財務活動の費用であるから、支出時に(4)______________費用として処理\n するのが原則であるが、(5)______________のための資金調達に関して生じた株式交付費は繰\n 延資産に計上することができる。合併や株式交換などの(6)______________の対価として行う株\n 式交付の費用も同様である。会社法は株式交付費を株主からの払込額と相殺し、残高を資本金およ\n び資本準備金とする会計処理を示唆しており、これは(7)______________の規定とも整合するも\n のである。しかしこの処理は株式払込剰余金と株式発行費用の相殺が(8)______________と\n (9)______________の混同であるとして、企業会計原則においては禁止されている。いったん繰延\n 資産に計上した株式交付費の償却額は(10)______________費用とする。", "answer": "(1)自己株式\n(2)株式交付費\n(3)創立費\n(4)営業外\n(5)企業規模拡大\n(6)組織再編\n(7)国際的な会計基準\n(8)資本取引\n(9)損益取引\n(10)営業外", "topic": "株式交\n付費", "chapter": 9}, {"no": 281, "page": 102, "type": "正答選\n択", "question": "（Ａ）株式交付費は、株式による資金調達に関連して生じる費用であり、新株の発行と自己株式の\n 処分の両方の場合の支出が含まれる。\n（Ｂ）株式払込剰余金と株式発行費用の相殺が、資本取引と損益取引の混同であるとして、これを\n 禁止する企業会計原則（注解２）の考え方は、国際的な会計基準の規定とも整合する。\n（Ｃ）株式交付費は、支出時に全額を販売費および一般管理費として処理するか、いったん繰延資\n 産としたうえで償却額を販売費および一般管理費とするのが適切である。\n（Ｄ）全て誤り", "answer": "A\n・B：企業会計原則で\n は禁止\n・C：販売費及び一般\n管理費→営業外費用", "topic": "株式交\n付費", "chapter": 9}, {"no": 282, "page": 103, "type": "誤答選\n択", "question": "（Ａ）合併や株式交換などの組織再編の対価として行う株式交付の費用は、企業規模の拡大のため\n の資金調達に関して生じた費用であっても繰延資産に計上することができない。\n（Ｂ）社債発行費を繰延資産に計上した場合は、社債の発行時から償還までの期間にわたり利息法\n により償却をしなければならないが、継続適用を条件として定額法で償却してもよい。\n（Ｃ）開業費を繰延資産に計上した場合は、開業のときから５年以内のその効果の及ぶ期間にわたっ\n て、定額法により償却しなければならない。\n（Ｄ）企業結合時における会計処理を除いて、研究開発費は発生時に費用として処理する。", "answer": "A\n・できる", "topic": "株式交\n付費", "chapter": 9}, {"no": 283, "page": 103, "type": "穴埋め", "question": "・(1)______________は、(2)______________と(3)______________の発行費から構\n 成される。新株予約権が付された社債を(4)______________で処理する場合は、その発行費用\n も新株予約権発行費ではなく、社債発行費として処理する。資産計上した場合は、社債の発行時か\n ら償還までの期間にわたり(5)______________により償却をしなければならないが、継続適用を条\n 件として(6)______________で償却してもよい。\n・新株予約権の発行費用についても資金調達などの(7)______________活動に関するものは、繰\n 延資産に計上することができる。資産計上された新株予約権発行費は、発行時から\n (8)______________年以内のその効果の及ぶ期間にわたって、(9)______________により\n 償却しなければならない。", "answer": "(1)社債発行費等\n(2)社債発行費\n(3)新株予約権\n(4)一括法\n(5)利息法\n(6)定額法\n(7)財務\n(8)3\n(9)定額法", "topic": "社債発\n行費等", "chapter": 9}, {"no": 284, "page": 103, "type": "誤答選\n択", "question": "（Ａ）株式交付費には、株式募集のための広告費、目論見書の印刷費、資本金の変更登記の登録\n 免許税などが含まれるが、会社設立時に発行する株式に関する費用は含まれない。\n（Ｂ）新株予約権の発行費用は、資金調達などの財務活動に関するものは、繰延資産に計上するこ\n とができる。資産計上された新株予約権発行費は、発行時から3 年以内のその効果の及ぶ期間にわ\n たって、利息法により償却しなければならないが、継続適用を条件として定額法で償却してもよい。\n（Ｃ）創立費および開業費は、支出時に営業外費用として処理するのが原則であるが、このうち開業\n 費は、販売費および一般管理費として費用処理してもよい。\n（Ｄ）研究開発費は費用処理が強制されるが、例外は、研究開発の途中段階にある未完成の成果\n を企業結合によって受け入れた場合の取扱である。そのような未完成の成果でも資産としての識別が\n 可能である限りこれを企業結合時の時価で評価して資産計上することになる", "answer": "B\n・定額法により償却", "topic": "社債発\n行費等", "chapter": 9}, {"no": 285, "page": 104, "type": "誤答選\n択", "question": "（Ａ）「企業結合に関する会計基準」（32 項）は、のれんとして資産計上された金額を、20 年以内\n のその効果が及ぶ期間にわたって、定額法その他の合理的な方法により規則的に償却するものとしてい\n る。\n（Ｂ）社債発行費を繰延資産に計上した場合は、社債の発行時から償還までの期間にわたり定率法\n により償却をしなければならないが、継続適用を条件として定額法で償却してもよい。\n（Ｃ）資産計上された開業費は、開業のときから５年以内のその効果の及ぶ期間にわたって、定額法\n により償却しなければならない。\n（Ｄ）資産計上された開発費は、支出のときから５年以内のその効果の及ぶ期間にわたって、定額法\n その他の合理的な方法により規則的に償却すべきこととされている。", "answer": "B\n・定率法→利息法", "topic": "社債発\n行費等", "chapter": 9}, {"no": 286, "page": 104, "type": "誤答選\n択", "question": "（Ａ）繰延資産とは、すでに代価の支払が完了するか支払義務が確定し、これに対応する役務の提\n 供を受けたにもかかわらず、その効果が将来にわたって発現するものと期待されるため、その支出額を効\n 果が及ぶ将来期間に費用として合理的に配分する目的で、経過的に貸借対照表に資産として計上さ\n れた項目をいう。\n（Ｂ）株式交付費は、株式による資金調達に関連して生じる費用であり、新株の発行と自己株式の\n 処分の両方の場合の支出が含まれ、株式の交付のために直接支出した費用をいう。\n（Ｃ）社債発行費等は、社債発行費と新株予約権の発行費から構成される。また、新株予約権付\n 杜債を一括法で処理する場合は、その発行費用は社債発行費ではなく新株予約権発行費として処\n 現する。\n（Ｄ）開発費とは、（a）新技術や新経営組織の採用、（b）資源の開発、（c）市場の開拓、\n （d）生産能率の向上や生産計画の変更のための設備の大規模な配置替えを行った場合等に支出\n した費用をいう。このうち特別に支出したものだけが開発費に該当し、経常費の性格をもつものは含ま\n れない。", "answer": "C\n・一括法の場合社債発\n 行費として処理", "topic": "社債発\n行費等", "chapter": 9}, {"no": 287, "page": 105, "type": "穴埋め", "question": "会社を設立するために要する支出であり、会社負担の設立費用、発起人への報酬、および設立登記の\n 登録税などから構成される費用を(1)______________という。会社が成立した後、営業を開始す\n るまでの間に、開業準備のために支出した費用を(2)______________という。\n (1)______________および(2)______________は、支出時に(3)______________費\n 用として処理するのが原則であるが。このうち(2)______________は、販売費および一般管理費と\n して処理してもよい。資産計上された(1)______________は会社の成立のときから\n (4)______________年以内のその効果の及ぶ期間にわたって、(5)______________により\n (6)______________費用として償却する。また(2)______________は開業のときから\n (7)______________年以内のその効果の及ぶ期間にわたって、(8)______________により\n 営業外費用または(9)______________として、償却する。", "answer": "(1)創立費\n(2)開業費\n(3)営業外\n(4)5 年\n(5)定額法\n(6)営業外\n(7)5 年\n(8)定額法\n(9)販売費及び一般管\n理費", "topic": "創立費\nと開業\n費", "chapter": 9}, {"no": 288, "page": 105, "type": "誤答選\n択", "question": "（Ａ）企業は繰延資産について採用した処理方法を重要な会計方針の１つとして注記しなければな\n らない。\n（Ｂ）繰延資産に計上した新株予約権発行費は発行時から3 年以内のその効果の及ぶ期間にわた\n って、定額法により償却しなければならない。\n（Ｃ）繰延資産に計上した開業費は開業のときから5 年以内のその効果の及ぶ期間にわたって、定\n 額法により営業外費用として、償却しなければならない。\n（Ｄ）繰延資産に計上した開発費は、支出のときから5 年以内のその効果の及ぶ期間にわたって、定\n 額法その他の合理的な方法により売上原価または販売費および一般管理費として、償却すべきことと\n されている。また、支出の効果が期待されなくなった開発費は、未償却残高を一時に償却しなければな\n らない。", "answer": "C\n・開業費は販売費およ\n び一般管理費として処\n 理してもよい", "topic": "創立費\nと開業\n費", "chapter": 9}, {"no": 289, "page": 106, "type": "誤答選\n択", "question": "（Ａ）株式交付費は、株式による資金調達に関連して生じる費用であり、新株の発行と自己株式の\n 処分の両方の場合の支出が含まれる。\n（Ｂ）社債発行費等は、社債発行費と新株予約権の発行費から構成される。新株予約権が付され\n た社債を一括法で処理する場合は、その発行費用も新株予約権発行費ではなく、社債発行費として\n 処理する。\n（Ｃ）開業費とは、会社を設立するために要する支出であり、会社負担の設立費用、発起人への報\n 酬、および設立登記の登録税などから構成される。\n（Ｄ）開発費とは、新技術や新経営組織の採用、資源の開発、市場の開拓等に支出した費用のう\n ち、特別に支出したものだけであり、経常費の性格をもつものは、開発費には含まれない。", "answer": "C\n・創立費の説明である", "topic": "創立費\nと開業\n費", "chapter": 9}, {"no": 290, "page": 106, "type": "正答選\n択", "question": "開業費は、\nア．会社負担の設立費用\n イ．発起人への報酬\n ウ．設立登記の登録税などから構成される。\n エ．すべて誤り", "answer": "エ\n・創立費の説明である", "topic": "創立費\nと開業\n費", "chapter": 9}, {"no": 291, "page": 106, "type": "穴埋め", "question": "・(1)______________とは、新技術や新経営組織の採用、資源の開発、市場の開拓等に支出し\n た費用のうち、特別に支出したものだけであり、(2)______________の性格をもつものは、\n (1)______________には含まれない。繰延資産に計上した(1)______________は、支出の\n ときから(3)______________年以内のその効果の及ぶ期間にわたって、(4)______________\n その他の合理的な方法により(5)______________または販売費および一般管理費として
