><button class="mode" data-mode="wrong">間違えた問題</button><button class="mode" data-mode="star">お気に入り</button></div><div id="count"></div><section class="card" id="card"><div class="meta"><span id="number"></span><span id="topic"></span></div><div class="question" id="question"></div><div class="answer" id="answer" hidden><b>解答・解説（原文）</b><div class="body" id="answerText"></div></div><button id="reveal" class="primary">解答を見る</button><div class="actions" id="actions" hidden><button class="wrong" id="markWrong">× 覚えていない</button><button class="right" id="markRight">✓ 覚えた</button></div><div class="nav"><button id="prev">← 前へ</button><button id="star">☆ お気に入り</button><button id="next">次へ →</button></div></section></div><section id="tocPanel" hidden><p class="tap-hint">問題をタップすると、その問題に移動します。</p><div id="tocList" class="toc-list"></div></section><div class="foot">学習履歴・お気に入りはこのブラウザ内に保存されます。PDFの問題・解答を抽出して収録しています。法令・会計基準は教材作成時点の内容を含むため、最新の試験範囲と照合してください。<div class="small"><button id="installApp" style="background:#2563eb;color:white" hidden>ホーム画面にインストール</button> <button id="export" style="background:#e2e8f0">学習記録を保存（JSON）</button> <button id="import" style="background:#e2e8f0">学習記録を復元</button><input id="file" type="file" accept="application/json" hidden></div></div></main><script>
const DATA=[{"no": 1, "page": 3, "type": "穴埋め", "question": "・ある特定の経済主体の経済活動を、貨幣額などを用いて計数的に測定し、その結果を報告書にまと\n めて利害関係者に伝達するためのシステムを(1)____________という。\n・経済活動の測定および結果の伝達から成る会計システムと、伝達によって生じる経済的な影響を、そ\n の研究対象とする学問を(2)____________という。", "answer": "(1)会計\n(2)会計学", "topic": "会計の\n意義", "chapter": 1}, {"no": 2, "page": 3, "type": "穴埋め", "question": "会計が測定対象とする経済活動の担い手である経済主体は、その主たる目的が利潤追求であるか否\n かにより、営利組織と非営利組織に分けることができる。前者の営利組織の経済活動を対象とする会\n 計を(1)____________会計といい、後者の非営利組織について行われる会計が\n (2)____________会計である。(1)____________会計の領域はさらに(3)____________\n 会計と(4)____________会計に分けられる。(3)____________会計は、最高経営者を頂点\n とする企業内部の各階層の経営管理者のために、企業の経済活動を測定し伝達する会計である。こ\n れとは対照的に、(4)____________会計は企業外部の利害関係者を会計報告書の受け手とし\n て行う会計である。", "answer": "(1)企業\n(2)非営利\n(3)管理\n(4)財務", "topic": "会計の\n領域", "chapter": 1}, {"no": 3, "page": 3, "type": "穴埋め", "question": "会計が測定対象とする経済活動の担い手である経済主体は、その主たる目的が利潤追求であるか否\n かにより、営利組織と非営利組織に分けることができる。前者の営利組織の経済活動を対象とする会\n 計を(1)______________会計といい、後者の非営利組織について行われる会計が\n (2)______________会計である。(1)______________会計の領域はさらに\n (3)______________会計と(4)______________会計に分けられる。\n (3)______________会計は、最高経営者を頂点とする企業内部の各階層の経営管理者のため\n に、企業の経済活動を測定し伝達する会計である。これとは対照的に、(4)______________会\n 計は企業外部の利害関係者を会計報告書の受け手として行う会計である。", "answer": "(1)企業\n(2)非営利\n(3)管理\n(4)財務", "topic": "会計の\n領域", "chapter": 1}, {"no": 4, "page": 4, "type": "穴埋め", "question": "・現代の企業は多様な(1)______________との利害関係を伴いつつ経済活動を営んでいる。その\n ような利害関係者には、出資者、債権者、従業員、仕入先・顧客等の取引先、政府機関などがあ\n る。これらの人々は、自己の利益を守り、適切な経済的意思決定を行うために、企業の動向に強い関\n 心を有し、企業に関する情報を必要としている。\n・企業が経済活動に必要な資金を、銀行借入金などの形で債権者から調達した部分（負債）と出資\n 者から拠出を受けた部分（資本）に分けて示すとともに、それらの資金が経済活動のために商品・原\n 材料・生産設備・土地などの項目（資産）に投下されている状態を対比して表した一覧表を\n (2)______________という。企業が保有する資産を利用して経済活動を行なった結果、その成果\n として得られた売上高などの収益と、それを獲得するために費やされた売上原価・販売費・支払利息な\n どの費用を対比することにより、その差額として純利益を明らかにする書面を(3)______________と\n いう。企業が外部の利害関係者に伝達する会計の報告書は、主としてこれら2 つの書面から構成され\n るとともに、必要に応じて別の書面が追加される。追加された書類もあわせて、一組の会計報告書は\n (4)______________と名づけられている。", "answer": "(1)利害関係者\n(2)貸借対照表\n(3)損益計算書\n(4)財務諸表", "topic": "財務諸\n表", "chapter": 1}, {"no": 5, "page": 4, "type": "穴埋め", "question": "・企業の所有権を分割して株式とし、その販売によって企業が資金調達を行うとともに、株式を購入して\n 株主になった者に対して、企業活動からの利益を分配するという方式を採用する制度を\n (1)______________という。万一、事業が失敗して企業が倒産した場合でも自己の出資額を放\n 棄するだけで足り、個人財産を拠出してまで会社の債務を弁済する必要がないという\n (2)______________が採用されたため、出資者に一定の安心感を与えるものであった。\n・経営者・株主・債権者の間の利害関係を調整する1 つの手段が、財務会計の利益計算とその報告\n を利用する方法である。この点で財務会計が果たす役割を(3)______________という。", "answer": "(1)株式会社,\n(2)有限責任制度\n(3)利害調整機能", "topic": "株式会\n社制度\nの特徴", "chapter": 1}, {"no": 6, "page": 5, "type": "穴埋め", "question": "・株主と経営者は資金の委託者と受託者の関係にある。この関係を(1)______________という。こ\n の関係において、経営者は受託者であるから株主から委託された資金を誠実に管理するだけでなく、株\n 主の最大利益に合致するよう自己の全能力を投入して経営活動を行うべき責任を負うことになる。こ\n の責任は一般に(2)______________とよばれている。\n・株主は経営者による資金管理の誠実性と事業遂行能力に注目しており、その判断のための基礎とし\n て会計報告を要求することになる。経営者が株主に対してこのような会計報告を行うべき責任を\n (3)______________という。", "answer": "(1)エイジェンシー関係\n(2)受託責任\n(3)会計責任", "topic": "私的利\n害の調\n整機能", "chapter": 1}, {"no": 7, "page": 5, "type": "穴埋め", "question": "・投資者に対して、証券投資の意思決定に役立つ情報を提供して彼らを保護することにより、証券市場\n がその機能を円滑に遂行できるようにするという役割を(1)______________という。\n・証券投資を行う株主や債権者は既存か潜在的かにかかわらず、一括して(2)______________と\n よばれる。\n・企業が資金調達のために証券を投資者に販売する市場は(3)______________であり、ひとたび\n 発行された証券が投資者間で売買される市場は(4)______________である。", "answer": "(1)情報提供機能\n(2)投資者\n(3)発行市場\n(4)流通市場", "topic": "証券市\n場への\n情報提\n供機能", "chapter": 1}, {"no": 8, "page": 5, "type": "穴埋め", "question": "企業が行う財務会計には、法律の規制に従って行われる会計とそれ以外の会計が存在する。法律制\n 度の一環として法規制に準拠して行われる会計を、とくに(1) ______________という。他方、(1)\n ______________以外の財務会計は、法規制を受けずに企業が自発的に実施する会計領域で\n ある。たとえば、インフレーションが業績に及ぼした影響を計測する物価変動会計や持続可能な社会の\n 形成のために企業が配慮すべき(2) ______________、(3)______________、\n (4)______________の課題の達成度を計測したESG 情報がそれである。これらは企業が経営\n 管理の必要から実施することもあれば、法律の枠組みを超えた積極的な情報提供を通じて利害関係\n 者との良好な関係を樹立する目的で行われることも多い。このうち、とくに企業資本の提供者たる投資\n 者を対象にして企業が行う財務広報活動は、(5)______________とよばれている。", "answer": "(1)制度会計\n(2)自然環境保護\n(3)社会的責任\n(4)企業統治\n(5)インベスター・リレーシ\n ョンズ", "topic": "制度会\n計", "chapter": 1}, {"no": 9, "page": 6, "type": "正答選\n択", "question": "投資家は、中長期的な視点で企業価値を評価する際にＥＳＧ情報を考慮することがある。このＥＳ\n Ｇは\n （Ａ）Ｅ：倫理（ethics）\n （Ｂ）Ｓ：持続可能性（sustainability）\n （Ｃ）Ｇ：目標（goal）の頭文字をとったものである。\n （Ｄ）全て誤り", "answer": "D\nE：Environment\n（環境）\nS：Social（社会）\nG：Governance（ガ\n バナンス）", "topic": "制度会\n計", "chapter": 1}, {"no": 10, "page": 6, "type": "正答選\n択", "question": "制度会計以外の財務会計のひとつであるＥＳＧ情報とは、持続可能な社会の形成のために企業が配\n 慮すべき\n （Ａ）経済（economy）\n （Ｂ）持続可能性（sustainability）\n （Ｃ）企業統治（governance）の課題の達成度を計測した情報である。\n （Ｄ）全て誤り", "answer": "C\nE：Environment\n（環境）\nS：Social（社会）\nG：Governance（ガ\n バナンス）", "topic": "制度会\n計", "chapter": 1}, {"no": 11, "page": 6, "type": "穴埋め", "question": "企業が行う財務会計には、法律の規制に従って行われる会計とそれ以外の会計が存在し、法律制度の\n 一環として法規制に準拠して行われる会計を、とくに(1)______________という。", "answer": "(1)制度会計", "topic": "制度会\n計", "chapter": 1}, {"no": 12, "page": 6, "type": "穴埋め", "question": "財務会計のうち、法律制度の一環として、法規制に準拠して行われる会計を、とくに\n (1)______________会計という。他方、(1)______________会計以外の財務会計は、法\n 規制を受けずに企業が自発的に実施する会計領域である。会計領域は企業が経営管理の必要から\n 実施することもあれば、法律の枠組みを超えた積極的な情報提供を通じて利害関係者との良好な関\n 係を樹立する目的で行われることもある。このうち、とくに企業資本の提供者たる投資者を対象にして企\n 業が行う財務広報活動は、(2)______________とよばれている。", "answer": "(1)制度\n(2)IR", "topic": "制度会\n計", "chapter": 1}, {"no": 13, "page": 6, "type": "穴埋め", "question": "会社法は、(1)______________の1 つとして、企業をめぐる個々の経済主体の相互間の利益の\n 調整を目的として制定されている。したがって財務会計のもつ利害調整機能、すなわち経営者・従業\n 員・株主の間に存在する利害対立関係の調整は、主として会社法による会計を通じて遂行される。", "answer": "(1)私法", "topic": "会社法\nによる会\n計", "chapter": 1}, {"no": 14, "page": 7, "type": "誤答選\n択", "question": "（Ａ）会社法は、公法の1 つとして、企業をめぐる個々の経済主体の相互間の利益の調整を目的とし\n て制定されている。したがって財務会計のもつ利害調整機能、すなわち経営者・従業員・株主の間に\n 存在する利害対立関係の調整は、主として会社法による会計を通じて遂行される。\n （Ｂ）法律制度の一環として、法規制に準拠して行われる会計を、とくに制度会計という。他方、制\n 度会計以外の財務会計は、法規制を受けずに企業が自発的に実施する会計領域である。このうち、\n とくに企業資本の提供者たる投資者を対象にして企業が行う財務広報活動は、インベスター・リレーショ\n ンズと呼ばれている。\n （Ｃ）株式会社のうち非公開会社とは、発行するすべての種類の株式について、他人への譲渡に先\n 立って会社の承認を要するという制限を課している会社であり、株式譲渡制限会社とも呼ばれる。\n （Ｄ）委員会設置会社は、社外取締役を過半数とする3 人以上の取締役で構成する監査・指名・\n 報酬の3 つの委員会を取締役会の内部に設け、監査役を廃止する。会社の業務執行は、執行役お\n よび代表執行役を選任して担当させ、取締役会は執行役を監督する機能に集中する。", "answer": "A\n公法→私法", "topic": "会社法\nによる会\n計", "chapter": 1}, {"no": 15, "page": 8, "type": "穴埋め", "question": "・発行するすべての種類の株式について、他人への譲渡に先立って会社の承認を要するという制限を課\n している会社は(1)______________であり、(2)______________ともよばれる。そのような譲\n 渡制限を課さない株式を少なくとも一種類以上発行している会社が(3)______________である。\n また株式会社は資本金と負債の金額により、(4)______________とその他の中小会社に分けら\n れる。会社法で定義される大会社とは、資本金として計上した額が(5)______________億円以\n 上、または負債の部に計上した額の合計額が(6)______________億円以上の会社をいう。\n・監査役会設置会社では、株主総会で選任された取締役により(7)______________が構成さ\n れ、そこで選任された代表取締役が会社を代表して業務を執行する。株主総会で選任された監査役\n で構成される(8)______________も、取締役および代表取締役の業務執行を監査する。このほ\n か大会社では、監査役会の監査以外、(9)______________による会計監査を受けることが義務\n づけられている。他方指名委員会等設置会社は社外取締役を過半数とする\n (10)______________人以上の取締役で構成する監査・指名・報酬の3 つの委員会を取締役\n 会の内部に設け、監査役を廃止する。会社の業務執行は、(11)______________および代表執\n 行役を選任して担当させ、取締役会は執行役を監督する機能に集中する。\n (12)______________は取締役と執行役の職務の監査と、会計監査人の選任を行う。また\n 2015 年から採用可能となった(13)______________は、３つの委員会のうち監査に関する委員\n 会だけが取締役会の内部に設置され、この委員会が取締役と代表取締役の職務の監査、および\n (14)______________の選任を行う。\n・会社法上の会計報告書は(15) ______________とよばれており、その作成と報告に際しては、会\n 社法の関連条文のほか、そのもとで制定された(16) ______________、\n (17)______________および(18)______________という3 つの法務省令にも準拠しなけれ\n ばならない。", "answer": "(1)非公開会社\n(2)株式譲渡制限会社\n(3)公開会社\n(4)大会社\n(5)5\n(6)200\n(7)取締役会\n(8)監査役会\n(9)会計監査人\n(10)3\n(11)執行役\n(12)監査委員会\n(13)監査等委員会設\n置会社\n(14)会計監査人\n(15)計算書類\n(16)会社法施行規則\n(17)会社計算規則\n(18)電子公告規則", "topic": "株式会\n社の統\n治制度\nと会計", "chapter": 1}, {"no": 16, "page": 8, "type": "穴埋め", "question": "会社法における大会社たる公開会社が選択できる統治制度として、2015 年から採用可能となった\n (1)______________は、監査・指名・報酬の３つの委員会のうち監査に関する委員会だけが取\n 締役会の内部に設置され、この委員会が取締役と代表取締役の職務の監査、および会計監査人の\n 選任を行う", "answer": "(1)監査等委員会設置\n会社", "topic": "株式会\n社の統\n治制度\nと会計", "chapter": 1}, {"no": 17, "page": 9, "type": "穴埋め", "question": "大会社たる公開会社が統治制度として指名委員会等設置会社を選択した場合、３つの委員会を取\n 締役会の内部に設ける。この３つの委員会のうち(1)______________委員会は取締役と執行役\n の職務の監査と、会計監査人の選任を行う。", "answer": "(1)監査", "topic": "株式会\n社の統\n治制度\nと会計", "chapter": 1}, {"no": 18, "page": 9, "type": "誤答選\n択", "question": "（Ａ）会社法では、株式会社はまず、公開会社と非公開会社に分けられる。非公開会社と ____________と目論見書を通じて投資者に情報を提\n 供すべきことを規定する。", "answer": "(1)財務\n(2)有価証券届出書", "topic": "金融商\n品取引\n法による\n会計", "chapter": 1}, {"no": 34, "page": 13, "type": "穴埋め", "question": "法人税額は各事業年度ごとに決定される(1)______________の額に所定の税率を乗じて決定す\n る。(1)______________は(2)______________の額から(3)______________の額を控\n 除した差額である。", "answer": "(1)課税所得\n(2)益金\n(3)損金", "topic": "法人税\n法による\n税務会\n計", "chapter": 1}, {"no": 35, "page": 14, "type": "穴埋め", "question": "・資本主が出資した資金は通常、自己資本または単に(1)______________とよばれる。これに対し\n 銀行等の債権者から調達された資金を他人資本または(2)______________という。次に企業は\n これらの資金を投下して、事業活動に必要な(3) ______________を買いそろえる。\n・貸借対照表はある時点で企業が経済活動に利用している資金がどのような源泉から調達されているか\n という(4)、またその資金がどのような資産へ投下されているかという(5)______________を左右に\n 対照表示したものである。貸借対照表の項目の間には、常に資産=負債+資本の等式が成立しこれ\n を(6)______________という。\n・企業活動の結果として得られた(7)______________は最終的には出資者に帰属する。\n・(8)______________は営業活動によって達成された成果であり、(9)______________はそ\n の成果を得るために費やされた努力を金額的に表したものである。", "answer": "(1)資本\n(2)負債\n(3)資産\n(4)資産資金の調達源\n泉\n(5)資金の運用形態\n(6)貸借対照表等式\n(7)利益\n(8)収益\n(9)費用", "topic": "企業活\n動と財\n務諸表", "chapter": 2}, {"no": 36, "page": 14, "type": "穴埋め", "question": "企業活動を財務諸表に要約するには何らかの体系的かつ機械的な方法が必要になる。そのための手\n 段として数百年前に生み出され、現在まで利用され続けているのが(1)______________の技術で\n ある。(1)______________ではまず、企業の経済活動や事象のうち、企業の\n (2)______________に影響を及ぼす出来事を(3)______________として識別する。企業の\n どのような経済活動や事象が簿記上の取引に該当するかは、次の要件に従って判断される。簿記上の\n 取引に該当するためには、その(4)______________がすでに発生していて、企業の\n (2)______________に影響を及ぼしており、その影響が合理的な正確度で\n (5)______________に測定できなければならない。", "answer": "(1)複式簿記\n(2)資産・負債・資本\n(3)取引\n(4)事実\n(5)金額的", "topic": "取引", "chapter": 2}, {"no": 37, "page": 14, "type": "正答選\n択", "question": "企業のどのような経済活動や事象が簿記上の取引に該当するかは、次の要件に従って判断される。\n （Ａ）取引の事実がすでに発生しているかどうか\n （Ｂ）取引の事実が発生していない場合は、将来の期間におけるその発生の可能性を合理的に見\n 積もることができるかどうか\n （Ｃ）企業の資産・負債・資本に及ぼす影響を、合理的な正確度で金額的に測定できるかどうか\n （Ｄ）全て誤り", "answer": "A,C\n・\"取引の要件：\nその事実がすでに発生し\n ていて企業の資産・負\n 債・資本に影響を及ぼ\n しており、その影響が合\n理的な正確度で金額\n 的に測定できる\"", "topic": "取引", "chapter": 2}, {"no": 38, "page": 15, "type": "正答選\n択", "question": "企業のどのような経済活動が簿記上の取引に該当するかは、次の規準に従って判断される。\n ア．取引の事実がすでに発生していること\n イ．取引の事実が発生していない場合は、将来の一定期間以内にそれが発生する見込みであること\n ウ．取引の事実が企業の資産・負債・資本に影響を及ぼし、かつその影響が合理的な正確度で金額\n 的に測定できなければならないこと\n エ．すべて誤り", "answer": "ア,ウ\n・\"取引の要件：その事\n 実がすでに発生してい\n て企業の資産・負債・\n 資本に影響を及ぼして\n おり、その影響が合理\n的な正確度で金額的\n に測定できる\"", "topic": "取引", "chapter": 2}, {"no": 39, "page": 16, "type": "穴埋め", "question": "・取引の二面的な影響を左右に分けて記録することを(1)______________といい、\n (1)______________を記入する帳簿が(2)______________である。簿記では左側のことを\n (3)______________とよび、右側のことを(4)______________とよぶ。\n (1)______________は(3)______________の項目と(4)______________の項目を組\n み合わせて左右が同額になるように行われる。この均等関係が維持される仕組を\n (5)______________という。期首の繰越金額に関する(1)______________の記入は、\n (6)______________とよばれる。\n・分類集計のために、資産や負債などの項目別に設定された様式を(7)______________という。す\n べての(7)______________を収容した帳簿が(8)______________である。\n (2)______________に記録された事項を、(8)______________の各\n (7)______________に写しかえる作業を(9)______________という。\n (9)______________の手続きが正確に行われたことを確かめるために、(8)______________\n のすべての(7)______________の金額を集めて、(10)______________を作成する。\n (10)______________には、(8)______________の各(7)______________の\n (3)______________合計と(4)______________合計を集めて作成する\n (11)______________と(7)______________ごとに(3)______________と\n (4)______________の金額を相殺した後の残高だけを集めて作成する\n (12)______________がある。\n\n・(10)______________を利用し、記帳手続の正確性を点検することができる仕組みを、複式簿\n 記の(13)______________という。", "answer": "(1)仕訳\n(2)仕訳帳\n(3)借方\n(4)貸方\n(5)貸借平均の原理\n(6)開始記入\n(7)勘定\n(8)元帳\n(9)転記\n(10)試算表\n(11)合計試算表\n(12)残高試算表\n(13)自己検証機能", "topic": "取引の\n記録と\n集計", "chapter": 2}, {"no": 40, "page": 16, "type": "正答選\n択", "question": "仕訳のルールに従うと、\n（Ａ）資本の増加\n（Ｂ）負債の減少\n （Ｃ）収益の増加（実現）は借方に記入される。\n （Ｄ）全て誤り", "answer": "B\n・「り」と「し」の筆跡の向\n きをイメージして借方と\n 貸方の左右の位置を\n 覚える", "topic": "取引の\n記録と\n集計", "chapter": 2}, {"no": 41, "page": 17, "type": "正答選\n択", "question": "仕訳のルールに従うと、\n ア．資産の増加\n イ．資本の増加\n ウ．収益の増加（実現）は貸方に記入される。\n エ．すべて誤り", "answer": "イ,ウ\n・「り」と「し」の筆跡の向\n きをイメージして借方と\n 貸方の左右の位置を\n 覚える", "topic": "取引の\n記録と\n集計", "chapter": 2}, {"no": 42, "page": 17, "type": "穴埋め", "question": "仕訳帳の記録を分類集計するには、資産・負債・資本・収益・費用の各項目について、勘定を設定し\n なければならない。そのような必要とされるすべての勘定を収容した帳簿が(1)______________で\n ある。仕訳帳に記録された事項を、(1)______________の各勘定に写しかえる作業を転記とい\n う。なお、(1)______________各勘定科目の残高金額は、決算時点での経済的事実を正しく反\n 映しているか否かを点検しなければならない。そしてもし必要があれば、(1)______________の勘\n 定残高を、経済的事実と一致させるための調整を行うことになる。そのような調整を\n (2)______________という。", "answer": "(1)元帳\n(2)決算整理", "topic": "取引の\n記録と\n集計", "chapter": 2}, {"no": 43, "page": 17, "type": "正答選\n択", "question": "仕訳のルールに従うと、\n ア．資産の増加\n イ．負債の減少\n ウ．費用の増加（発生）は借方に記入される。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・「り」と「し」の筆跡の向\n きをイメージして借方と\n 貸方の左右の位置を\n 覚える", "topic": "取引の\n記録と\n集計", "chapter": 2}, {"no": 44, "page": 17, "type": "誤答選\n択", "question": "（Ａ）仕訳は、借方の項目と貸方の項目を組み合わせて、借方と貸方とが同額になるように行われる。\n この均等関係が維持される仕組を貸借平均の原理という。\n （Ｂ）１期間の利益が出資者に帰属して資本金に追加されることから、貸借対照表等式を展開した\n 結果、「資産＋費用＝負債＋資本金＋収益」が得られる。\n （Ｃ）試算表には、元帳の各勘定口座の借方合計と貸方合計を集めて作成する合計試算表と、勘\n 定ごとに借方と貸方の金額を相殺した後の残高だけを集めて作成する残高試算表がある。またこれら\n 両方を統合すれば、合計残高試算表を作成することができる。\n （Ｄ）試算表を利用し、記帳手続の正確性を点検することができる仕組みを、複式簿記の決算整理\n という", "answer": "D\n・決算整理→自己検証\n機能", "topic": "取引の\n記録と\n集計", "chapter": 2}, {"no": 45, "page": 18, "type": "正答選\n択", "question": "仕訳のルールに従うと、\n ア．資産の増加\n イ．負債の減少\n ウ．収益の増加（実現）は貸方に記入される。\n エ．すべて誤り", "answer": "ウ\n・「り」と「し」の筆跡の向\n きをイメージして借方と\n 貸方の左右の位置を\n 覚える", "topic": "取引の\n記録と\n集計", "chapter": 2}, {"no": 46, "page": 18, "type": "正答選\n択", "question": "仕訳のルールに従うと、\n ア．資産の増加\n イ．負債の減少\n ウ．収益の増加（実現）は借方に記入される。\n エ．すべて誤り", "answer": "ア,イ\n・「り」と「し」の筆跡の向\n きをイメージして借方と\n 貸方の左右の位置を\n 覚える", "topic": "取引の\n記録と\n集計", "chapter": 2}, {"no": 47, "page": 18, "type": "誤答選\n択", "question": "（Ａ）貸借対照表等式の右辺にある項目について、仕訳の際に左側（借方）に記入すると当該項\n 目の減少を表し、右側（貸方）に記入すれば当該項目の増加を意味する。\n （Ｂ）試算表を利用し、記帳手続の正確性を検討することができる仕組みを、複式簿記の決算整理\n 機能という。\n （Ｃ）残高勘定を設定して決算を行う方式は、大陸式決算とよばれる。\n （Ｄ）棚卸法では貸借対照表を作成できても、損益計算書を作成することはできない。", "answer": "B\n・決算整理→自己検証", "topic": "取引の\n記録と\n集計", "chapter": 2}, {"no": 48, "page": 19, "type": "穴埋め", "question": "・元帳の勘定残高を、経済的事実と一致させるための調整を(1)______________という。\n・(2)______________を利用すれば、残高試算表から決算整理を経て財務諸表を迅速に導出す\n ることができる。\n・会計帳簿に記入を行って1 期間の帳簿を締切ることを(3)______________という。\n (3)______________ではまず初めに(4)______________を設けて、元帳における収益・費\n 用の各勘定の残高を集合する。最後に(5)______________を設けて、勘定の残高を集計する。\n・(5)______________を設定して決算を行う方式は、(6)______________とよばれる。これに\n 対し(5)______________の設定を行わず、元帳における資産・負債・資本の残高を集めて繰越\n 試算表とよばれる表だけを作成し、それぞれの残高を次期へ繰越す方式を(7)______________と\n いう。\n・帳簿記録を基礎として財務諸表を作成し、その中で利益を算定する方法を(8)______________\n という。これとは別に、決算日に資産と負債を実地調査して貸借対照表を作成し、1 期間における純\n 資産の増殖分として利益を計算することもできる。この方法は資産と負債の実地調査を必要とすること\n から(9)______________とよばれる。\n・損益計算書は、企業が1 期間に獲得した利益の金額だけでなく、その利益がどのようにして得られたか\n を示すことにより、(10)______________ないし(11)______________を明らかにする書面で\n ある。\n・貸借対照表は企業の(12)______________を描写する。(12)______________は\n (13)______________ともいわれる。", "answer": "(1)決算整理\n(2)精算表\n(3)帳簿決算\n(4)損益勘定\n(5)残高勘定\n(6)大陸式決算\n(7)英米式決算\n(8)誘導法\n(9)棚卸法\n(10)経営成績\n(11)投資の成果\n(12)財政状態\n(13)投資のポジション", "topic": "決算と\n財務諸\n表の誘\n導", "chapter": 2}, {"no": 49, "page": 19, "type": "穴埋め", "question": "・複式簿記では、企業の経済活動および関連事象にもとづく利益を計算する方法として、決算日に資\n 産と負債を実地調査して貸借対照表を作成し、１期間における純資産の増殖分として利益を計算す\n る方法(1)______________と、帳簿記録を基礎として財務諸表を作成し、その中で利益を算定\n する方法(2)______________の２つがある。", "answer": "(1)棚卸法\n(2)誘導法", "topic": "決算と\n財務諸\n表の誘\n導", "chapter": 2}, {"no": 50, "page": 20, "type": "穴埋め", "question": "精算表は決算の仕組みを簡略に示すものであるが、精算表上での決算手続は、仕訳帳および元帳とい\n う正式の会計帳簿にも記載されなければならない。会計帳簿にこの記入を行って、１期間の帳簿を締\n 切ることを(1)______________という。", "answer": "(1)帳簿決算", "topic": "決算と\n財務諸\n表の誘\n導", "chapter": 2}, {"no": 51, "page": 20, "type": "穴埋め", "question": "決算日に資産と負債を実地調査して貸借対照表を作成し、１期間における純資産の増殖分として利\n 益を計算することもできる。この方法は棚卸法とよばれるが、この方法では利益の源泉を明らかにした損\n 益計算書を作成することはできない。したがって、財務諸表の作成には、帳簿記録を基礎として作成\n し、その中で利益を算定する(1)______________が採用されている。", "answer": "(1)誘導法", "topic": "決算と\n財務諸\n表の誘\n導", "chapter": 2}, {"no": 52, "page": 20, "type": "穴埋め", "question": "・帳簿決算において、残高勘定の設定を行わず、元帳における資産・負債・資本の残高を集めて繰越\n 試算表とよばれる表だけを作成し、それぞれの残高を次期へ繰越す方式を(1)______________と\n いう。", "answer": "(1)英米式決算", "topic": "決算と\n財務諸\n表の誘\n導", "chapter": 2}, {"no": 53, "page": 20, "type": "誤答選\n択", "question": "（Ａ）貸借対照表等式を展開すると、資産+収益＝負債+資本金+費用となる。\n（Ｂ）決算日に資産と負債を実地調査して貸借対照表を作成し、1 期間における純資産の増殖分と\n して利益を計算することができる。この方法は資産と負債の実地調査を必要とすることから棚卸法とよば\n れるが、この方法では利益の源泉を明らかにした損益計算書を作成することはできない。\n（Ｃ）当期純利益の計算方法のうち、期首と期末の貸借対照表を比較することにより資本の増殖分\n として利益額を計算する方法は、財産法とよばれる。\n（Ｄ）収益費用アプローチによれば、貸借対照表は収入・支出のうち収益・費用とならなかった部分を\n 収容する集計表として位置づけられる。", "answer": "A\n・資産＝負債＋資本", "topic": "決算と\n財務諸\n表の誘\n導", "chapter": 2}, {"no": 54, "page": 21, "type": "穴埋め", "question": "・(1)______________は資本を増加させる原因となる収益から、資本の減少をもたらす費用を控\n 除する形で利益を算定する方法である。\n・収益 - 費用 = 当期純利益（収益の超過分）という等式を(2)______________という。\n・1 期間の利益額を、純資産の裏付けを伴って計算する方法は、(3)______________である。\n・期末資本 - 期首資本 = 当期純利益（資本の増殖分）という等式を(4)______________と\n いう。\n・収益と費用こそが中心概念であるとする見解は(5)______________とよばれ、これに対し資産と\n 負債を会計の基本概念とみる考え方は(6)______________とよばれる。", "answer": "(1)損益法\n(2)損益法等式\n(3)財産法\n(4)財産法等式\n(5)収益費用観\n(6)資産負債観", "topic": "損益法\nと財産\n法", "chapter": 2}, {"no": 55, "page": 21, "type": "穴埋め", "question": "・一般的に、1 期間における期首から期末への貸借対照表の資本の変化が、損益計算書の当期純利\n 益が出資者の資本金に算入されることによって説明されることは(1)______________とよばれる。\n・取引を経て実現された利益ではないものは、当期純利益とは区別して(2)______________という\n 項目に含めて取扱わなければならない。貸借対照表に振替えられる利益は、当期純利益とその他の\n 包括利益から構成されることになり、この合計額は(3)______________と名付けられている。", "answer": "(1)クリーン・サープラス\n関係\n(2)その他の包括利益\n(3)包括利益", "topic": "貸借対\n照表と\n損益計\n算書の\n関係", "chapter": 2}, {"no": 56, "page": 21, "type": "穴埋め", "question": "包括利益は、(1)______________（事業の利益）とその他の包括利益から構成される。", "answer": "(1)当期純利益", "topic": "貸借対\n照表と\n損益計\n算書の\n関係", "chapter": 2}, {"no": 57, "page": 21, "type": "穴埋め", "question": "・一般的に、1 期間における期首から期末への貸借対照表の資本の変化が、損益計算書の当期純利\n 益が出資者の資本金に算入されることによって説明されることは(1)______________とよばれる。", "answer": "(1)クリーン・サープラス\n関係", "topic": "貸借対\n照表と\n損益計\n算書の\n関係", "chapter": 2}, {"no": 58, "page": 22, "type": "穴埋め", "question": "・財務諸表の作成に際しては、多くの場面で見積もりや判断が必要とされるので、恣意的な選択や会計\n 処理を通じて（1）______________が行われるおそれがある。（2）______________の最\n 大の動機は財務諸表に示される経営成績や財政状態を良好に維持して企業活動に必要な資金の\n 調達を容易にすることである。逆に経営者が（3）______________を行う最大の動機は税金の\n 節約である。\n\n・財務諸表の作成と公表に際して準拠されるべき社会的な規範を設定し経営者の行う会計処理に一\n 定の規制を加えることが必要でありこのような社会的な規範として形成されてきたものが（4）\n ______________である。この基準は公正妥当のものとして社会的な承認を得ているという意味で\n （5）______________とよばれている。", "answer": "(1)利益操作\n(2)利益操作\n(3)利益圧縮\n(4)会計基準\n(5)一般に認められた会\n計原則", "topic": "会計基\n準の必\n要性", "chapter": 3}, {"no": 59, "page": 22, "type": "穴埋め", "question": "・第２次大戦後、アメリカの会計基準を参考にして制定した(1)______________が、わが国で最\n 初の本格的な会計基準である。企業会計原則を管轄する(2)______________は、必要に応じ\n て改正するとともに、これを補足する多数の会計基準を設定してきた。\n・会計基準は政府の機関ではなく民間団体が設定すべきであるとの見解が支配的になっており、わが国\n でも、そのような組織として(3)______________が2001 年に設立され、\n (4)______________という名称で、会計基準を設定してきた。\n・企業会計基準委員会と並立する組織として、2022 年7 月に(5)______________が設立さ\n れ、サステナビリティ情報の開示基準に関する検討を開始している。", "answer": "(1)企業会計原則\n(2)企業会計審議会\n(3)企業会計基準委員\n会\n(4)企業会計基準第○\n号\n(5)サステナビリティ基準\n委員会", "topic": "会計基\n準の設\n定", "chapter": 3}, {"no": 60, "page": 23, "type": "誤答選\n択", "question": "（Ａ）第２次大戦後、アメリカの会計基準を参考にして制定した「企業会計原則」が、わが国で最初\n の本格的な会計基準である。\n（Ｂ）会計基準を設定するアプローチのうち帰納的アプローチとは、まず最初に、実際に行われている会\n 計処理の諸方法を観察し、その中からよりいっそう一般的または共通的なものを抽出することによって、\n 会計基準を設定する方法である。\n（Ｃ）企業会計の背後には、それを可能にするいくつかの基礎構造が存在している。会計の理論的な\n 基礎構造を構成する命題は、会計公準とよばれる。\n（Ｄ）わが国の「企業会計原則」は、一般原則、損益計算書原則、貸借対照表原則という３つの部\n 分から構成されている。このうち一般原則は、具体的な会計処理と表示の方法を規定する個々の会\n 計規定について、その根拠を明らかにしたり体系づけを行うのに役立つ点で、帰納的アプローチにおける\n 重要な基準となるルールである。", "answer": "D\n・帰納的→演繹的", "topic": "会計基\n準の設\n定", "chapter": 3}, {"no": 61, "page": 24, "type": "穴埋め", "question": "・世界中で通用する会計基準の形成は、1973 年に主要国の会計士団体が集結して（1）\n ______________を制定する活動として開始され、2001 年からは会計士団体とは独立の国際会\n 計基準審議会がこれを継承し、（2）______________という名称で会計基準の制定を継続して\n いる。\n・会計基準間の主要な差異を調整して、どちらの基準による財務諸表を利用しても同一の意思決定結\n 果に到達するレベルにまで、国内基準を国際基準と実質的に合致させることを、会計基準の国際的な\n （3）______________という。\n・日本企業が連結財務諸表を作成する場合に準拠すべき会計基準として、日本基準のほかに（4）\n ______________の会計基準および（5）______________の採用も認めている。またこれと\n は別に、企業会計基準委員会は、日本基準に特徴的な会計処理の考え方を国際的に広報するため\n に、いわば日本版の国際会計基準ともいうべき（6）______________を制定し2016 年3 月\n 決算期から適用できることとした。\n・会計基準の国際的統合は、資本の国際的な流通の促進を目的としており、主として（7）\n ______________財務諸表作成のために必要とされる。これに対し、日本の会社法の配当財源や\n 法人税法の課税所得計算は、（8）______________財務諸表を基礎とするのが原則である。\n・（9）______________基準の一部と（10）______________の表示基準は連結財務諸\n 表に対してのみ適用し、個別財務諸表には適用しないこととされている。このように連結と単体で適用\n する会計基準に差を設ける取扱を（11）______________という。", "answer": "(1)国際会計基準\n(2)国際財務報告基準\n(3)コンバージェンス\n(4)アメリカ\n(5)国際会計基準\n(6)修正国際基準\n(7)連結\n(8)個別\n(9)退職給付会計\n(10)包括利益\n(11)連単分離", "topic": "会計基\n準の国\n際的統\n合", "chapter": 3}, {"no": 62, "page": 24, "type": "穴埋め", "question": "会計基準間の主要な差異を調整して、どちらの基準による財務諸表を利用しても同一の意思決定結\n 果に到達するレベルにまで、国内基準を国際基準と実質的に合致させることを、会計基準の国際的な\n (1)______________という。", "answer": "(1)コンバージェンス", "topic": "会計基\n準の国\n際的統\n合", "chapter": 3}, {"no": 63, "page": 25, "type": "正答選\n択", "question": "日本企業が連結財務諸表を作成する場合に準拠すべき会計基準として、現在採用が認められていな\n いものは、\nア．米国会計基準（ＵＳ－ＧＡＡＰ）\nイ．国際会計基準（ＩＡＳ）および国際財務報告基準（ＩＦＲＳ）\n ウ．修正国際基準（ＪＭＩＳ）である。\n エ．すべて誤り", "answer": "エ\n・全て認められている", "topic": "会計基\n準の国\n際的統\n合", "chapter": 3}, {"no": 64, "page": 25, "type": "穴埋め", "question": "・こんにちのグローバル化した経済に対応するため、会計基準の国際的な統合も積極的に推進されつつ\n ある。その試みは、1973 年に主要国の会計士団体が集結して、(1)______________基準を制\n 定する活動として開始され、2001 年からは会計士団体とは独立の(1)______________基準審\n 議会がこれを継承し、(2)______________基準という名称で会計基準の制定を継続している。こ\n の結果、2014 年12 月末現在で26 個の(1)______________基準と15 個の\n (2)______________基準が有効な基準として存在しており、これらは一括して\n (1)______________基準とよばれている。", "answer": "(1)国際会計\n(2)国際財務報告", "topic": "会計基\n準の国\n際的統\n合", "chapter": 3}, {"no": 65, "page": 25, "type": "誤答選\n択", "question": "（Ａ）日本国内で社会的な承認を得ている会計基準があるが、今日のグローバル化した経済に対応\n するため、会計基準の国際的な統合も積極的に推進されつつある。会計基準が国ごとに相違すると、\n 投資者による外国企業への証券投資や、企業による外国での資金調達の妨げになるからである。\n （Ｂ）日本国内の会計基準の新設や改廃に際しては、国際会計基準との調整が重視されることが\n 多い。国内基準と国際基準の主要な差異を調整することにより、どちらの基準に基づく財務諸表を利\n 用しても同一の意思決定結果に到達するレベルにまで、国内基準と国際基準を実質的に合致させる\n ことを、会計基準の国際的なコンバージェンスという。\n （Ｃ）会計基準の国際的統合は、資本の国際的な流通の促進を目的としており、主として個別財\n 務諸表の作成のために必要とされる。これに対し、日本の会社法の配当制限や法人税法の課税所得\n 計算は、連結財務諸表を基礎とするのが原則である。\n （Ｄ）日本では、退職給付会計基準の一部と包括利益の表示基準は、連結財務諸表に対しての\n み適用し、個別（単体）財務諸表には適用しないこととされており、このように連結と単体で適用する\n 会計基準に差を設ける取扱を連単分離という", "answer": "C\n・連結と個別が逆", "topic": "会計基\n準の国\n際的統\n合", "chapter": 3}, {"no": 66, "page": 26, "type": "穴埋め", "question": "会社法の大会社に該当しない会社は日本基準のほか(1)______________または\n (2)______________を選択することができる。", "answer": "(1)中小会計指針\n(2)中小会計要領", "topic": "会計基\n準の適\n用区分", "chapter": 3}, {"no": 67, "page": 26, "type": "穴埋め", "question": "・会計の前提となる仮定や会計の目的を最初に規定し、これらの仮定や目的と最もうまく首尾一貫する\n ように具体的な会計処理のルールを導き出してくる方法を(1)______________アプローチという。こ\n れに対しまず最初に、実際に行われている会計処理の諸方法を観察し、その中からよりいっそう一般的\n または共通的なものを抽出することによって、会計基準を設定する方法を(2)______________ア\n プローチという。わが国の企業会計原則は、「企業会計の実務の中に慣習として発達したものの中か\n ら、一般に公正妥当と認められるところを要約したもの」であるから、(3)______________によって\n 形成された会計基準である。", "answer": "(1)演繹的\n(2)帰納的\n(3)帰納的アプローチ", "topic": "帰納的\nアプロー\nチの問\n題点", "chapter": 3}, {"no": 68, "page": 26, "type": "穴埋め", "question": "わが国の企業会計原則は、「企業会計の実務の中に慣習として発達したものの中から、一般に公正妥\n 当と認められるところを要約したもの」であるから、(1)______________によって形成された会計基\n 準である。", "answer": "(1)帰納的アプローチ", "topic": "帰納的\nアプロー\nチの問\n題点", "chapter": 3}, {"no": 69, "page": 26, "type": "穴埋め", "question": "企業会計の背後には、それを可能にするいくつかの基礎構造が存在している。会計の理論的な基礎構\n 造を構成する命題は会計公準とよばれる。会計公準に基づく(1)______________での会計基準\n の設定は、当然の前提として一般的承認を得られる命題を所与として、それと論理的に最もうまく首尾\n 一貫するような形で、個々の具体的な会計処理の指針を導き出し、会計基準として再構築しようとす\n る試みである。", "answer": "(1)演繹的アプローチ", "topic": "帰納的\nアプロー\nチの問\n題点", "chapter": 3}, {"no": 70, "page": 26, "type": "穴埋め", "question": "会計の前提となる仮定や会計の目的を最初に規定し、これらの仮定や目的と最もうまく首尾一貫するよ\n うに、具体的な会計処理のルールを導き出す方法を(1)______________という。", "answer": "(1)演繹的アプローチ", "topic": "帰納的\nアプロー\nチの問\n題点", "chapter": 3}, {"no": 71, "page": 27, "type": "穴埋め", "question": "財務会計のうち、法律制度の一環として、法規制に準拠して行われる会計を、とくに\n (1)______________会計という。(1)______________会計はさらに、（a）会社法による会\n 計、（b）金融商品取引法による会計、および（c）法人税法による税務会計の3 つに分類され\n る。わが国の企業会計原則は、「企業会計の実務の中に慣習として発達したものの中から、一般に公\n 正妥当と認められるところを要約したものであるから、(2)______________的アプローチによって形\n 成された会計基準である。", "answer": "(1)制度\n(2)帰納", "topic": "帰納的\nアプロー\nチの問\n題点", "chapter": 3}, {"no": 72, "page": 27, "type": "穴埋め", "question": "・会計の理論的な基礎構造を構成する命題は、(1)______________とよばれる。\n・「会計の計算は個々の企業実体を対象として行う」とする命題が、(2)______________の公準で\n あり、会計単位の公準ともよばれている。\n・企業と出資者の関係をいかに解釈し、会計上の判断や財務諸表の作成を出資者と企業のいずれの\n 観点から行うべきかについては、(3)______________とよばれる研究領域における次のような2 通\n りの代表的な見解がある。\n1.企業は出資者の集合体であるとみて、出資者の観点から判断を行う(4)______________と\n2.出資者は企業の利害関係集団の1 つにすぎず企業は出資者とは別個の独立した存在であるとみ\n て、企業自体の観点から会計上の判断や財務諸表の作成を行う(5)______________がそれで\n ある。\n・企業活動が無限に継続しているため、「会計の計算は期間を区切って行う」とする命題が、\n (6)______________の公準である。(6)______________に重要な疑念を抱かせる事象や\n 状況が存在し、その解消や改善のための対応をしても重要な不確実性が認められると判断される場合\n には、その内容を財務諸表に注記することが求められている。\n・「会計の計算は貨幣額を用いて行う」という(7)______________の公準は、会計を成立させるの\n に不可欠な前提条件である。\n・貨幣価値の変動が顕著な場合には、過去の会計記録を一般物価水準で調整したり、個々の財貨を\n 決算日現在の市場価格で評価しなおす必要が生じる。そのような修正を行う会計は\n (8)______________とよばれ、財務会計の特殊な研究領域になっている。", "answer": "(1)会計公準\n(2)企業実態\n(3)会計主体論\n(4)資本主理論\n(5)企業主体理論\n(6)継続企業（ゴーイン\n グ・コンサーン）\n(7)貨幣的測定\n(8)物価変動会計", "topic": "会計公\n準論", "chapter": 3}, {"no": 73, "page": 28, "type": "正答選\n択", "question": "会計公準として、こんにち最も一般的に考えられている3 つに含まれているのは、\n（Ａ）企業実体の公準\n（Ｂ）継続性の公準\n （Ｃ）真実性の公準である。\n （Ｄ）全て誤り", "answer": "A\n・会計公準：\n企業実態の公準\n継続企業の公準\n貨幣的測定の公準", "topic": "会計公\n準論", "chapter": 3}, {"no": 74, "page": 28, "type": "穴埋め", "question": "会計主体論には、（a）企業は出資者の集合体であるとみて、出資者の観点から判断を行う\n (1)______________と、（b）出資者は企業の利害関係集団の1 つにすぎず、企業は出資者\n とは別個の独立した存在であるとみて、企業自体の観点から会計上の判断や財務諸表の作成を行う\n 企業主体理論がある。", "answer": "(1)資本主理論", "topic": "会計公\n準論", "chapter": 3}, {"no": 75, "page": 28, "type": "穴埋め", "question": "会計の理論的な基礎構造を構成する命題は、会計公準とよばれ、こんにち最も一般的に考えられてい\n るのは、(1)______________の公準、(2)______________の公準、および貨幣的測定の公\n 準の３つである。このうち(1)______________の公準は、「会計の計算は個々の\n (1)______________を対象として行う」とする命題であり、(2)______________の公準は、\n 「会計の計算は期間を区切って行う」とする命題である。", "answer": "(1)企業実体\n(2)継続企業", "topic": "会計公\n準論", "chapter": 3}, {"no": 76, "page": 28, "type": "穴埋め", "question": "企業実体の公準はまず、会計の対象範囲を形式的に特定するものであるが、それだけにとどまらず、企\n 業と出資者の関係を規定する実質的な意味をも含むものとして解釈されることも多い。企業と出資者\n の関係をいかに解釈し、会計上の判断や財務諸表の作成を出資者と企業のいずれの観点から行うべ\n きかについては、(1)______________とよばれる研究領域における次のような（a）、（b）の2\n 通りの代表的な見解がある。（a）企業は出資者の集合体であるとみて、出資者の観点から判断を\n 行う(2)______________と、（b）出資者は企業の利害関係集団の1 つにすぎず、企業は出\n 資者とは別個の独立した存在であるとみて、企業自体の観点から会計上の判断や財務諸表の作成を\n 行う企業主体理論がそれである。", "answer": "(1)会計主体論\n(2)資本主理論", "topic": "会計公\n準論", "chapter": 3}, {"no": 77, "page": 29, "type": "正答選\n択", "question": "企業会計の背後には、それを可能にするいくつかの基礎構造が存在している。会計の理論的な基礎構\n 造を構成する命題は、会計公準とよばれる。このような会計公準として、どのような命題を取り上げるべ\n きかについては、多くの学説があるが、こんにち最も一般的に考えられているのは、\n ア．企業実体の公準：会計の計算は個々の企業実体を対象に行う\n イ．継続性の公準：会計の計算はその処理および手続きを原則として毎期継続して行う\n ウ．貨幣的測定の公準：会計の計算は貨幣額を用いて行うの3 つである。\n エ．すべて誤り", "answer": "ア,ウ\n・会計公準：\n企業実態の公準\n継続企業の公準\n貨幣的測定の公準", "topic": "会計公\n準論", "chapter": 3}, {"no": 78, "page": 29, "type": "正答選\n択", "question": "ア. 企業実体の公準とは、企業はたとえそれが個人商店であっても、その出資者たる個人から独立した\n 別個の存在であるとする見方である。\n イ. 企業活動が無限に継続しているため、「会計の計算は期間を区切って行う」とする命題が、継続企\n 業の公準である。\n ウ. 貨幣的測定の公準は、「会計の計算は貨幣額を用いて行う」というものであり、貨幣価値は変動す\n るといった実質的な仮定を含んでいる。\n エ. すべて誤り", "answer": "ア,イ\n・貨幣価値は変動すると\n いった実質的な仮定を\n 含むのは物価変動会\n 計である", "topic": "会計公\n準論", "chapter": 3}, {"no": 79, "page": 29, "type": "穴埋め", "question": "・わが国の企業会計原則は、(1)______________、(2)______________および\n (3)______________という3 つの部分から構成されている。このうち(1)______________は、\n 企業会計の全般にかかわる基本的なルールあるいは損益計算書と貸借対照表の両方に共通するルー\n ルを示したものである。\n\n・他のすべての原則の上位に立つ最高規範として、企業会計原則の最初に位置付けられているものとし\n て(4)______________の原則がある。\n\n・真実性の原則に反する虚偽記載には、借入金や費用など、現実に存在するものを隠蔽したり、商品や\n 売上など、実際には存在しないものを存在するかのごとくに会計処理したりする場合がある。このような\n 虚偽記載を通じて架空利益を計上する行為を(5)______________といい、逆に利益を隠蔽する\n 行為を(6)             という", "answer": "(1)一般原則\n(2)損益計算書原則\n(3)貸借対照表原則\n(4)真実性\n(5)粉飾決算\n(6)逆粉飾決算", "topic": "真実性\nの原則", "chapter": 3}, {"no": 80, "page": 30, "type": "穴埋め", "question": "真実性の原則に反する虚偽記載には、借入金や費用など、現実に存在するものを隠蔽したり、商品や\n 売上など、実際には存在しないものを存在するかのごとくに会計処理したりする場合がある。とくに利益\n を隠蔽する行為を(1)______________という。", "answer": "(1)逆粉飾決算", "topic": "真実性\nの原則", "chapter": 3}, {"no": 81, "page": 30, "type": "穴埋め", "question": "わが国の企業会計原則のうち、一般原則とは、企業会計の全般にかかわる基本的なルールを示したも\n のであり、企業会計原則は、７つの一般原則を掲げている。７つの一般原則のうち、上位に立つ最高\n 規範として、企業会計原則の最初に位置づけられているものは、(1)______________である。", "answer": "(1)真実性の原則", "topic": "真実性\nの原則", "chapter": 3}, {"no": 82, "page": 30, "type": "穴埋め", "question": "（1）______________の原則は、他のすべての原則の上位に立つ最高規範として、企業会計原\n 則の最初に位置づけられている。", "answer": "(1)真実性", "topic": "真実性\nの原則", "chapter": 3}, {"no": 83, "page": 30, "type": "穴埋め", "question": "・わが国の企業会計原則は、「企業会計の実務の中に慣習として発達したものの中から、一般に公正\n 妥当と認められるところを要約したもの」であるから、帰納的アプローチによって形成された会計基準であ\n り、(1)______________、(2)______________、および(3)______________という3 つ\n の部分から構成されている。このうち(1)______________は、企業会計の全般にかかわる基本的\n なルールを示したものである。", "answer": "(1)一般原則\n(2)損益計算書原則\n(3)貸借対照表原則", "topic": "真実性\nの原則", "chapter": 3}, {"no": 84, "page": 30, "type": "穴埋め", "question": "・正規の簿記の原則は、「企業会計は、すべての取引につき、正規の簿記の原則に従って、正確な会計\n 帳簿を作成しなければならない」とする原則である。この原則に従って、企業は、(1)\n ______________・(2) ______________・(3)______________を備えた会計帳簿を作\n 成しなければならない。", "answer": "(1)網羅性\n(2)検証可能性\n(3)秩序性", "topic": "正規の\n簿記の\n原則", "chapter": 3}, {"no": 85, "page": 30, "type": "穴埋め", "question": "正規の簿記の原則は、「企業会計は、すべての取引につき、正規の簿記の原則に従って、正確な会計\n 帳簿を作成しなければならない」とする原則である。この原則に従って、企業は、網羅性・検証可能性・\n (1)______________を備えた会計帳簿を作成しなければならない。", "answer": "(1)秩序性", "topic": "正規の\n簿記の\n原則", "chapter": 3}, {"no": 86, "page": 31, "type": "穴埋め", "question": "・(1)______________の原則は、正しい期間利益の金額は、損益取引から生じた純資産の増加\n 分だけに限定されるべきであり、資本取引による純資産の増加分を利益に混入させてはならないとする\n のが趣旨である。\n・企業が利益の獲得をめざして行う取引を(2)______________という。\n・出資者による追加出資や資本の引出しなど、企業の純資産を直接的に変化させることを目的として行\n われる取引を(3)______________という。\n・剰余金は(3)______________から生じた(4)______________と、(2)______________\n から生じた(5)______________に分けられる。", "answer": "(1)資本と利益\n(2)損益取引\n(3)資本取引\n(4)資本剰余金\n(5)利益剰余金", "topic": "資本と\n利益の\n区別の\n原則", "chapter": 3}, {"no": 87, "page": 31, "type": "穴埋め", "question": "(1)______________の原則は、正しい期間利益の金額は、損益取引から生じた純資産の増加分\n だけに限定されるべきであり、資本取引による純資産の増加分を利益に混入させてはならないとするの\n が趣旨である。", "answer": "(1)資本と利益の区別", "topic": "資本と\n利益の\n区別の\n原則", "chapter": 3}, {"no": 88, "page": 31, "type": "穴埋め", "question": "「企業会計は、財務諸表によって、利害関係者に対し必要な会計事実を明瞭に表示し、企業の状況\n に関する判断を誤らせないようにしなければならない」とする原則を(1)______________の原則とい\n う。", "answer": "(1)明瞭性", "topic": "明瞭性\nの原則", "chapter": 3}, {"no": 89, "page": 31, "type": "穴埋め", "question": "(1)______________の原則は、「企業会計は、財務諸表によって、利害関係者に対し必要な会\n 計事実を明瞭に表示し、企業の状況に関する判断を誤らせないようにしなければならない」とする原則\n である。", "answer": "(1)明瞭性", "topic": "明瞭性\nの原則", "chapter": 3}, {"no": 90, "page": 31, "type": "穴埋め", "question": "会社法の会社計算規則や金融商品取引法に基づく財務諸表規則は、財務諸表が必要な事実を明\n 瞭に表示しているか否かについて、監査人が判断を行う場合の基準としても用いられており、これは\n (1)______________の原則に基づくものである。", "answer": "(1)明瞭性", "topic": "明瞭性\nの原則", "chapter": 3}, {"no": 91, "page": 31, "type": "穴埋め", "question": "(1)______________の原則の背後には、1 つの取引や経済的事実について、複数の会計処理方\n 法が認められているという現状がある。たとえば棚卸資産の原価配分方法としての先入先出法と移動\n 平均法、減価償却方法としての定額法と定率法などがそれである。", "answer": "(1)継続性", "topic": "継続性\nの原則", "chapter": 3}, {"no": 92, "page": 32, "type": "穴埋め", "question": "(1)______________の原則の背後には、1 つの取引や経済的事実について、複数の会計処理方\n 法が認められているという現状がある。たとえば棚卸資産の原価配分方法としての先入先出法と移動\n 平均法、減価償却方法としての定額法と定率法などがそれである。", "answer": "(1)継続性", "topic": "継続性\nの原則", "chapter": 3}, {"no": 93, "page": 32, "type": "穴埋め", "question": "「企業の財政に不利な影響を及ぼす可能性がある場合には、これに備えて適当に健全な会計処理をし\n なければならない」とする原則を (1)______________ の原則という。しかし利益を控え目に計上\n する会計処理が過度に行われると、財務諸表は企業の経済的事実を反映しなくなるから、\n (2)______________ の原則に違反することになる。", "answer": "(1)保守主義\n(2)真実性", "topic": "保守主\n義の原\n則", "chapter": 3}, {"no": 94, "page": 32, "type": "穴埋め", "question": "(1)______________の原則は、「企業の財政に不利な影響を及ぼす可能性がある場合には、これ\n に備えて適当に健全な会計処理をしなければならない」とする原則である。", "answer": "(1)保守主義", "topic": "保守主\n義の原\n則", "chapter": 3}, {"no": 95, "page": 32, "type": "穴埋め", "question": "(1)______________は「企業の財政に不利な影響を及ぼす可能性がある場合には、これに備えて\n 適当に健全な会計処理をしなければならない」とする原則である。しかし利益を控え目に計上する会計\n 処理が過度に行われると、財務諸表は企業の経済的事実を反映しなくなるから、\n (2)______________に違反することになる。\n(3)______________は「株主総会提出のため、信用目的のため、租税目的のため等種々の目的\n のために異なる形式の財務諸表を作成する必要がある場合、それらの内容は、信頼しうる会計記録に\n 基づいて作成されたものであって、政策の考慮のために事実の真実な表示をゆがめてはならない」とする\n 原則である。\n(4)______________は発生したすべての取引を、事実や証拠に基づいて、継続的・組織的に記録\n することによって、網羅性・検証可能性・秩序性を備えた会計帳簿を作成することを要求している。その\n ため、原則として簿外の資産や負債は存在してはならないが、(5)______________によって、簿外\n 資産や簿外負債の存在が認められることもある。", "answer": "(1)保守主義の原則\n(2)真実性の原則\n(3)単一性の原則\n(4)正規の簿記の原則\n(5)重要性の原則", "topic": "保守主\n義の原\n則", "chapter": 3}, {"no": 96, "page": 32, "type": "穴埋め", "question": "「株主総会提出のため、信用目的のため、租税目的のため等種々の目的のために異なる形式の財務\n 諸表を作成する必要がある場合、それらの内容は、信頼しうる会計記録に基づいて作成されたもので\n あって、政策の考慮のために事実の真実な表示をゆがめてはならない」とする原則を\n (1)           の原則という", "answer": "(1)単一性", "topic": "単一性\nの原則", "chapter": 3}, {"no": 97, "page": 33, "type": "穴埋め", "question": "「株主総会提出のため、信用目的のため、租税目的のため等種々の目的のために異なる形式の財務\n 諸表を作成する必要がある場合、それらの内容は、信頼しうる会計記録に基づいて作成されたもので\n あって、政策の考慮のために事実の真実な表示をゆがめてはならない」という原則を、\n (1)______________という。", "answer": "(1)単一性の原則", "topic": "単一性\nの原則", "chapter": 3}, {"no": 98, "page": 33, "type": "穴埋め", "question": "(1)______________の原則は、「株主総会提出のため、信用目的のため、租税目的のため等\n 種々の目的のために異なる形式の財務諸表を作成する必要がある場合、それらの内容は、信頼しうる\n 会計記録に基づいて作成されたものであって、政策の考慮のために事実の真実な表示をゆがめてはな\n らない」とする原則である。", "answer": "(1)単一性", "topic": "単一性\nの原則", "chapter": 3}, {"no": 99, "page": 33, "type": "穴埋め", "question": "企業会計原則の一般原則の中では独立の原則として明示されていないが、実務で頻繁に援用されるも\n のとして、(1)______________の原則がある。(2)______________の原則は、すべての取引\n の正確な記録を要求しているから、帳簿に記録されないような簿外の資産や負債は、原則として存在\n してはならない。しかし、重要性の乏しいものについては、本来の厳密な会計処理によらないで、他の簡\n 便な会計処理によったため、(3)______________や(4)______________が生じたとしても、\n 正規の簿記の原則に従った会計処理として是認されることになっている。", "answer": "(1)重要性\n(2)正規の簿記\n(3)簿外資産\n(4)簿外負債", "topic": "重要性\nの原則", "chapter": 3}, {"no": 100, "page": 33, "type": "穴埋め", "question": "損益計算書がその意図する情報を十分に伝達するためには、そこに表示される項目について、詳細性と\n 簡潔性のバランスがうまく図られなければならない。その指針となるのが(1)______________であ\n る。", "answer": "(1)重要性の原則", "topic": "重要性\nの原則", "chapter": 3}, {"no": 101, "page": 33, "type": "正答選\n択", "question": "企業会計原則が掲げる７つの一般原則には、\n ア．重要性の原則\n イ．独立性の原則\n ウ．実質優先の原則がある。\n エ．すべて誤り", "answer": "エ\n・7 つの一般原則：\n 真実性、正規の簿\n 記、資本と利益の区\n 別、明瞭性、継続性、\n保守主義、単一性", "topic": "重要性\nの原則", "chapter": 3}, {"no": 102, "page": 34, "type": "穴埋め", "question": "・(1)______________は、すべての取引の正確な記録を要求しているから、帳簿に記録されないよ\n うな簿外の資産や負債は、原則として存在してはならない。しかし、重要性の乏しいものについては、本\n 来の厳密な会計処理によらないで、他の簡便な会計処理によったため、簿外資産や簿外負債が生じ\n たとしても、(1)______________に従った会計処理として是認されることになっている。", "answer": "(1)正規の簿記の原則", "topic": "重要性\nの原則", "chapter": 3}, {"no": 103, "page": 34, "type": "穴埋め", "question": "・(1)______________は、すべての取引の正確な記録を要求しているから、帳簿に記録されないよ\n うな簿外の資産や負債は、原則として存在してはならない。しかし、重要性の乏しいものについては、本\n 来の厳密な会計処理によらないで、他の簡便な会計処理によったため、簿外資産や簿外負債が生じ\n たとしても、(1)______________に従った会計処理として是認されることになっている。", "answer": "(1)正規の簿記の原則", "topic": "重要性\nの原則", "chapter": 3}, {"no": 104, "page": 34, "type": "穴埋め", "question": "(1)______________の原則を会計処理の面に適用すれば、簿外資産や簿外負債が生み出され\n る。", "answer": "(1)重要性", "topic": "重要性\nの原則", "chapter": 3}, {"no": 105, "page": 34, "type": "穴埋め", "question": "・損益計算書がその意図する情報を十分に伝達するためには、そこに表示される項目について、詳細性\n と簡潔性のバランスがうまく図られなければならない。その指針となるのが(1)______________の原\n 則である。この(1)______________の原則は、企業会計原則の一般原則の中では独立の原則と\n して明示されていないが、実務で頻繁に援用されている。", "answer": "(1)重要性", "topic": "重要性\nの原則", "chapter": 3}, {"no": 106, "page": 34, "type": "穴埋め", "question": "企業会計原則で最上位の概念は「真実性」であるのに対し、概念フレームワークで最重視されているの\n は会計情報の(1)______________である。", "answer": "(1)意思決定有用性", "topic": "意思決\n定有用\n性", "chapter": 3}, {"no": 107, "page": 34, "type": "穴埋め", "question": "・会計情報が投資のもたらす将来の成果の予測に関連する内容を含んでおり、投資者が企業価値の推\n 定に基づいて行う意思決定に対して積極的な影響を与えて貢献することを(1)______________と\n いう。\n・会計情報が表現の忠実性・検証可能性・中立性などに支えられて信頼するに足るものであることを\n (2)______________という。\n・一般的な制約となる特性のうち(3)______________とはある会計情報が既存の会計基準全体\n の内容やそれを支える基本的な考え方と矛盾していないことをいう。\n・(4)______________もまた会計情報が有用であるために欠かせない前提である。", "answer": "(1)意思決定との関連\n性\n(2)信頼性\n(3)内的整合性\n(4)比較可能性", "topic": "有用性\nの構成\n要素", "chapter": 3}, {"no": 108, "page": 35, "type": "穴埋め", "question": "・各期間の利益は収益 - 費用 = 利益という（1）______________に従い、収益から費用を控\n 除する方法で算定することが要求されている。\n・会計の基本概念の位置付けや利益測定の方式に関して、次の2 つの見解がある。1.収益と費用を\n 会計の中心概念として理解し、両者の差額をもって利益を測定する（2）______________と2.\n 資産と負債を中心的な基礎概念として位置付け、両者の差額として導出される純資産額の期中変\n 化分が利益であるとする（3）______________である。\n・わが国の企業会計原則は、貸借対照表原則よりも損益計算書原則を先に配置し、もっぱら損益法\n 等式での利益測定のみを規定している点で、（4）______________に立脚した会計基準である\n といえる。\n・（5）______________とは純利益を増加させる項目であり、原則として資産の増加や負債の減\n 少を伴って生じるものとして定義される。逆に（6）______________とは、純利益を減少させる項\n 目であり原則として資産の減少や負債の増加を伴って生じるものである。\n・収益と費用は、企業活動に伴って連続的・反復的に生じているから、両者の差額として利益を測定す\n るには、個々の収益と費用の計上時点を特定しなければならない。この判断は、収益と費用がいつ生じ\n たものとして認識するかを決定するという意味で、（7）______________の問題とよばれる。これに\n 対し、認識された収益と費用に金額を割当てる側面は（8）______________の問題とよばれ\n る。", "answer": "(1)損益法等式\n(2)収益費用アプローチ\n(3)資産負債アプローチ  4\n(4)収益費用アプローチ\n(5)収益\n(6)費用\n(7)認識\n(8)測定", "topic": "収益・\n費用の\n認識と\n測定", "chapter": 4}, {"no": 109, "page": 35, "type": "穴埋め", "question": "わが国の企業会計原則は、貸借対照表原則よりも損益計算書原則を先に配置し、もっぱら損益法等\n 式での利益測定のみを規定している点で、(1)______________に立脚した会計基準であるといえ\n る。", "answer": "(1)収益費用アプローチ", "topic": "収益・\n費用の\n認識と\n測定", "chapter": 4}, {"no": 110, "page": 35, "type": "穴埋め", "question": "収益と費用を、それぞれに関連する現金収入と現金支出の時点において認識し、その期間の損益計算\n 書に計上する利益計算方法を(1)______________主義会計という。", "answer": "(1)現金", "topic": "現金主\n義会計", "chapter": 4}, {"no": 111, "page": 36, "type": "誤答選\n択", "question": "（Ａ）現金主義会計は、収益と費用を、それぞれに関連する現金収入と現金支出の時点において認\n 識し、その期間の損益計算書に計上する利益計算方法である。\n（Ｂ）発生主義会計のもとでは、収益は現金収入の時点とは無関係に、経営活動の成果と関連する\n 重要な事実が生じた時点で認識される。\n（Ｃ）発生主義会計は、実現原則、発生原則および対応原則という３つの基本原則に支えられてい\n る。売上高および売上原価は、発生原則に基づいて計上される。\n（Ｄ）資産評価基準のうち純実現可能価額は、資産の現在の売価から、販売費等の付随費用を控\n 除して算定することから、正味売却価額ともよばれる。", "answer": "C\n・売上高などの収益は\n 実現原則に従って認\n識", "topic": "現金主\n義会計", "chapter": 4}, {"no": 112, "page": 36, "type": "穴埋め", "question": "・収益は現金収入の時点をまたず、債権が発生した時点で計上し、逆に費用は現金支出だけでなく債\n 務発生を根拠として計上するような認識基準を(1)______________主義という。これは現金主義\n と発生主義の間の中間的な形態であることから、(2)______________主義ともよばれる。\n・(3)______________主義会計のもとでは、収益は現金収入の時点とは無関係に、経営活動の\n 成果と関連する重要な事実が生じた時点で認識される。発生主義会計における収益・費用の測定の\n ために、過去・現在・将来の収入額や支出額を用いる方法は(4)______________または収支的\n 評価の基準とよばれている。", "answer": "(1)権利義務確定\n(2)半発生\n(3)発生\n(4)収入支出額基準", "topic": "発生主\n義会計", "chapter": 4}, {"no": 113, "page": 36, "type": "誤答選\n択", "question": "（Ａ）現金主義会計は、収益と費用を、それぞれに関連する現金収入と現金支出の時点において認\n 識し、その期間の損益計算書に計上する利益計算方法である。\n（Ｂ）発生主義会計と比べた場合の現金主義会計の最大の長所は、経済活動の成果を表す収益\n と、それを得るために費やされた犠牲としての費用を、厳密に対応づけることを通じて、各会計期問の経\n 営成績がよりいっそう適切に測定されるようになる点にある。\n（Ｃ）発生原則によれば、収益と費用の計上は、現金収支の事実によってではなく、それらの収益や費\n 用の「発生の事実」に基づいて行われなければならない。\n（Ｄ）対応原則における収益と費用の対応関係を認識する仕方には、大別して個別的対応と期間\n 的対応の2 つの方式がある。", "answer": "B\n・発生と現金が逆", "topic": "発生主\n義会計", "chapter": 4}, {"no": 114, "page": 37, "type": "穴埋め", "question": "・発生主義会計は、(1)______________原則・(2)______________原則および\n (3)______________原則という３つの基本原則に支えられている。売上高などの収益は、\n (1)______________原則に従って認識される。他方、売上原価・販売費・支払利息などの各種\n の費用は、(2)______________原則に基づいて計上される。そして最後に、\n (3)______________原則により、収益と費用を対応づけた差額として各期間の利益が算定され\n るのである。\n・現金主義会計と比べた場合の、発生主義会計の最大の長所は、経済活動の成果を表す収益と、そ\n れを得るために費やされた犠牲としての費用を、厳密に対応づけることを通じて、各会計期間の経営成\n 績がよりいっそう適切に測定されるようになる点にある。このような利益計算の基礎をなすのが\n (4)______________である。収益と費用の対応関係を認識する仕方には、大別して2 つの方式\n がある。1 つは製品の売上高とその売上原価のように、特定の資産を媒介として収益と費用の対応関\n 係を直接的に認識する方式である。この方式を(5)______________という。第2 の方式として、\n 同一期間に計上された収益と費用は、それらがその期間の経済活動を通じて対応しているものと考え、\n 会計期間を媒介とした対応関係が認識されることになる。この第2 の方式を(6)______________\n という。", "answer": "(1)実現\n(2)発生\n(3)対応\n(4)対応原則\n(5)個別的対応\n(6)期間的対応", "topic": "対応原\n則", "chapter": 4}, {"no": 115, "page": 38, "type": "誤答選\n択", "question": "（Ａ）現金主義会計は、収益と費用を、それぞれに関連する現金収入と現金支出の時点において認\n 識し、その期間の損益計算書に計上する利益計算を行う会計である。\n（Ｂ）半発生主義会計は、収益は売掛金などの債権が発生した時点では計上せず、現金収入の時\n 点において認識する一方で、費用は現金支出だけでなく、買掛金などの債務発生をも根拠として計上\n するような収益・費用の認識基準に基づいた会計である。\n（Ｃ）発生主義会計は、実現原則・発生原則および対応原則という３つの基本原則に支えられてい\n る。売上高などの収益は、実現原則に従って認識される。他方、売上原価・販売費・支払利息などの\n 各種の費用は、発生原則に基づいて計上される。\n（Ｄ）貨幣性資産とは、売掛金や受取手形のように、販売を経て事業投資の回収過程にある項目、\n および余剰資金の運用としての保有株式や貸付金など、最終的に収入となって貨幣を増加させる資産\n をいう。これに対し、機械や商品のように生産・販売を経て最終的に費用となる項目は費用性資産とよ\n ばれる。", "answer": "B\n・半発生主義では収益\n は現金収入の時点を\n またず債権発生時点\n で計上し、費用は現金\n 支出だけでなく債務発\n 生を根拠として計上す\n る", "topic": "対応原\n則", "chapter": 4}, {"no": 116, "page": 38, "type": "正答選\n択", "question": "発生主義会計で収益と費用の対応関係を認識する仕方には、大きく分けると、\nア．個別的対応\nイ．総合的対応\n ウ．期間的対応がある。\n エ．すべて誤り", "answer": "ア,ウ\n・対応関係は個別的対\n 応と期間的対応の2\n 方式のみである", "topic": "対応原\n則", "chapter": 4}, {"no": 117, "page": 39, "type": "誤答選\n択", "question": "（Ａ）収益と費用の対応関係を認識する仕方には大別して２つの方式があり、その１つは、製品の売\n 上高とその売上原価のように、特定の財貨を媒介として収益と費用の対応関係を直接的に認識する\n 方式である。これを個別的対応という。\n（Ｂ）収益と費用の対応関係を認識する仕方には大別して２つの方式があり、その１つは、同一期間\n に計上された収益と費用は、それらがその期間の経済活動を通じて対応しているものと考え、会計期間\n を媒介とした対応関係が認識されることになる方式である。この方式を期間的対応という。\n（Ｃ）発生原則によれば、収益と費用の計上は、現金収支の事実によってではなく、それらの収益や費\n 用の発生の事実に基づいて行われなければならない。\n（Ｄ）実現原則によれば、収益は次の２つの条件が満たされた時点で「実現」したものとして判断さ\n れ、計上される。（ａ）財貨やサービスが相手に引き渡されたこと。（ｂ）対価として、現金・売掛金\n などの費用性資産が受け取られたこと。", "answer": "D\n・費用性→貨幣性", "topic": "対応原\n則", "chapter": 4}, {"no": 118, "page": 39, "type": "正答選\n択", "question": "発生主義会計は、\nア．実現原則\n イ．発生原則\n ウ．対応原則という３つの基本原則に支えられている\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "対応原\n則", "chapter": 4}, {"no": 119, "page": 39, "type": "正答選\n択", "question": "収益・費用の認識に関する基本的な考え方には、現金主義と発生主義があり、それぞれの考え方に基\n づいて行われる会計を現金主義会計および発生主義会計という。そのうち発生主義会計は、\nア．権利義務確定原則\nイ．収入支出額原則\n ウ．実現可能性原則という3 つの基本原則に支えられている。\n エ．すべて誤り", "answer": "エ\n・発生主義会計におけ\n る3 つの基本原則は\n実現原則、発生原\n 則、対応原則", "topic": "対応原\n則", "chapter": 4}, {"no": 120, "page": 40, "type": "", "question": "・(1)______________は発生主義会計を支える最も基本的な原則であり、わが国の企業会計原\n 則でも「すべての費用及び収益は、...その発生した期間に正しく割当てられるように処理しなければなら\n ない」として、この原則が明示されている。一定の契約に基づいて継続的に役務を授受する取引では、\n 発生原則の適用は時間の経過を基準とした収益・費用の認識となって現れる。なお、これに付随して\n 貸借対照表に計上されることになる(2)______________収益・(3) ______________費用・\n 前受(4) ______________・前払(5)______________の4 項目は、\n (6)______________とよばれている。", "answer": "(1)発生原則\n(2)未収\n(3)未払\n(4)収益\n(5)費用\n(6)経過勘定項目", "topic": "発生原\n則", "chapter": 4}, {"no": 121, "page": 40, "type": "穴埋め", "question": "Ａ社（決算日3 月31 日）はＢ社（決算日3 月31 日）に対し、2024 年12 月31 日に余剰\n 資金500,000,000 円を年利率4％、期間１年、利息は元金返済時に後払いという条件で貸し付\n けた。一方、Ｃ社（決算日3 月31 日）はＤ社（決算日3 月31 日）に対し、2024 年12 月\n 31 日に余剰資金500,000,000 円を年利率4％、期間１年の条件で貸し付けることとし、１年分\n の利息20,000,000 円を差し引いた残額を払い込んだ。各社が2025 年3 月31 日に行う会計\n 処理は次のとおりである。（単位：円）\n\n（Ａ）社の仕訳（借）ＸＸＸＸ5,000,000（貸）ＸＸＸＸ5,000,000\n（Ｂ）社の仕訳（借）ＸＸＸＸ5,000,000（貸）(1)______________5,000,000\n（Ｃ）社の仕訳（借）(2)______________5,000,000（貸）ＸＸＸＸ5,000,000\n（Ｄ）社の仕訳（借）ＸＸＸＸ5,000,000（貸）ＸＸＸＸ5,000,000", "answer": "(1)未払利息\n(2)前受利息", "topic": "発生原\n則", "chapter": 4}, {"no": 122, "page": 41, "type": "誤答選\n択", "question": "（Ａ）収益と費用の対応関係を認識する仕方には大別して、特定の資産を媒介として収益と費用の\n 対応関係を直接的に認識する個別的対応と、同一期間に計上された収益と費用はその期間の経済\n 活動を通じて対応しているものと考え、会計期間を媒介とした対応関係を認識する期間的対応の２つ\n の方式がある。\n（Ｂ）発生原則によれば、収益と費用の計上は、現金収支の事実によってではなく、それらの収益や費\n 用の発生の事実に基づいて行われなければならない。たとえば、生産設備の使用による経済的価値の\n 消費を反映して減価償却を行うのは発生原則に従った会計処理である。\n（Ｃ）実現原則によれば、収益は次の（a）および（b）の条件が満たされた時点で「実現」したもの\n として判断され、計上される。（a）企業が顧客への財やサービスの移転を通じて、履行義務を充足し\n たこと。これに伴って（b）移転した財やサービスと交換に、企業が権利を有する対価を獲得したこと。\n（Ｄ）発生主義会計における収益および費用の測定のために、過去・現在・将来の収入額や支出額\n を用いる方法は、原価配分の原則または収支的評価の基準とよばれている。", "answer": "D\n・原価配分の原則→収\n入支出額基準", "topic": "発生原\n則", "chapter": 4}, {"no": 123, "page": 41, "type": "正答選\n択", "question": "経過勘定項目には、\nア．未払費用\n イ．前受収益\n ウ．前払費用が含まれる。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・経過勘定項目：\n未収費用、未払費\n 用、前受収益、前払\n費用", "topic": "発生原\n則", "chapter": 4}, {"no": 124, "page": 41, "type": "正答選\n択", "question": "一定の契約に基づいて継続的に役務を授受する取引では、発生原則の適用は、時間の経過を基準と\n した収益・費用の認識となって現れる。なお、これに付随して貸借対照表に計上されることになる経過\n 勘定項目には、\n ア．未払金\n イ．未収収益\n ウ．前受収益が含まれる。\n エ．すべて誤り", "answer": "イ,ウ\n・経過勘定項目：\n未収費用、未払費\n 用、前受収益、前払\n費用", "topic": "発生原\n則", "chapter": 4}, {"no": 125, "page": 42, "type": "正答選\n択", "question": "一定の契約に基づいて継続的に役務を授受する取引では、発生原則の適用は、時間の経過を基準と\n した収益・費用の認識となって現れる。なお、これに付随して貸借対照表に計上されることになる経過\n 勘定項目には、\nア．前払費用\n イ．未払金\n ウ．前受金が含まれる。\n エ．すべて誤り", "answer": "ア\n・経過勘定項目：\n未収費用、未払費\n 用、前受収益、前払\n費用", "topic": "発生原\n則", "chapter": 4}, {"no": 126, "page": 42, "type": "穴埋め", "question": "・実現原則によれば、収益は次の２つの条件が満たされた時点で「実現」したものとして判断され、計上\n される。\n1.企業が顧客への財のサービスの移転を通じて、(1)______________を充足したこと。\n2.移転した財やサービスと交換に、企業が(2)______________を有する対価を獲得したことであ\n る。通常、この対価は現金預金や売掛金などの(3)______________の形態をとる。\n\n・機械や商品のように生産・販売を経て最終的に費用となる項目は、(4)______________とよばれ\n る。\n\n・時価変動を利用した短期の利殖目的で保有する上場株式が値上がりした場合は、売却のための引\n 渡しが行われていなくても、値上がり分を運用収益として計上するが、これが正当化されるのは、企業が\n 事業に影響を及ぼすことなく、いつでも売却によって値上がり益を実現させることが可能だからである。こ\n の考え方は、(5)______________とよばれることがある。", "answer": "(1)履行義務\n(2)権利\n(3)貨幣性資産\n(4)費用性資産\n(5)実現可能原則", "topic": "実現原\n則", "chapter": 4}, {"no": 127, "page": 42, "type": "穴埋め", "question": "時価変動を利用した短期の利殖目的で保有する上場株式が値上がりした場合は、売却のための引渡\n しが行われていなくても、値上がり分を運用収益として計上するが、これが正当化されるのは、企業が事\n 業に影響を及ぼすことなく、いつでも売却によって値上がり益を実現させることが可能だからである。この\n 考え方は、(1)______________とよばれることがある。", "answer": "(1)実現可能性原則", "topic": "実現原\n則", "chapter": 4}, {"no": 128, "page": 43, "type": "正答選\n択", "question": "実現原則によれば、収益は2 つの条件（a）財貨やサービスが相手に引き渡されたこと、（b）対価と\n して、貨幣性資産が受け取られたことが満たされた時点で「実現」したものと判断される。なお、この貨幣\n 性資産には、\n ア．現金\n イ．売掛金\n ウ．受取手形が含まれる。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "実現原\n則", "chapter": 4}, {"no": 129, "page": 43, "type": "穴埋め", "question": "・過去の取引または事象の結果として、財務報告の主体が支配している経済的資源を\n (1)______________という。また過去の取引または事象の結果として財務報告の主体が支配して\n いる経済的資源を放棄もしくは引き渡す義務、またはその同等物を(2)______________という。\n 定義を満たして資産・負債となった項目については、次にその(3)______________が問題となる。\n 資産評価基準のうち、取得原価・取替原価および純実現可能価額を採用した場合に、いずれの資産\n 評価基準を採用した場合でも、全会計期間を通した営業循環全体の(4)______________は等\n しくなる。", "answer": "(1)資産\n(2)負債\n(3)評価\n(4)合計利益", "topic": "資産評\n価の諸\n基準", "chapter": 4}, {"no": 130, "page": 43, "type": "誤答選\n択", "question": "（Ａ）純実現可能価額が採用されると、資産はその取得時点でただちに売却時価で評価されることか\n ら、取得に要した支出額との差額が、取得時点で利益として計上される。また、資産保有中の売却時\n 価の変動額も、損益として認識されるため、実際の販売時点で利益が計上されることはない。\n（Ｂ）取得原価は、購買市場で資産が取得された過去の時点での支出額であり、過去の歴史的な\n 事実に基づくことから、歴史的原価ともよばれる。取得原価で資産が評価される場合、資産が売却市\n 場で販売されるまで損失が計上されることはない。\n（Ｃ）取替原価基準は、これに基づいて算定された操業利益の金額が、企業の物的資本を維持した\n うえでの分配可能額を表すという長所がある一方、資産の中には取替原価の推定が困難な項目が多\n 数あり、それらの資産の評価額が主観的になりやすいという欠点がある。\n（Ｄ）資産評価基準のうち、取得原価・取替原価および純実現可能価額を採用した場合に、いずれ\n の資産評価基準を採用した場合でも、全会計期間を通した営業循環全体の合計利益は等しくなる。", "answer": "B\n・棚卸評価損や減損損\n 失によって損失が計上\n されることがある", "topic": "資産評\n価の諸\n基準", "chapter": 4}, {"no": 131, "page": 44, "type": "誤答選\n択", "question": "（Ａ）純実現可能価額は、資産の現在の売価から、販売費等の付随費用を控除して算定することか\n ら、正味売却価額ともよばれる。\n（Ｂ）原価基準のもとでは、事業用資産は、いったん取得原価で資産計上されたあと、その消費に応\n じて各事業年度の費用として配分されなければならない。この処理原則を費用配分の原則または原価\n 配分の原則という。\n（Ｃ）余剰資産の運用として保有する所定の金融資産を評価する際に用いられる時価には、観察可\n 能な市場価格だけでなく、合理的に算定された将来キャッシュ・フローの割引現在価値も、公正な評価\n 額として含まれる。このことから時価に代えて、公正価値という用語が用いられることもある。\n（Ｄ）資産・負債の時価の算定に用いられるインプットは、優先順位つきで３つのレベルに分類される。\n 複数のレベルのものを併用したときは、優先順位が最も高いレベルに属するものとする。", "answer": "D\n・高い→低い", "topic": "資産評\n価の諸\n基準", "chapter": 4}, {"no": 132, "page": 44, "type": "誤答選\n択", "question": "（Ａ）資産は、企業にキャッシュ・フローをもたらす能力をもった経済的資源である。資産がもつそのよう\n な能力は、用役潜在力とよばれる。\n（Ｂ）取替原価は、保有中の資産と同じものを現在の購買市場で取得して取替えるのに要する支出\n 額である。現時点での資産の再調達を仮定した場合の評価額であることから、再調達原価ともよばれ\n る。\n（Ｃ）原価基準のもとでは、棚卸資産や有形固定資産のような事業用資産は、いったん取得原価で\n 資産計上されたあと、その消費に応じて各事業年度の費用として配分されなければならない。この処理\n 原則を比例配分の原則という。\n（Ｄ）資産評価基準の１つである時価には、観察可能な市場価格だけでなく、合理的に算定された\n 将来キャッシュ・フローの割引現在価値も、公正な評価額として含まれる。このことから時価に代えて、公\n 正価値という用語が用いられることもある。", "answer": "C\n・比例→費用", "topic": "資産評\n価の諸\n基準", "chapter": 4}, {"no": 133, "page": 45, "type": "誤答選\n択", "question": "（Ａ）企業会計基準の公開草案である「公正価値測定及びその開示に関する会計基準（案）\n （Ｈ22 年7 月9 日公表）」では、時価と公正価値の間に実質的な差異はないことから、他の会計\n 基準における時価は、公正価値と読み替えるものとしている。\n（Ｂ）純実現可能価額は正味売却価額ともよばれる。\n（Ｃ）資産がもつ将来時点で企業にキャッシュ・フローをもたらすような能力を用役潜在力とよぶ。\n（Ｄ）企業が保有する資産のうち、事業用資産については、原則として時価で評価される。", "answer": "D\n・時価→取得原価", "topic": "資産評\n価の諸\n基準", "chapter": 4}, {"no": 134, "page": 45, "type": "誤答選\n択", "question": "（Ａ）現金主義会計がもつ欠陥のいくらかは、現金収支だけでなく債権・債務の発生をも基礎として、\n 収益や費用が計上されるように拡大することを通じて、改善することができる。たとえば売上収益は、現\n 金収入の時点をまたず、売掛金などの債権が発生した時点で計上し、逆に費用は現金支出だけでな\n く、買掛金などの債務発生をも根拠として計上すればよい。このような収益・費用の認識基準を発生主\n 義という。\n（Ｂ）資産評価基準の１つである取替原価は、保有中の資産と同じものを現在の購買市場で取得し\n て取替えるのに要する支出額である。現時点での資産の再調達を仮定した場合の評価額であることか\n ら、再調達原価ともよばれる。\n（Ｃ）原価基準のもとでは、棚卸資産や有形固定資産のような事業用資産は、いったん取得原価で\n 資産計上されたあと、その消費に応じて各事業年度の費用として配分されなければならない。この処理\n 原則を費用配分の原則という。\n（Ｄ）企業会計基準の公開草案「公正価値測定及びその開示に関する会計基準（案）」では、公\n 正価値とは、測定日において市場参加者間で秩序ある取引が行われた場合に、資産の売却によって\n 受取るであろう価格、または負債の移転のために支払うであろう価格（出口価格）と定義されている。", "answer": "A\n・発生→権利義務確定", "topic": "資産評\n価の諸\n基準", "chapter": 4}, {"no": 135, "page": 46, "type": "誤答選\n択", "question": "（Ａ）わが国の「企業会計原則」は、資産と負債を中心的な基礎概念として位置づけ、両者の差額と\n して導出される純資産額の期中変化分が利益であるとする資産負債アプローチに立脚した会計基準\n であるといえる。\n（Ｂ）資産とは、過去の取引または事象の結果として、財務報告の主体が支配している経済的資源\n をいう。また負債とは、過去の取引または事象の結果として、財務報告の主体が支配している経済的\n 資源を放棄もしくは引き渡す義務、またはその同等物をいう。\n（Ｃ）企業が保有する資産のうち、生産や販売など本来の企業活動に用いる事業用資産について\n は、取得原価が原則的な資産評価基準として採用される。他方、余剰資金の運用として保有する所\n 定の金融資産は、現在の市場価格を中心とした時価で評価される。\n（Ｄ）取得原価は、購買市場で資産が取得された過去の時点での支出額である。過去の歴史的な\n 事実に基づくことから、歴史的原価ともよばれる。", "answer": "A\n・わが国の企業会計原\n 則は収益と費用を会\n 計の中心概念とした収\n 益費用アプローチに立\n 脚した会計基準である", "topic": "資産評\n価の諸\n基準", "chapter": 4}, {"no": 136, "page": 46, "type": "穴埋め", "question": "・（1）______________は、購買市場で資産が取得された過去の時点での支出額であり、過去\n の歴史的な事実に基づくことから、（2）______________ともよばれる。取得原価で資産が評価\n される場合、資産が売却市場で販売されるまで損失が計上されることはない。", "answer": "(1)取得現価\n(2)歴史的原価", "topic": "取得現\n価", "chapter": 4}, {"no": 137, "page": 46, "type": "穴埋め", "question": "・保有中の資産と同じものを現在の購買市場で取得して取替えるのに要する支出額を（1）\n ______________という。現時点での資産の再調達を仮定した場合の評価額であることから、\n （2）______________ともよばれる。これに基づいて算定された操業利益の金額が、企業の物的\n 資本を維持したうえでの（3）______________を表すという長所がある一方、資産の中には取替\n 原価の推定が困難な項目が多数あり、それらの資産の評価額が（4）______________になりや\n すいという欠点がある。", "answer": "(1)取替現価\n(2)再調達\n(3)分配可能額\n(4)主観的", "topic": "取替現\n価", "chapter": 4}, {"no": 138, "page": 46, "type": "穴埋め", "question": "・（1）______________は取替現価と並ぶ時価評価の基準である。純実現可能価額は、資産の\n 現在の売価から、販売費等の付随費用を控除して算定することから、（2）______________とも\n よばれる。純実現可能価額が採用されると、資産はその取得時点でただちに売却時価で評価されるこ\n とから、取得に要した支出額との差額が、取得時点で（3）______________として計上される。\n また、資産保有中の売却時価の変動額も、損益として認識されるため、実際の（4）\n           時点で利益が計上されることはない", "answer": "(1)純実現可能価額\n(2)正味売却価額\n(3)利益\n(4)販売", "topic": "順実現\n可能価\n額", "chapter": 4}, {"no": 139, "page": 47, "type": "穴埋め", "question": "資産がもつ将来時点で企業にキャッシュ・フローをもたらすような能力を(1)______________とよぶ。\n 貸借対照表は決算日現在で作成されるから、(2)______________で資産を評価するには、将来\n のキャッシュ・フローを予測したうえで、現時点での価値を表すように割引計算を行わなければならない。\n 割引現在価値を用いて算定される利益は、新古典派の経済学者が採用する利益概念に合致するこ\n とから、しばしば(3)______________とよばれている。", "answer": "(1)用役潜在力\n(2)割引現在価値\n(3)経済学的利益", "topic": "割引現\n在価値", "chapter": 4}, {"no": 140, "page": 48, "type": "穴埋め", "question": "・わが国の現行の会計基準は、資産を2 種類に分類したうえで、取得原価と時価による評価を次のよう\n に区分して適用している。この状況は(1)______________とよばれる。企業が保有する資産のう\n ち、生産や販売など本来の企業活動に用いる(2)______________については、取得原価が原則\n 的な資産評価基準として採用される。他方、余剰資金の運用として保有する所定の\n (3)______________は、現在の市場価格を中心とした(4)______________で評価される。\n この時価には観察可能な市場価格だけでなく、合理的に算定された将来キャッシュ・フローの割引現在\n 価値も、公正な評価額として含まれる。このことから時価に代えて、(5)______________という用\n 語が用いられることもある。\n・(6)______________のもとでは、棚卸資産や有形固定資産のような事業用資産は、いったん取\n 得原価で資産計上されたあと、その消費に応じて各事業年度の費用として配分されなければならな\n い。この処理原則を(7)______________配分の原則または(8)______________配分の原\n 則という。\n・会計基準で時価とは、算定時において市場参加者間で秩序ある取引が行われると想定した場合に、\n 資産の(9)______________によって受取る価格、または負債の(10)______________のため\n に支払う価格と定義されている。資産・負債の時価はインプットと評価技法を用いて算定する。\n (11)______________とは、時価の算定で用いる仮定をいい、相場価格・金利・価格変動性など\n のデータを意味する。他方、(12)______________には、マーケットアプローチやインカムアプローチ\n がある。\n・資産・負債の時価の算定に用いられるインプットは、優先順位つきで３つのレベルに分類される。複数\n のレベルのものを併用したときは、優先順位が最も(13)______________レベルに属するものとす\n る。レベル１のインプットは、時価の算定日において企業が入手できる活発な市場での同一資産・負債\n の(14)______________そのもの（調整されていないもの）である。レベル２のインプットは、レベル\n １以外の相場価格で、直接または間接的に(15)______________な評価額をいい、類似資産・\n 負債の相場価格や観察可能な市場データで裏付けられた評価額が含まれる。レベル３のインプット\n は、観察可能な市場データは入手できないが、入手できる最良の情報に基づいて算定された、市場参\n 加者が価格設定に用いるであろう(16)          を反映した評価額である", "answer": "(1)混合的測定\n(2)事業用資産\n(3)金融資産\n(4)時価\n(5)公正価値\n(6)原価基準\n(7)費用\n(8)原価\n(9)売却\n(10)移転\n(11)インプット\n(12)評価技法\n(13)低い\n(14)相場価格\n(15)観察可能\n(16)仮定", "topic": "現行の\n資産評\n価基準", "chapter": 4}, {"no": 141, "page": 49, "type": "誤答選\n択", "question": "（Ａ）時価とは、算定時において市場参加者間で秩序ある取引が行われると想定した場合に、新規\n の資産取得や負債引受のための取引における価格と定義されている。\n（Ｂ）時価の算定に用いるインプットのうちレベル１のインプットは、時価の算定日において企業が入手\n できる活発な市場での同一資産・負債の相場価格そのもの（調整されていないもの）である。\n（Ｃ）時価の算定に用いるインプットのうちレベル２のインプットは、レベル１以外の相場価格で、直接\n または間接的に観察可能な評価額をいい、類似資産・負債の相場価格や観察可能な市場データで\n 裏付けられた評価額が含まれる。\n（Ｄ）時価の算定に用いるインプットのうちレベル３のインプットは、観察可能な市場データは入手でき\n ないが、入手できる最良の情報に基づいて算定された、市場参加者が価格設定に用いるであろう仮定\n を反映した評価額である。", "answer": "A\n・入口価格ではなく出口\n価格", "topic": "現行の\n資産評\n価基準", "chapter": 5}, {"no": 142, "page": 49, "type": "穴埋め", "question": "・流動資産たる現金預金と有価証券の合計は、ただちに支払手段として利用できる性質を有するので、\n (1)______________とよばれることがある。また、これに受取手形と売掛金を加えた４資産を総称\n して、(2)______________という。\n\n・余剰資金の運用成果には、インカム・ゲインとキャピタル・ゲインがある。(3)______________とは預\n 金や貸付金から生じる受取利息、及び株式から得られる受取配当金をいう。他方、\n (4)______________や(5)______________は、有価証券の売却損益と評価損益から構成\n される。", "answer": "(1)手元流動性\n(2)当座資産\n(3)インカム・ゲイン\n(4)キャピタル・ゲイン\n(5)キャピタル・ロス", "topic": "資金運\n用活動\nの資産\nと収益", "chapter": 5}, {"no": 143, "page": 49, "type": "穴埋め", "question": "流動資産たる現金預金と有価証券の合計は、ただちに支払手段として利用できる性質を有するので、\n 手元流動性とよばれることがある。また、これに(1)______________と売掛金を加えた４資産を総\n 称して、当座資産という。", "answer": "(1)受取手形", "topic": "資金運\n用活動\nの資産\nと収益", "chapter": 5}, {"no": 144, "page": 50, "type": "正答選\n択", "question": "手元流動性には、\nア．受取手形\n イ．売掛金\n ウ．流動資産たる有価証券が含まれる。\n エ．すべて誤り", "answer": "ウ\n・手元流動性はただちに\n 支払手段として利用で\n きる性質を有するもの", "topic": "資金運\n用活動\nの資産\nと収益", "chapter": 5}, {"no": 145, "page": 50, "type": "穴埋め", "question": "現金には、単に紙幣と通貨だけでなく、金銭と(1)______________をもつものが含まれる。たとえば\n 得意先から入手した(2)______________でまだ銀行に預入していないものや、すでに期限の到来\n した公社債の(3)______________が含まれる。ただし(4)______________は、期日が到来\n するまで換金できない点で手形と同じであるから、受取手形として処理する。預金のうち、決算日の翌\n 日から起算して(5)______________年以内に期限が到来するものは、流動性資産として取扱わ\n れる。それ以外の長期の預金は固定資産のうちの(6)______________に分類される。したがって\n 当初の預入れ期間が1 年を超える預金であっても、1 年以内に期限が到来するようになったものは\n (7)______________である。", "answer": "(1)同一の性質\n(2)当座小切手\n(3)利札\n(4)先日付小切手\n(5)1\n(6)投資その他の資産\n(7)流動資産", "topic": "現金預\n金の範\n囲", "chapter": 5}, {"no": 146, "page": 50, "type": "正答選\n択", "question": "流動資産の１項目である「現金及び預金」には、たとえば、\n （Ａ）決算日の翌日から起算して期限が６か月後に到来する預金\n （Ｂ）すでに期限の到来した公社債の利札\n （Ｃ）先日付小切手が含まれる。\n （Ｄ）全て誤り", "answer": "A,B\n・先日付小切手は期日\n が到来するまで換金で\n きない点で手形と同じ\n であるから受取手形と\n して処理する", "topic": "現金預\n金の範\n囲", "chapter": 5}, {"no": 147, "page": 50, "type": "穴埋め", "question": "・日常的な支払に充てるための前渡金を小口現金といい、その金額が一定額に固定されている場合を、\n (1)______________という。\n・万一、現金の手許在高が帳簿残高と一致しないときは(2)______________を設けて、まず帳簿\n 残高を手許在高に一致させる。\n・月末や決算期末には、銀行から残高証明書を入手して、自社の記録と突き合わせる。もし不一致が\n あれば、(3)______________を作成して不一致の原因を明らかにし、必要に応じて自社の会計\n 記録を修正する", "answer": "(1)定額資金前渡制\n(2)現金過不足勘定\n(3)銀行勘定調整表", "topic": "現金預\n金の管\n理", "chapter": 5}, {"no": 148, "page": 51, "type": "穴埋め", "question": "・会計上で有価証券とは、金融商品取引法（2 条1 項）に列挙された証券をいい、株式や新株予\n 約権証書などの(1)______________証券、国債・地方債・社債などの(2)______________\n 証券、および証券投資信託や貸付信託の(3)______________証券などが、その代表的なもので\n ある。株式会社以外の会社や各種の協同組合に対して出資した額は、有価証券ではなく\n (4)______________として取り扱われる。\n・会社がいったん発行した自社の株式を取得して保有しているとき、その株式を\n (5)______________または金庫株という。自己株式は、資金調達時に発行した株式の買戻しで\n あり、資本の減少を意味するから資産とせず、貸借対照表の(6)______________から控除する形\n 式で記載する。\n・有価証券は、(7)______________や(8)______________の有無などによって、流動資産た\n る有価証券と固定資産たる有価証券に分類される。流動資産に属するのは、\n (9)______________の変動により利益を得ることを目的として保有する有価証券、および\n (10)______________年内に満期の到来する社債その他の債券だけであり、これ以外の有価証\n 券は固定資産に属する。\n・有価証券のうち、流動資産に分類されたものは貸借対照表に(11)______________の名称で、\n また固定資産に分類されたものは(12)______________の名称で記載する。投資有価証券のう\n ち関係会社の株式と社債については、それぞれ(13)______________および\n (14)______________として、別科目で掲記しなければならない。", "answer": "(1)持分\n(2)負債性\n(3)受益\n(4)出資金\n(5)自己株式\n(6)株主資本\n(7)所有目的\n(8)市場価格\n(9)時価\n(10)1\n(11)有価証券\n(12)投資有価証券\n(13)関係会社株式\n(14)関係会社社債", "topic": "有価証\n券の範\n囲と区\n分", "chapter": 5}, {"no": 149, "page": 51, "type": "正答選\n択", "question": "会計上で有価証券とは、金融商品取引法（2 条1 項）に列挙された証券をいい、\n ア．株式や新株予約権証書などの持分証券\n イ．国債・地方債・社債などの負債性証券\n ウ．株式会社以外の会社や各種の協同組合に対して出資した出資金の３つがその代表的なもので\n ある。\n エ．すべて誤り", "answer": "ア,イ\n・ウは出資金として取り\n 扱われる", "topic": "有価証\n券の範\n囲と区\n分", "chapter": 5}, {"no": 150, "page": 52, "type": "穴埋め", "question": "・購入した有価証券の取得価額は、購入代価に、証券会社へ支払う仲介手数料等の\n (1)______________を加算して決定する。すでに保有しているのと同じ銘柄の有価証券を、帳簿\n 価額とは異なった価額で取得したときは、総平均法や移動平均法などの(2)______________を\n 適用して、単位当たりの新たな取得原価を算定する。\n・有価証券のような金融商品は、売買契約の締結日に取引を記録する(3)______________で会\n 計処理するのが原則である。ただし、(4)______________によることもでき、この基準のもとでは、\n 決算日までの時価変動による損益だけが先に認識され、有価証券の移転は受渡日に記録される。", "answer": "(1)付随費用\n(2)平均原価法\n(3)約定日基準\n(4)修正受渡基準", "topic": "有価証\n券の取\n得価額", "chapter": 5}, {"no": 151, "page": 52, "type": "誤答選\n択", "question": "（Ａ）会計上で有価証券とは金融商品取引法に列挙された証券をいい、株式や新株予約権証書な\n どの持分証券、証券投資信託や貸付信託の受益証券などが含まれる。株式会社以外の会社や各種\n の協同組合に対して出資した額は、有価証券ではなく出資金として取り扱われる。\n（Ｂ）有価証券のうち、流動資産に分類されたものは貸借対照表に「有価証券」の名称で、また固定\n 資産に分類されたものは「投資有価証券」の名称で記載する。投資有価証券のうち関係会社の株式\n と社債については、それぞれ「関係会社株式」および「関係会社社債」として、別科目で掲記しなければ\n ならない。\n（Ｃ）購入した有価証券の取得価額は、購入代価に、証券会社へ支払う仲介手数料等の付随費\n 用を加算して決定する。すでに保有しているのと同じ銘柄の有価証券を、帳簿価額とは異なった価額\n で取得したときは、総平均法や移動平均法などの平均原価法を適用して、単位当たりの新たな取得\n 原価を算定する。\n（Ｄ）有価証券のような金融商品は、売買契約の締結日に取引を記録する約定日基準で会計処理\n するのが原則である。ただし、修正約定日基準によることもでき、この基準のもとでは、決算日までの時\n 価変動による損益だけが先に認識され、有価証券の移転は受渡日に記録される。", "answer": "D\n・修正約定日→修正受\n渡日", "topic": "有価証\n券の取\n得価額", "chapter": 5}, {"no": 152, "page": 53, "type": "誤答選\n択", "question": "（Ａ）有価証券は、所有目的や市場価格の有無などによって、流動資産たる有価証券と固定資産た\n る有価証券に分類される。流動資産に属するのは、（ａ）時価の変動により利益を得ることを目的と\n して保有する有価証券、および（ｂ）1 年内に満期の到来する社債その他の債券だけであり、これ以\n 外の有価証券は固定資産に属する。\n（Ｂ）流動資産に分類されたものは「有価証券」の名称で、また固定資産に分類されたものは「投資\n 有価証券」の名称で貸借対照表に記載する。投資有価証券のうち関係会社の株式と社債について\n は、それぞれ「関係会社株式」および「関係会社社債」として、別科目で掲記しなければならない。\n（Ｃ）購入した有価証券の取得価額は、購入代価に、証券会社へ支払う仲介手数料等の付随費\n 用を加算して決定する。すでに保有しているのと同じ銘柄の有価証券を、帳簿価額とは異なった価額\n で取得したときは、総平均法や移動平均法などの平均原価法を適用して、単位当たりの新たな取得\n 原価を算定する。\n（Ｄ）有価証券のような金融商品は、売買契約の締結日に取引を記録する約定日基準で会計処理\n するのが原則である。ただし、修正約定日基準によることもでき、この基準のもとでは、決算日までの時\n 価変動による損益だけが先に認識され、有価証券の移転は受渡日に記録される。", "answer": "D\n・修正約定日→修正受\n渡日", "topic": "有価証\n券の取\n得価額", "chapter": 5}, {"no": 153, "page": 54, "type": "穴埋め", "question": "・売買目的有価証券は(1)______________をもって貸借対照表価額とし、評価差額は\n (2)______________として損益計算書での当期純利益の計算に含める。なおここに時価とは、企\n 業会計基準第30 号「時価の算定に関する会計基準」に従い、算定日に市場参加者間で秩序ある\n 取引が行われると想定した場合に、その有価証券の(3)______________によって受取る価格をい\n う。決算時に時価評価した有価証券のその後の会計処理方法には、(4)______________方式\n と(5)______________方式の2 通りがある。(4)______________では、前期末に計上した\n 評価差額を翌期首に戻し入れて、いったんもとの帳簿価額に復元したうえで、翌期末の新たな時価と\n の比較が行われる。これに対し(5)______________方式では、前期末の時価評価額が翌期首に\n 修正されることなく、そのまま帳簿価額として引き継がれる。\n\n・満期保有目的の債券について万一、時価変動による利益獲得へと目的を変更した時には\n (6)______________で評価する等、保有目的を変更した場合には変更後の目的に従った会計\n 処理を行う。債券を取得した企業の取得原価が債券の額面金額と異なり、その差額が金利の調整と\n 認められるときは、この事実を反映した(7)______________による価額で、貸借対照表に計上し\n なければならない。額面より安く取得したものを増額していく場合を(8)______________とよび、逆\n に額面より高く取得したものを減額する場合を(9)______________とよぶこともある。償却原価法\n によって差額を調整する具体的な方法には実効利子率による複利計算を前提とした\n (10)______________と毎期均等額ずつ差額を配分する(11)______________がある。配\n 分された増額または減額分は、利払日に受取る利息とあわせて、(12)______________として損\n 益計算書に計上する。\n\n・子会社株式と関連会社株式の期末評価は(13)______________で評価する。\n\n・企業が保有する有価証券の中には、売買目的や満期保有目的の有価証券、および子会社や関連\n 会社の株式のいずれにも該当しないものがあり、(14)______________とよばれる。時価で把握で\n きる有価証券の期末評価は(15)______________で評価する。その他有価証券が実際に売却\n されるまでは時価変動による評価差額を損益計算書に含めることなく貸借対照表の純資産の部の", "answer": "(1)時価\n(2)有価証券運用損益\n(3)売却取引\n(4)洗い替え\n(5)切放し\n(6)時価\n(7)償却原価法\n(8)アキュムレーション\n(9)アモチゼーション\n(10)利息法\n(11)定額法\n(12)有価証券利息\n(13)取得原価\n(14)その他有価証券\n(15)時価\n(16)その他有価証券\n評価差額金\n(17)純資産直入\n(18)全部純資産直入\n(19)部分純資産直入\n(20)洗い替え\n(21)減損処理\n(22)切放し", "topic": "有価証\n券の期\n末評価", "chapter": 5}, {"no": 154, "page": 55, "type": "誤答選\n択", "question": "（Ａ）売買目的の有価証券（時価変動からの利益獲得を目的に保有する市場性のある有価証\n 券）の期末評価は時価で行うが、時価変動による評価差額は貸借対照表の純資産の部へ直接的\n に計上する。\n （Ｂ）満期保有目的の債券（満期まで所有する意図で保有する社債等の債券）の期末評価は償\n 却原価で計上する。償却原価法の適用で生じた貸借対照表価額の増額・減額分は損益計算書に\n 計上して純利益の計算に含める。\n （Ｃ）子会社株式・関連会社株式の期末評価は取得原価で評価する。時価や実質価額の著しい\n 下落が発生した場合における減損処理は、時価で把握できるものは時価まで評価額を切り下げ、時\n 価で把握することが極めて困難と認められるものは実質価額まで評価額を切り下げる。\n （Ｄ）Ａ～Ｃに記載以外の有価証券で時価で把握できる有価証券の期末評価は時価で評価す\n る。期末に計上した評価差額は、翌期首に戻し入れて元の帳簿価額を復元する洗い替え方式が適\n 用される。", "answer": "A\n・有価証券運用損益と\n して損益計算書での\n 当期純利益の計算に\n 含める", "topic": "有価証\n券の期\n末評価", "chapter": 5}, {"no": 155, "page": 56, "type": "誤答選\n択", "question": "（Ａ）売買目的有価証券は、時価をもって貸借対照表価額とし、評価差額は有価証券運用損益と\n して損益計算書での当期純利益の計算に含める。\n（Ｂ）償却原価法とは、債券等をその額面金額と異なる価額で取得した場合に、その差額を償還期\n まで毎期一定の方法で、逐次、貸借対照表価額に加算または減算する方法をいう。償却原価法によ\n って差額を調整する具体的な方法には、定率法と定額法がある。\n（Ｃ）決算時に時価評価した有価証券のその後の会計処理方法には、洗い替え方式と切放し方式\n の2 通りがある。洗い替え方式では、前期末に計上した評価差額を翌期首に戻し入れて、いったんもと\n の帳簿価額に復元したうえで、翌期末の新たな時価との比較が行われる。\n（Ｄ）キャッシュ・フロー計算書によって企業の資金の変動をよりいっそう適切に表示するには、企業が営\n む活動の種類に応じて、キャッシュ・フローを区分するのが有効である。この目的のために企業活動は、\n ①営業活動、②投資活動、③財務活動の3 つに区分される。", "answer": "B\n・定率法→利息法", "topic": "有価証\n券の期\n末評価", "chapter": 5}, {"no": 156, "page": 56, "type": "誤答選\n択", "question": "（Ａ）会計上で有価証券とは、金融商品取引法に列挙された証券をいう。株式会社以外の会社や\n 各種の協同組合に対して出資した額は、有価証券ではなく出資金として取扱われる。\n（Ｂ）会社がいったん発行した自社の株式を取得して保有しているとき、その株式を自己株式または金\n 庫株という。自己株式は、資金調達時に発行した株式の買戻しであり、資本の減少を意味するから資\n 産とせず、貸借対照表の株主資本から控除する形式で記載する。\n（Ｃ）売買目的有価証券は、時価をもって貸借対照表価額とし、評価差額を損益計算書に含めるこ\n となく、貸借対照表の純資産の部に直接的に計上する。\n（Ｄ）償却原価法とは、債券等をその額面金額と異なる価額で取得した場合に、その差額を償還期\n まで毎期一定の方法で、逐次、貸借対照表価額に加算または減算する方法をいう。償却原価法によ\n って差額を調整する具体的な方法には、利息法と定額法がある。", "answer": "C\n・有価証券運用損益と\n して損益計算書での\n 当期純利益の計算に\n 含める", "topic": "有価証\n券の期\n末評価", "chapter": 5}, {"no": 157, "page": 57, "type": "誤答選\n択", "question": "（Ａ）売買目的有価証券は、時価をもって貸借対照表価額とし、評価差額は有価証券運用損益と\n して損益計算書での当期純利益の計算に含める。\n（Ｂ）子会社株式と関連会社株式は、取得原価で評価する。\n（Ｃ）満期保有目的の債券は、保有目的を変更しない場合はたとえ途中で時価が変化しても企業は\n 売却しないため、必ず取得原価で貸借対照表に計上する。\n（Ｄ）償却原価法により、債券等をその額面金額と異なる価額で取得した場合に、その差額を償還\n 期まで毎期一定の方法で増額する場合をアキュムレーションといい、減額する場合をアモチゼーションと\n いう。", "answer": "C\n・取得原価→償却原価", "topic": "有価証\n券の期\n末評価", "chapter": 5}, {"no": 158, "page": 57, "type": "穴埋め", "question": "・(1)______________とは、もともと派生物という意味であり、株式・債券・預貯金などの伝統的な\n 金融資産から派生してきた新しい金融取引をいう。経済的機能の観点から、国債などの金融資産を、\n 将来に受け渡しするときの価格を前もって現時点で契約しておく(2)______________取引、\n 将来に一定の価格で特定の金融資産を買う権利または売る権利を現時点で売買し、権利の買い手\n はその権利を行使しても放棄してもよいという(3)______________取引、\n および2 つの企業が債権（または債務）等の利子や元金を将来において受取る権利（または支払う\n 義務）を現時点で交換する(4)______________取引の3 類型に分類される。デリバティブ取引\n に係る契約は、一般の金融資産および金融負債とともに、(5)______________と総称される。", "answer": "(1)デリバティブ\n(2)先物\n(3)オプション\n(4)スワップ\n(5)金融商品", "topic": "デリバテ\nィブの意\n味と種\n類", "chapter": 5}, {"no": 159, "page": 57, "type": "正答選\n択", "question": "デリバティブ取引を経済的機能の観点から分類すると３類型に分類され、その３類型とは、\n ア．先物取引：国債などの金融資産を、将来に受け渡しするときの価格を前もって現時点で契約して\n おく取引\n イ．オプション取引：将来に一定の価格で特定の金融資産を買う権利または売る権利を現時点で売\n 買し、権利の買い手はその権利を行使しても放棄してもよいという取引\n ウ．ヘッジ取引：財貨の価格変動等による損失の可能性を減殺することを目的として、先物取引など\n を手段として利用する取引である。\n エ．すべて誤り", "answer": "ア,イ\n・3 類型は先物、オプシ\n ョン、スワップ", "topic": "デリバテ\nィブの意\n味と種\n類", "chapter": 5}, {"no": 160, "page": 58, "type": "正答選\n択", "question": "デリバティブ取引を経済的機能の観点から分類すると、\n ア．先物取引：将来に一定の価格で特定の金融資産を買う権利または売る権利を現時点で売買\n し、権利の買い手はその権利を行使しても放棄してもよいという取引\n イ．オプション取引：国債などの金融資産を、将来に受渡しする時の価格を前もって現時点で契約し\n ておく取引\n ウ．スワップ取引：2 つの企業が債権（または債務）等の利子や元金を将来において受取る権利\n （または支払う義務）を現時点で交換する取引の3 類型に分類される。\n エ．すべて誤り", "answer": "ウ\n・先物とオプションの説明\n が逆", "topic": "デリバテ\nィブの意\n味と種\n類", "chapter": 5}, {"no": 161, "page": 58, "type": "穴埋め", "question": "・デリバティブ取引の会計の特徴は、契約に伴って生じる債権と債務について、契約の\n (1)______________時点ではなく契約の(2)______________時点でその発生を認識し、決\n 算日に(3)______________で評価した正味の債権または債務の金額を、貸借対照表に資産ま\n たは負債として計上するとともに、時価変動による評価差額を当期の(4)______________として\n 処理するという点である。\n\n・財貨の価格変動等による損失の可能性を減殺することを目的として、先物取引などを手段として利用\n する取引を(5)______________取引という。", "answer": "(1)決済\n(2)締結\n(3)時価\n(4)損益\n(5)ヘッジ", "topic": "デリバテ\nィブ取引\nの会計", "chapter": 5}, {"no": 162, "page": 58, "type": "正答選\n択", "question": "デリバティブ取引の会計の特徴は、\n ア．契約に伴って生じる債権と債務について、契約の決済時点ではなく契約の締結時点でその発生を\n 認識する\n イ．時価で評価した正味の債権または債務の金額を、貸借対照表に資産または負債として計上する\n ウ．時価変動による評価差額を当期の損益として処理するという点である。\n エ．すべて誤り", "answer": "ア,イ,ウ\n・覚える", "topic": "デリバテ\nィブ取引\nの会計", "chapter": 5}, {"no": 163, "page": 59, "type": "穴埋め", "question": "・ヘッジ取引において、相場変動等による損失の可能性を回避しようとする対象項目を\n (1)______________といい、その目的のために利用されるデリバティブなどを\n (2)______________という。(3)______________とは、ヘッジ対象の損益とヘッジ手段の損\n 益を同一の会計期間に認識し、ヘッジの効果を会計に反映させるための特殊な会計処理をいう。ヘッ\n ジ会計の方法には、(4)______________会計および(5)______________会計とよばれる２\n 通りの方法があり、「金融商品に関する会計基準」（32 項）は(6)______________会計を原\n 則とするが、(7)______________会計の採用も認めている。ここに(8)______________会計\n とは、時価評価されているデリバティブなどのヘッジ手段の損益を、ヘッジ対象項目の損益が認識される\n 期間まで、貸借対照表の純資産の部に(9)______________として繰延べる方法である。逆に\n (10)______________会計は、ヘッジ対象の資産や負債に係る相場変動等を損益として当期に\n 繰上げて計上することにより、もともと時価評価されているデリバティブなどのヘッジ手段に係る損益と、同\n 一の会計期間に認識する方法である。", "answer": "(1)ヘッジ対象\n(2)ヘッジ手段\n(3)ヘッジ\n(4)繰延ヘッジ\n(5)時価ヘッジ\n(6)繰延ヘッジ\n(7)時価ヘッジ\n(8)繰延ヘッジ\n(9)繰延ヘッジ損益\n(10)時価ヘッジ", "topic": "ヘッジ会\n計", "chapter": 5}, {"no": 164, "page": 59, "type": "穴埋め", "question": "ヘッジ会計の方法には、(1)______________会計および(2)______________会計とよばれる\n ２通りの方法があり、「金融商品に関する会計基準」（32 項）は(1)______________会計を\n 原則とするが、(2)______________会計の採用も認めている。", "answer": "(1)繰延ヘッジ\n(2)時価ヘッジ", "topic": "ヘッジ会\n計", "chapter": 5}, {"no": 165, "page": 59, "type": "誤答選\n択", "question": "（Ａ）現金には、紙幣と通貨だけでなく、金銭と同一の性質をもつものが含まれる。\n（Ｂ）預金には、金融機関に対する各種の預金・貯金・掛金、金銭信託などが含まれるが、決算目の\n 翌日から起算して1 年以内に期限が到来するものは、流動資産として取り扱われる。\n（Ｃ）会計上で有価証券とは、金融商品取引法に列挙された証券をいう。\n（Ｄ）ヘッジ会計の方法には、繰延ヘッジ会計および時価ヘッジ会計とよばれる2 通りの方法があり、\n 「金融商品に関する会計基準」は時価ヘッジ会計を原則とするが、繰延ヘッジ会計の採用も認めてい\n る。", "answer": "D\n・繰延ヘッジを原則とす\n るが時価ヘッジも認め\n ている", "topic": "ヘッジ会\n計", "chapter": 5}, {"no": 166, "page": 59, "type": "穴埋め", "question": "企業が現金収入の余剰を生み出す能力や、債務を返済する能力を評価するには、損益計算書と貸借\n 対照表に加えて、収入・支出に関する情報を記載した(1)______________が必要になる。", "answer": "(1)キャッシュ・フロー計\n算書", "topic": "資金情\n報の必\n要性", "chapter": 5}, {"no": 167, "page": 60, "type": "穴埋め", "question": "わが国のキャッシュ・フロー計算書が対象とする資金の範囲は現金および(1)______________に限\n 定されている。現金には、手許現金だけでなく、当座預金・普通預金・通知預金などの\n (2)______________も含まれる。また現金同等物とは、容易に(3)______________すること\n ができ、かつ価値に変動について僅少な(4)______________しか負わない短期投資をいう。たとえ\n ば取得日から満期日または償還日までの期間が(5)______________以内の短期投資である定\n 期預金やコマーシャル・ペーパーなどがその例である。株式等は(6)______________が高いから、た\n とえ短期利殖目的で保有する市場性のある銘柄であっても、資金の範囲には含まれない。", "answer": "(1)現金同等物\n(2)要求払預金\n(3)換金\n(4)リスク\n(5)3 ヶ月\n(6)価格変動リスク", "topic": "資金の\n概念", "chapter": 5}, {"no": 168, "page": 60, "type": "正答選\n択", "question": "キャッシュ・フロー計算書が対象とする資金の範囲は現金および現金同等物に限定されているが、この現\n 金および現金同等物には、\n（Ａ）要求払預金\n （Ｂ）取得日から満期日までの期間が６か月の定期預金\n （Ｃ）短期利殖目的で保有する市場性のある株式が含まれる。\n （Ｄ）全て誤り", "answer": "A\n・定期預金は満期まで\n 3 ヶ月以内\n・短期利殖目的の株式\n は価格変動リスクが高\n いから資金の範囲には\n 含まれない", "topic": "資金の\n概念", "chapter": 5}, {"no": 169, "page": 60, "type": "正答選\n択", "question": "キャッシュ・フロー計算書が対象とする現金同等物には\nア．短期投資の定期預金\n イ．短期投資のコマーシャル・ペーパー\n ウ．短期利殖目的の株式が含まれる。\n エ．すべて誤り", "answer": "ア,イ\n・短期利殖目的の株式\n は価格変動リスクが高\n いから資金の範囲には\n 含まれない", "topic": "資金の\n概念", "chapter": 5}, {"no": 170, "page": 61, "type": "穴埋め", "question": "キャッシュ・フロー計算書によって企業の資金の変動をよりいっそう適切に表示するには、企業が営む活動\n の種類に応じて、キャッシュ・フローを区分するのが有効である。この目的のために企業活動は、\n (1)______________活動、(2)______________活動および(3)______________という\n 3 つに区分される。(1)______________活動は企業が主として営む事業に関連する活動であり、\n この区分では売上収入や商品・原材料の仕入の支出、人件費や販売・管理費の支出が中心となる。\n (2)______________活動は、設備投資、証券投資、融資の3 つから構成される。これらはいず\n れも調達資金を各種の資産に投下することに関連している。(3)______________活動は資金の\n 調達と返済から成る。", "answer": "(1)営業\n(2)投資\n(3)財務", "topic": "キャッシ\nュ・フロー\nの区分\n表示", "chapter": 5}, {"no": 171, "page": 61, "type": "正答選\n択", "question": "キャッシュ・フロー計算書によって企業の資金の変動をよりいっそう適切に表示するには、企業が営む活動\n の種類に応じて、キャッシュ・フローを区分するのが有効である。この目的のために企業活動は、\nア．営業活動\n イ．投資活動\n ウ．資本活動という３つに区分される。\n エ．すべて誤り", "answer": "ア,イ\n・キャッシュフローの区分\n は営業、投資、財務", "topic": "キャッシ\nュ・フロー\nの区分\n表示", "chapter": 5}, {"no": 172, "page": 61, "type": "正答選\n択", "question": "キャッシュ・フロー計算書によって企業の資金の変動をよりいっそう適切に表示するには、企業が営む活動\n の種類に応じて、キャッシュ・フローを区分するのが有効である。この目的のために企業活動は、\nア．営業活動\n イ．投資活動\n ウ．税務活動という3 つに区分される。\n エ．すべて誤り", "answer": "ア,イ\n・キャッシュフローの区分\n は営業、投資、財務", "topic": "キャッシ\nュ・フロー\nの区分\n表示", "chapter": 5}, {"no": 173, "page": 61, "type": "穴埋め", "question": "キャッシュ・フロー計算書の3 区分のうち、営業活動の区分の作成と表示の方法には、\n (1)______________と(2)______________の2 通りがある。これに対し投資活動と財務活\n 動の区分について存在するのは、(3)______________だけである。", "answer": "(1)直接法\n(2)間接法\n(3)直接法", "topic": "キャッシ\nュ・フロー\n計算書\nの作成\n方法", "chapter": 5}, {"no": 174, "page": 62, "type": "穴埋め", "question": "・各企業は、それぞれの(1)______________を反復的に繰返すことにより、事業を営んでいる。\n・市場見込生産を行う企業の収益は、財やサービスの販売時点で計上するのが最も適切である。この収\n 益認識の方法を(2)______________という。\n・(3)______________は生産プロセスの進行や完了を基礎とするものであり、取引される財やサービ\n スの形態に応じて、時間基準、工事進行基準、収穫基準などの名称でよばれる。\n・代金が実際に回収されるまで収益の計上を繰延しておき、代金の回収時点で回収額だけ収益を計上\n する方法を(4)______________という。\n・これまで法人税法では、所定の条件を満たす取引を長期割賦販売等とよび、分割払いの代金額だけ\n をその回収期限の到来時点で売上収益に計上する会計処理を、(5)______________と名づけ\n て認めてきた。しかし2023 年4 月以降に開始する事業年度の取引からは、この処理に基づく課税所\n 得計算は認められなくなる。", "answer": "(1)営業循環\n(2)販売基準\n(3)生産基準\n(4)回収基準\n(5)延払基準", "topic": "3 通りの\n収益認\n識基準", "chapter": 6}, {"no": 175, "page": 62, "type": "正答選\n択", "question": "生産以前に販売契約が締結されていたり、製品の販売を保証する市場が存在するため、生産プロセス\n の進行や完了に伴って収益を計上するのが適切なケースとしては、\n ア．継続的役務提供契約における販売基準\n イ．所定の工事契約における時間基準\n ウ．貴金属や契約栽培の農産物の取引における回収基準がある。\n エ．すべて誤り", "answer": "エ\n・継続的役務提供契\n約：時間基準\n・工事契約：工事進行\n基準\n・貴金属、契約栽培：\n収穫基準", "topic": "3 通りの\n収益認\n識基準", "chapter": 6}, {"no": 176, "page": 62, "type": "正答選\n択", "question": "営業循環における収益認識基準には、\nア．販売基準\n イ．実現基準\n ウ．回収基準という3 つの基準がある。\n エ．すべて誤り", "answer": "ア,ウ\n・収益認識基準：販売\n 基準、生産基準、回\n収基準", "topic": "3 通りの\n収益認\n識基準", "chapter": 6}, {"no": 177, "page": 63, "type": "誤答選\n択", "question": "（Ａ）通常の製品販売やサービス提供に関する最も原則的な収益認識基準は、販売基準である。こ\n の基準によれば、（a）製品の引渡しやサービスの提供が行われ、（b）対価として現金・受取手形・\n 買掛金などの貨幣性資産が取得された時点で、その貨幣性資産の額に基づいて売上収益を計上す\n る。\n（Ｂ）内部利益とは、企業の部門間での商品等の受渡しに際して所定の利益を加算したうえで、内\n 部売上および内部仕入として記録する場合に、利益が加算された商品等のうち、期末に企業内に残\n 留している商品等に含まれる未実現利益をいう。したがって、対外的に公表する財務諸表では、この内\n 部利益を除去しなければならない。\n（Ｃ）割賦販売は通常の販売と異なり、代金の回収が長期にわたり、かつ分割払いであるため、代金\n 回収上の危険率が高いだけでなく、回収に付随して諸費用も発生する。割賦販売を行う企業は、\n （a）販売基準、（b）回収期限到来基準、（c）一回収基準のうち選択した方法を、重要な会\n 計方針として注記しなければならない。\n（Ｄ）受取手形は、商品の売上やサービスの提供など、得意先との間の通常の取引の対価として受け\n 取った手形債権である。受取手形には、満期目を待って現金化する以外に、割引および裏書譲渡とい\n う2 通りの利用方法がある。", "answer": "A\n・買掛金→売掛金", "topic": "3 通りの\n収益認\n識基準", "chapter": 6}, {"no": 178, "page": 63, "type": "穴埋め", "question": "売上高や営業収益の会計処理は、これまで長らく企業会計原則に準拠してきたが、2021 年4 月以\n 降の開始年度からは企業会計基準第29 号(1)______________に基づいて行われている。新\n 基準は、売上高などの収益を、企業が契約上の(2)______________を充足した時に認識するこ\n ととし、企業から顧客への財やサービスに対する支配の移転が(3)______________で生じる場合と\n (4)______________にわたり継続的に生じる場合を区別して、企業による履行義務の充足パター\n ンを2 通りに分類する。そして一時点で支配が移転する取引には(5)______________を適用し、\n 継続的に支配が移転する取引には工事進行基準のような(6)______________の適用を求めて\n いる。しかし履行義務の充足時期から大きく遅れて収益を認識することになる\n (7)______________は排除されている。", "answer": "(1)収益認識に関する\n会計基準\n(2)履行義務\n(3)一時点\n(4)一定期間\n(5)販売基準\n(6)生産基準\n(7)回収基準", "topic": "会計基\n準の新\n設", "chapter": 6}, {"no": 179, "page": 64, "type": "穴埋め", "question": "収益認識の新基準は、国際基準の考え方に従い、収益認識を5 段階に区分して規定している。\n１．(1)______________の識別\n２．そこに含まれる (2)______________、すなわち収益認識の単位の特定\n３．(3)______________の算定\n４．その (4)______________\n５．(5)______________を充足した一時点での、または一定期間にわたる、収益の認識", "answer": "(1)契約\n(2)履行義務\n(3)取引価格\n(4)配分\n(5)履行義務", "topic": "新基準\nによる収\n益認識\nの概要", "chapter": 6}, {"no": 180, "page": 64, "type": "誤答選\n択", "question": "（Ａ）2021 年4 月以降の開始年度から適用される収益認識（企業会計基準第２９号「収益認\n 識に関する会計基準」、以下本問において同様。）の第１ステップは、会計処理の対象となる契約を\n 識別することである。対価の回収に大きな不確実性がある契約は、約束した対価額のうち回収できな\n い可能性より回収できる可能性の方が高い部分だけが収益認識の対象となる。\n（Ｂ）収益認識の第２ステップは、契約に含まれる履行義務を識別することであり、１つの契約が複\n 数の履行義務から構成される場合は、識別された履行義務のそれぞれが収益認識の単位となる。そし\n て、別個の履行義務として判断されるためには、約束された財やサービスから、顧客がそれ単独で（ま\n たは他の経済的資源と組み合わせて）便益を享受することができ、契約に含まれる他の約束と区別で\n きなければならない。ただし、契約全体に照らして重要性が乏しい財やサービスについては、履行義務で\n あるかを評価しないことができる。\n（Ｃ）収益認識の第３ステップは取引価格を算定すること、第４ステップは取引価格を履行義務に配\n 分（１契約が複数の履行義務を含む場合）することである。取引価格が複数の履行義務に対する\n ものである場合は、決算日時点の独立販売価格の比率に基づき、取引価格を履行義務に配分す\n る。\n（Ｄ）収益認識の最終ステップは、一時点で充足される履行義務または一定期間にわたり充足される\n 履行義務に分類された取引の収益を認識することである。一定期間にわたり充足される履行義務に分\n 類された取引は、充足の進捗度を見積って、これに基づいて収益を一定の期間にわたり認識する。この\n 会計処理の結果が十分な信頼性を有するためには、履行義務の充足の進捗度を合理的に見積るこ\n とができなければならない。そのための見積方法にはアウトプット法とインプット法がある。", "answer": "C\n・決算日→取引開始日", "topic": "新基準\nによる収\n益認識\nの概要", "chapter": 6}, {"no": 181, "page": 65, "type": "穴埋め", "question": "・契約とは、企業と顧客の間に(1)______________のある権利義務を生じさせるような取決めをい\n い、書面・口頭・取引慣行のいずれによるかを問わないが、次のすべての要件を満たす必要がある。\n・当事者が契約を(2)______________し義務の履行を(3)______________しており、当事者\n の(4)______________と(5)______________を識別でき、企業の将来キャッシュ・フローを変\n 化させる(6)______________があり、対価が回収できないより回収できる\n (7)______________の方が高いこと。\n・対価の回収に大きな(8)______________がある契約は、約束した対価額のうち回収できない可\n 能性より回収できる可能性の方が高い部分だけが収益認識の対象となる。これらの要件を満たして識\n 別された契約であっても、完全に(9)______________の段階では収益認識の対象にならない。\n・また形式上は別個の契約でも、それが適切と判断されれば、同一顧客と同時期に契約した複数の契\n 約を結合し、(10)______________と見なして会計処理を行う。", "answer": "(1)法的強制力\n(2)承認\n(3)約束\n(4)権利\n(5)支払条件\n(6)経済的実質\n(7)可能性\n(8)不確実性\n(9)未履行\n(10)単一の契約", "topic": "契約の\n識別", "chapter": 6}, {"no": 182, "page": 66, "type": "穴埋め", "question": "・１つの契約が複数の履行義務から構成される場合は、識別された(1)______________のそれぞ\n れが収益認識の単位となる。顧客との契約において、財やサービスを顧客に移転する約束は、そのそれ\n ぞれが企業にとっての(2)______________である。別個の履行義務として判断されるためには、約\n 束された財やサービスから、顧客がそれ単独で（または他の経済的資源と組み合わせて）\n (3)______________を享受することができ、契約に含まれる他の約束と(4)______________\n できなければならない。ただし、契約全体に照らして(5)______________が乏しい財やサービスにつ\n いては、履行義務であるかを評価しないことができる。\n・企業が取引の本人である場合には顧客から受取る取引価格を(6)______________で売上高に\n 計上するが、代理人である場合には顧客からの受取額から他の当事者への支払額を控除した\n (7)______________だけを収益に計上する。企業が本人に該当するには、顧客への提供前の財\n やサービスを企業が(8)______________していなければならない。\n・取引価格のうち現時点で提供した財やサービスに配分した額は当期の(9)______________として\n 認識するが、オプションに配分された額は(10)______________として計上したうえでオプションの行\n 使や消滅の時に、収益として認識する。\n・顧客に移転した財やサービスが合意された仕様に従っていることを保証するだけであれば、別個の履行\n 義務として識別せず、取引価格の全体を(11)______________としたうえで、保証に伴って発生\n が見込まれるコストについて、(12)______________を設定する。合意された仕様の遵守に加え\n て、保証期間が通常より長期に及ぶなど、追加的なサービスを顧客に提供するものであれば、その追加\n 的保証サービスを別個の履行義務として取り扱い、取引価格の一部を配分して\n (13)______________を計上する。", "answer": "(1)履行義務\n(2)履行義務\n(3)便益\n(4)区別\n(5)重要性\n(6)総額\n(7)純額\n(8)支配\n(9)売上収益\n(10)契約負債\n(11)売上高\n(12)製品保証引当金\n(13)契約負債", "topic": "履行義\n務の識\n別", "chapter": 6}, {"no": 183, "page": 67, "type": "穴埋め", "question": "・企業が顧客から受取る金額であっても、第三者のために(1)______________する部分は、売上\n 収益に含めない。したがって販売時の消費税は、企業が税務当局に変わって回収する額であるから、\n (2)______________方式ではなく(3)______________方式で会計処理しなければならな\n い。\n・顧客と約束した対価のうち、変動する可能性のある部分を(4)______________という。変動対価\n を含む取引は、変動部分の金額を見積もるとともに、対価額の(5)______________が事後的に\n 解消する際に、それ以前に計上した収益の著しい(6)______________が生じない可能性が高い\n と見込まれる金額だけを売上収益に計上し、各決算日に金額の見直しを行う。変動対価の見積に際\n しては、(7)______________による方法と、(8)______________による方法のうち、企業が\n 権利を得ることになる対価額をより適切に予測できる方法を選択し、これを首尾一貫して適用する。\n・取引価格に金融要素が含まれる場合、対価額から(9)______________を除去した額で売上収\n 益を計上する。ただし財やサービスの移転時点から対価回収時点までの期間が\n (10)______________以内であれば、金利分を調整しないことができる。", "answer": "(1)回収\n(2)税込\n(3)税抜\n(4)変動対価\n(5)不確実性\n(6)減額\n(7)最頻値\n(8)期待値\n(9)金利相当分\n(10)1 年", "topic": "取引価\n格の算\n定", "chapter": 6}, {"no": 184, "page": 67, "type": "穴埋め", "question": "取引価格が複数の履行義務に対するものである場合は、取引開始日の(1)______________の比\n 率に基づき取引価格を履行義務に配分する。売上値引は識別されたすべての履行義務に対して\n (2)______________に配分する。ただし(3)______________があれば、一部の履行義務だ\n けに値引相当額を配分してもよい。", "answer": "(1)独立販売価格\n(2)比例的\n(3)合理性", "topic": "履行義\n務への\n配分", "chapter": 6}, {"no": 185, "page": 67, "type": "穴埋め", "question": "履行義務の充足とは、約束した財やサービスに対する(1)______________が企業から顧客に\n (2)______________することをいう。また財やサービスに対する支配とは、その財やサービスの使用\n を(3)______________し、それらが有する(4)______________のほとんどすべてを享受する能\n 力を意味する。", "answer": "(1)支配\n(2)移転\n(3)指図\n(4)便益", "topic": "履行義\n務の充\n足による\n収益の\n認識", "chapter": 6}, {"no": 186, "page": 68, "type": "穴埋め", "question": "割賦販売では、売上高は割賦代金の(1)______________時点ではなく\n (2)______________時点で計上する。\n予約販売では、予約金はいったん(3)______________としておき、財やサービスが移転する時点で\n (4)______________に振り替える。\n試用販売では、顧客の買取りの(5)______________の時点で売上高を計上する。", "answer": "(1)回収\n(2)取引開始\n(3)負債\n(4)売上高\n(5)意思表示", "topic": "通常の\n販売", "chapter": 6}, {"no": 187, "page": 68, "type": "誤答選\n択", "question": "（Ａ）試用販売では、顧客の買取りの意思表示がなければ売上高が計上されない。\n（Ｂ）割賦販売では、割賦代金の回収時点でなければ売上高が計上されない。\n（Ｃ）予約販売では、予約金はいったん負債としておき、財やサービスが移転する時点で売上高に振り\n 替える。\n（Ｄ）委託販売では、売上収益は受託者が商品を最終消費者に販売した時点で計上される。", "answer": "B\n・販売した期の売上収\n益に全額計上", "topic": "通常の\n販売", "chapter": 6}, {"no": 188, "page": 68, "type": "誤答選\n択", "question": "（Ａ）試用販売とは、返品の自由を条件として得意先に商品を発送し、試用のうえ気に入れば買い取\n ってもらう形態の販売取引をいう。この場合、売上収益は得意先が買取りの意思表示をする時点を待\n って計上しなければならない。\n（Ｂ）予約販売とは、将来の商品引渡しやサービスの提供を約束して、買手から予約金をとって行わ\n れる形態の販売取引をいう。この場合、決算日までに商品の引渡しやサービスの提供が完了した部分\n だけを当期の売上収益に計上する。\n（Ｃ）割賦販売とは、その代金を何回かに分割し、定期的に均等額ずつ受け取る形態の販売取引を\n いう。この場合、決算日までに受け取った金額部分だけを当期の売上収益に計上するのが原則であ\n る。\n（Ｄ）委託販売とは、他企業（受託者）に自己の商品の販売を依頼する取引をいう。この場合、収\n 益を計上するのは、受託者がその商品を第三者に販売した時点である。ただ実務上は受託者の販売\n 日を常に正確に把握することが困難なケースもあり、このため、売上計算書が販売のつど送付されてい\n る場合には、計算書が到達した日をもって売上収益を計上することができる。", "answer": "C\n・全額を当期の売上収\n 益に計上", "topic": "通常の\n販売", "chapter": 6}, {"no": 189, "page": 69, "type": "穴埋め", "question": "(1)______________販売とは、企業が自己の商品の販売を他企業（受託者）に依頼する取引\n をいう。逆に、他企業（委託者）の商品の販売を引受ける取引を(2)______________という。\n 委託販売であるか否かは、(3)______________の販売前は委託者が商品を支配し、\n (4)______________による商品の返還要求や第三者への販売が可能であり、委託者が受託者\n に無条件の(5)______________を負わないことを指標として判断する。委託販売による売上収益\n は(6)______________がその商品を第三者に販売した時点である。この販売時点は、受託者か\n らの売上計算書の(7)______________ではなく、売上計算書に示された最終顧客への\n (8)______________による。", "answer": "(1)委託\n(2)受託\n(3)受託者\n(4)委託者\n(5)対価支払義務\n(6)受託者\n(7)到達日\n(8)販売日付", "topic": "特殊な\n販売契\n約", "chapter": 6}, {"no": 190, "page": 69, "type": "誤答選\n択", "question": "（Ａ）顧客と約束した対価のうち、変動する可能性のある部分を変動対価という。たとえば、返品権付\n き販売はこれに該当する。\n（Ｂ）変動対価の見積に際しては、最頻値による方法と、期待値による方法のうち、企業が権利を得\n ることになる対価額をより適切に予測できる方法を選択し、これを首尾一貫して適用する。\n（Ｃ）企業の履行義務の充足とは、約束した財やサービスに対する支配が、企業から顧客に移転する\n ことをいう。\n（Ｄ）委託販売であるか否かは、(a)受託者の販売前は委託者が商品を支配し、(b)委託者による\n 商品の返還要求や第三者への販売が可能であり、(c)委託者が受託者に無条件の対価支払義務を\n 負わないことを指標として判断する。", "answer": "D\n・受託者が委託者に無\n条件の対価支払義務\n を負わないこと", "topic": "特殊な\n販売契\n約", "chapter": 6}, {"no": 191, "page": 69, "type": "穴埋め", "question": "一定期間にわたり充足される履行義務に分類された取引は、充足の(1)______________を見積\n って、これに基づいて収益を一定の期間にわたり認識する。この会計処理の結果が十分な信頼性を有\n するためには、履行義務の充足の進捗度を(2)______________に見積ることができなければなら\n ない。そのための見積方法には(3)______________法と(4)______________法がある。", "answer": "(1)進捗度\n(2)合理的\n(3)アウトプット\n(4)インプット", "topic": "進捗度\nの見積\nもり", "chapter": 6}, {"no": 192, "page": 69, "type": "穴埋め", "question": "経過期間に基づいて収益を計上する方法は生産基準のうちでも特に(1)______________とよばれ\n ることがある。", "answer": "(1)時間基準", "topic": "継続的\n役務提\n供", "chapter": 6}, {"no": 193, "page": 70, "type": "穴埋め", "question": "・履行義務の充足の進捗度に比例して、取引価格を工事期間にわたって配分し、収益として認識する\n 会計処理方法を(1)______________という。進捗度の見積方法は多様であるが、インプット法を\n 適用し、工事原価総額の見積額のうち、当期末までに発生した工事原価の割合として算定する\n (2)______________も1 つの合理的な方法である。\n・(3)______________とは、企業が顧客に移転した財やサービスと交換に受取る対価に対する企\n 業の権利をいう。契約資産は、約束された支払期日が到来した時点で、工事未収入金などの債権の\n 勘定に振替えられる。逆に、財やサービスの移転前に顧客から対価を受取る場合は、対価の受取時と\n 受取期限到来時のいずれか早い時点で、(4)______________を貸借対照表に計上する。\n・工事が完成して顧客への引渡が完了した時点で工事収益を計上する会計処理方法を\n (5)______________という。\n・回収可能と見込まれる費用と同額を収益に計上する会計処理方法を(6)______________とい\n う。", "answer": "(1)工事進行基準\n(2)原価比例法\n(3)契約資産\n(4)契約負債\n(5)工事完成基準\n(6)原価回収基準", "topic": "工事進\n行基準\nを適用\nする工\n事契約", "chapter": 6}, {"no": 194, "page": 70, "type": "穴埋め", "question": "・(1)______________は、顧客との間の通常の取引に基づいて発生した営業上の未収入金であ\n り、サービスの提供による営業収益で未収のものもこれに含まれる。売掛金は受取手形や電子記録債\n 権とあわせて(2)______________とよばれる。売掛金が商品の売上などその企業の主たる営業取\n 引から生じたものであるのに対し、(3)______________は土地や有価証券の売却のような、主た\n る営
